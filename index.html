/* ════════════════════════════════════════════════════════════════
   FEATURE 9 — SRS Spaced Repetition System
════════════════════════════════════════════════════════════════ */
var _srsItems = null;

function getSRSItems() {
  if (!_srsItems) _srsItems = JSON.parse(localStorage.getItem('nz-srs-items')||'null');
  if (!_srsItems) {
    _srsItems = [];
    var n5Kanji = typeof kanjiData !== 'undefined' ? (kanjiData['N5']||[]) : [];
    n5Kanji.slice(0,14).forEach(function(k){
      _srsItems.push({ id:'srs-'+k.id, front:k.kanji, reading:k.reading,
        back:k.meaning, type:'kanji', level:'N5', interval:1, due:Date.now() });
    });
    saveSRS();
  }
  return _srsItems;
}

function saveSRS() {
  try { localStorage.setItem('nz-srs-items', JSON.stringify(_srsItems)); } catch(e) {}
}

function getDueItems() {
  return getSRSItems().filter(function(i){ return i.due <= Date.now(); });
}

function srsGrade(item, grade) {
  var mult = {again:0.25, hard:0.8, good:1.5, easy:2.5}[grade]||1;
  item.interval = Math.max(0.5,(item.interval||1)*mult);
  item.due = Date.now() + item.interval*24*3600000;
  var xpMap = {again:2,hard:3,good:5,easy:10};
  if (window._nzAddXP) window._nzAddXP(xpMap[grade]||5);
  saveSRS();
}

function gradeBtn(grade, label, color) {
  return '<button onclick="nzSRSGrade(\'' + grade + '\')" ' +
    'style="padding:11px;border-radius:10px;font-size:12px;font-weight:700;' +
    'font-family:inherit;cursor:pointer;border:1px solid ' + color + ';' +
    'background:' + color + '18;color:' + color + ';transition:all .15s;" ' +
    'onmouseover="this.style.background=\'' + color + '\';this.style.color=\'#fff\'" ' +
    'onmouseout="this.style.background=\'' + color + '18\';this.style.color=\'' + color + '\'">' + label + '</button>';
}

function updateSRSBadge() {
  var due = getDueItems().length;
  var badge = document.getElementById('nz-srs-badge');
  if (badge) { badge.style.display=due>0?'inline-flex':'none'; badge.textContent=due>99?'99+':String(due); }
}

Pages.srs = function() {
  updateSRSBadge();
  var SRS_LEVELS = ['N5','N4','N3','N2','N1'];
  var selLevel = 'N5';

  function renderLanding() {
    setHTML(
      '<div class="nz-page nz-fadein">' +
        '<div style="margin-bottom:22px;">' +
          '<h1 style="font-size:22px;font-weight:800;color:var(--fg);margin:0 0 4px;">⭐ SRS Review</h1>' +
          '<p style="font-size:13px;color:var(--fg-muted);margin:0;">Pick a level, then a module, to start a focused review session</p>' +
        '</div>' +
        '<div id="nz-srs-lvlsel" style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px;"></div>' +
        '<div id="nz-srs-modsel" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:30px;"></div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin:0 0 13px;flex-wrap:wrap;gap:8px;">' +
          '<h2 style="font-size:15px;font-weight:700;color:var(--fg);margin:0;">Today\'s Mixed Review</h2>' +
          '<span style="font-size:12px;color:var(--fg-muted);">' + getDueItems().length + ' cards due</span>' +
        '</div>' +
        '<div style="display:flex;gap:9px;flex-wrap:wrap;">' +
          '<button onclick="nzSRSStartMixed()" class="nz-btn nz-btn-pri">▶ Start Mixed Review</button>' +
          '<button onclick="nzSRSAddCustom()" class="nz-btn nz-btn-ghost">+ Add Card</button>' +
        '</div>' +
      '</div>'
    );
    renderLevelBar();
    renderModuleButtons();
  }

  function renderLevelBar() {
    var bar = $id('nz-srs-lvlsel');
    if (!bar) return;
    bar.innerHTML =
      '<div style="display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);">' +
        SRS_LEVELS.map(function (lv) {
          var c = jlptColor(lv), active = lv === selLevel;
          return '<button data-srs-lv="' + lv + '" aria-pressed="' + active + '" ' +
            'style="padding:10px 15px;font-size:13px;font-weight:700;font-family:inherit;' +
            'cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;' +
            'border-bottom:2px solid ' + (active ? c : 'transparent') + ';' +
            'background:' + (active ? c + '18' : 'transparent') + ';' +
            'color:' + (active ? c : 'var(--fg-muted)') + ';">' +
            jlptIcon(lv) + ' ' + lv + '</button>';
        }).join('') +
      '</div>';
    bar.querySelectorAll('[data-srs-lv]').forEach(function (btn) {
      btn.onclick = function () { selLevel = btn.dataset.srsLv; renderLevelBar(); renderModuleButtons(); };
    });
  }

  function renderModuleButtons() {
    var mount = $id('nz-srs-modsel');
    if (!mount) return;
    var vCount = typeof VocabPageWords !== 'undefined' ? VocabPageWords.filter(function(w){return vocabWordLevel(w)===selLevel;}).length : 0;
    var kCount = (typeof kanjiData !== 'undefined' && kanjiData[selLevel]) ? kanjiData[selLevel].length : 0;
    var sCount = sentencePracticeData.filter(function(s){return s.level===selLevel;}).length;
    mount.innerHTML =
      srsModCard('語','Vocabulary', vCount+' words · '+selLevel, 'var(--n5)', "window.nzVocabLevelSRS('"+selLevel+"')") +
      srsModCard('漢','Kanji',      kCount+' kanji · '+selLevel,  'var(--n4)', "window.nzKanjiLevelSRS('"+selLevel+"')") +
      srsModCard('文','Sentence Practice', sCount+' sentences · '+selLevel, 'var(--n2)', "window._nzSPLevel='"+selLevel+"';window.nzGo('sentence-practice')");
  }

  window.nzSRSStartMixed = function () { startMixedReview(); };

  function startMixedReview() {
    var items = getDueItems();
    var idx=0, revealed=false, doneCount=0;

    function renderSRS() {
      var item = items[idx];
      if (!item || idx>=items.length) {
        setHTML(
          '<div class="nz-page nz-fadein" style="max-width:560px;">' +
          '<button onclick="Pages.srs()" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;padding:0;margin-bottom:20px;">← Back to SRS Review</button>' +
          '<h1 style="font-size:22px;font-weight:800;color:var(--fg);margin:0 0 4px;">⭐ SRS Review</h1>' +
          '<p style="font-size:13px;color:var(--fg-muted);margin:0 0 24px;">Spaced Repetition System</p>' +
          '<div style="text-align:center;padding:40px;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:16px;">' +
            '<div style="font-size:48px;margin-bottom:12px;">🎉</div>' +
            '<div style="font-size:18px;font-weight:700;color:var(--fg);margin-bottom:6px;">All caught up!</div>' +
            '<div style="font-size:13px;color:var(--fg-muted);">You reviewed ' + doneCount + ' items today.</div>' +
          '</div>' +
          '<div style="display:flex;gap:9px;">' +
            '<button onclick="nzSRSAddCustom()" class="nz-btn nz-btn-ghost">+ Add Card</button>' +
            '<button onclick="window.nzSRSStartMixed()" class="nz-btn nz-btn-ghost">↺ Restart</button>' +
          '</div></div>'
        );
        return;
      }
      setHTML(
        '<div class="nz-page nz-fadein" style="max-width:560px;">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">' +
          '<div><h1 style="font-size:22px;font-weight:800;color:var(--fg);margin:0 0 4px;">⭐ SRS Review</h1>' +
          '<p style="font-size:13px;color:var(--fg-muted);margin:0;">' + (idx+1) + ' / ' + items.length + ' due today</p></div>' +
          '<button onclick="nzSRSAddCustom()" class="nz-btn nz-btn-ghost" style="font-size:12px;padding:7px 12px;">+ Add Card</button>' +
        '</div>' +
        '<div style="background:var(--card);border:1px solid var(--border-strong);border-radius:18px;padding:32px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow);">' +
          '<div style="font-size:11px;font-weight:700;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;">' + H(item.type||'card') + ' · ' + H(item.level||'') + '</div>' +
          '<div role="button" tabindex="0" aria-label="Tap to hear pronunciation" style="font-family:\'Noto Serif JP\',serif;font-size:64px;color:var(--primary);line-height:1;margin-bottom:8px;cursor:pointer;" onclick="speak(\'' + H(item.front) + '\')" title="Tap to hear">' + H(item.front) + '</div>' +
          (item.reading ? '<div style="font-family:var(--font-mono);font-size:14px;color:var(--fg-muted);margin-bottom:16px;">' + H(item.reading) + '</div>' : '<div style="margin-bottom:16px;"></div>') +
          (revealed
            ? '<div style="font-size:16px;font-weight:700;color:var(--fg);padding:14px;background:var(--card-elevated);border-radius:10px;border:1px solid var(--border);">' + H(item.back) + '</div>'
            : '<button onclick="nzSRSReveal()" class="nz-btn nz-btn-pri" style="width:100%;justify-content:center;">Show Answer</button>') +
        '</div>' +
        (revealed
          ? '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">' +
            gradeBtn('again','😰 Again','var(--primary)') +
            gradeBtn('hard','😓 Hard','var(--n3)') +
            gradeBtn('good','😊 Good','var(--n4)') +
            gradeBtn('easy','😄 Easy','var(--n5)') +
            '</div>'
          : '') +
        '</div>'
      );
      window.nzSRSReveal = function(){ revealed=true; renderSRS(); };
      window.nzSRSGrade  = function(g){ srsGrade(item,g); doneCount++; idx++; revealed=false; renderSRS(); };
    }
    renderSRS();
  }

  window.nzSRSAddCustom = function() {
    var ov=document.createElement('div'); ov.className='nz-overlay-bg';
    ov.innerHTML = '<div class="nz-modal-box">' +
      '<button onclick="this.closest(\'.nz-overlay-bg\').remove()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:22px;line-height:1;">×</button>' +
      '<h3 style="font-size:16px;font-weight:700;color:var(--fg);margin:0 0 16px;">⭐ Add SRS Card</h3>' +
      goalField('Front (question)','nz-srs-front','text','Kanji or word') +
      goalField('Reading','nz-srs-reading','text','e.g. もの') +
      goalField('Back (answer)','nz-srs-back','text','Meaning in English') +
      '<label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:5px;">Type</label>' +
      '<select id="nz-srs-type" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;box-sizing:border-box;margin-bottom:14px;">' +
        '<option value="kanji">Kanji</option><option value="vocab">Vocabulary</option><option value="grammar">Grammar</option>' +
      '</select>' +
      '<button onclick="nzSRSSaveCustom()" class="nz-btn nz-btn-pri" style="width:100%;justify-content:center;">Add Card</button></div>';
    document.body.appendChild(ov);
  };

  window.nzSRSSaveCustom = function() {
    var f=document.getElementById('nz-srs-front'); if(!f||!f.value.trim()) return;
    var r=document.getElementById('nz-srs-reading'), b=document.getElementById('nz-srs-back'), t=document.getElementById('nz-srs-type');
    getSRSItems().push({ id:'srs-custom-'+Date.now(), front:f.value.trim(),
      reading:r?r.value.trim():'', back:b?b.value.trim():'',
      type:t?t.value:'kanji', level:'custom', interval:1, due:Date.now() });
    saveSRS(); _srsItems=null;
    var ov=document.querySelector('.nz-overlay-bg'); if(ov)ov.remove();
    Pages.srs();
  };

  renderLanding();
};

function srsModCard(icon, title, sub, color, onclickJs) {
  return '<div class="card nz-mod-card nz-hoverable" tabindex="0" role="button" ' +
    'style="border-top:3px solid ' + color + ';" ' +
    'onclick="' + onclickJs + '" ' +
    'onkeydown="if(event.key===\'Enter\'){' + onclickJs + '}">' +
    '<div style="font-size:26px;color:' + color + ';font-family:var(--font-jp);margin-bottom:10px;">' + icon + '</div>' +
    '<div style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px;">' + title + '</div>' +
    '<div class="text-muted" style="font-size:12px;">' + sub + '</div>' +
    '</div>';
}

/* ════════════════════════════════════════════════════════════════
   SENTENCE PRACTICE — new SRS Review module (dynamic, level-aware)
   Reads from sentencePracticeData (js/nz-data.js). Per-user state
   (bookmark / favorite / review status) stored locally, same pattern
   as the SRS cards above — no new backend required.
════════════════════════════════════════════════════════════════ */
function getSentenceProgress() {
  try { return JSON.parse(localStorage.getItem('nz-sentence-progress')||'{}'); } catch(e){ return {}; }
}
function saveSentenceProgress(p) {
  try { localStorage.setItem('nz-sentence-progress', JSON.stringify(p)); } catch(e){}
}

Pages['sentence-practice'] = function () {
  var SP_LEVELS = ['N5','N4','N3','N2','N1'];
  var level    = SP_LEVELS.indexOf(window._nzSPLevel) !== -1 ? window._nzSPLevel : 'N5';
  window._nzSPLevel = null;
  var PAGE_SIZE = 6;
  var page = 1, query = '', loading = true;
  var progress = getSentenceProgress();
  var data = (typeof sentencePracticeData !== 'undefined') ? sentencePracticeData : [];

  function getFiltered() {
    var list = data.filter(function (s) { return s.level === level; });
    if (query) {
      var q = query.toLowerCase();
      list = list.filter(function (s) {
        return s.jp.includes(q) || s.en.toLowerCase().includes(q) ||
               (s.grammarPoint||'').toLowerCase().includes(q) ||
               (s.tags||[]).join(' ').toLowerCase().includes(q);
      });
    }
    return list;
  }

  function levelBadges() {
    return SP_LEVELS.map(function (lv) {
      var c = jlptColor(lv), active = lv === level;
      return '<button data-sp-lv="' + lv + '" class="nz-btn nz-hoverable" aria-pressed="' + active + '" ' +
        'style="padding:6px 12px;font-size:12px;background:' + (active?c:c+'18') + ';' +
        'color:' + (active?'#fff':c) + ';border:1px solid ' + c + ';font-weight:700;">' + lv + '</button>';
    }).join('');
  }

  function skeletonCards() {
    var out = '';
    for (var i = 0; i < 4; i++) {
      out += '<div class="card" style="padding:18px;">' +
        '<div class="nz-skel" style="height:12px;width:60px;border-radius:6px;margin-bottom:14px;"></div>' +
        '<div class="nz-skel" style="height:20px;width:90%;border-radius:6px;margin-bottom:8px;"></div>' +
        '<div class="nz-skel" style="height:13px;width:70%;border-radius:6px;margin-bottom:12px;"></div>' +
        '<div class="nz-skel" style="height:13px;width:80%;border-radius:6px;"></div>' +
      '</div>';
    }
    return out;
  }

  function sentenceCard(s) {
    var st    = progress[s.id] || {};
    var color = jlptColor(s.level);
    return '<div class="card nz-hoverable" style="padding:18px;border-top:3px solid ' + color + ';">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;">' +
        '<span style="font-size:10px;font-weight:800;color:' + color + ';background:' + color + '18;border:1px solid ' + color + ';padding:2px 8px;border-radius:6px;font-family:var(--font-mono);">' + H(s.difficulty) + '</span>' +
        '<div style="display:flex;gap:6px;">' +
          '<button data-sp-speak="' + H(s.jp) + '" title="Listen" style="background:none;border:none;cursor:pointer;font-size:15px;">🔊</button>' +
          '<button data-sp-bm="' + s.id + '" title="Bookmark" style="background:none;border:none;cursor:pointer;font-size:15px;">' + (st.bookmarked?'🔖':'📑') + '</button>' +
          '<button data-sp-fav="' + s.id + '" title="Favorite" style="background:none;border:none;cursor:pointer;font-size:15px;">' + (st.favorited?'❤️':'🤍') + '</button>' +
        '</div>' +
      '</div>' +
      '<div style="font-family:\'Noto Serif JP\',serif;font-size:19px;color:var(--fg);line-height:1.5;margin-bottom:4px;">' + H(s.jp) + '</div>' +
      '<div style="font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);margin-bottom:8px;">' + H(s.reading) + '</div>' +
      '<div style="font-size:13px;color:var(--fg);margin-bottom:10px;">' + H(s.en) + '</div>' +
      '<div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:10px;">📎 ' + H(s.grammarPoint) + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
        '<div style="display:flex;gap:5px;flex-wrap:wrap;">' +
          (s.tags||[]).slice(0,2).map(function (t) {
            return '<span style="font-size:10px;color:var(--fg-muted);background:var(--card-elevated);border:1px solid var(--border);padding:2px 7px;border-radius:6px;">' + H(t) + '</span>';
          }).join('') +
        '</div>' +
        '<button data-sp-known="' + s.id + '" class="nz-btn" style="padding:5px 10px;font-size:11px;' +
          (st.reviewStatus==='known' ? 'background:var(--n5);color:#fff;' : 'background:var(--card-elevated);color:var(--fg-muted);border:1px solid var(--border);') +
          '">' + (st.reviewStatus==='known'?'✓ Known':'Mark Known') + '</button>' +
      '</div>' +
    '</div>';
  }

  function render() {
    var all = loading ? [] : getFiltered();
    var totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    var pageItems = all.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
    var color = jlptColor(level);

    setHTML(
      '<div class="nz-page nz-fadein">' +
        '<div style="font-size:12px;color:var(--fg-muted);margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
          '<a href="#srs" data-route="srs" style="color:var(--fg-muted);text-decoration:none;">⭐ SRS Review</a>' +
          '<span>›</span><span style="color:var(--fg);font-weight:600;">Sentence Practice</span>' +
        '</div>' +
        '<div style="background:linear-gradient(135deg,' + color + '22,transparent);border:1px solid var(--border);' +
          'border-radius:18px;padding:24px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">' +
          '<div>' +
            '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;">' +
              '<span style="font-size:11px;font-weight:800;color:' + color + ';background:' + color + '18;border:1px solid ' + color + ';padding:3px 10px;border-radius:6px;font-family:var(--font-mono);">' + level + '</span>' +
              '<h1 style="font-size:20px;font-weight:800;color:var(--fg);margin:0;">文 Sentence Practice</h1>' +
            '</div>' +
            '<p style="font-size:13px;color:var(--fg-muted);margin:0;">Real example sentences with readings, translations & grammar notes</p>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + levelBadges() + '</div>' +
        '</div>' +
        '<div style="margin-bottom:18px;">' +
          '<input id="nz-sp-search" type="text" placeholder="Search sentences, meaning, grammar…" value="' + H(query) + '" ' +
          'style="width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);' +
          'color:var(--fg);font-size:13px;font-family:inherit;box-sizing:border-box;">' +
        '</div>' +
        (loading
          ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:22px;">' + skeletonCards() + '</div>'
          : all.length === 0
            ? '<div style="text-align:center;padding:48px;background:var(--card);border:1px solid var(--border);border-radius:16px;">' +
                '<div style="font-size:40px;margin-bottom:10px;">🔍</div>' +
                '<div style="font-size:15px;font-weight:700;color:var(--fg);margin-bottom:4px;">No sentences found</div>' +
                '<div style="font-size:12px;color:var(--fg-muted);">Try a different search, or check back soon — more ' + level + ' sentences are on the way.</div>' +
              '</div>'
            : '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:22px;">' +
                pageItems.map(sentenceCard).join('') +
              '</div>'
        ) +
        (!loading && all.length > PAGE_SIZE
          ? '<div style="display:flex;align-items:center;justify-content:center;gap:10px;">' +
              '<button class="nz-btn nz-btn-ghost" id="nz-sp-prev" ' + (page<=1?'disabled':'') + '>← Prev</button>' +
              '<span style="font-size:12px;color:var(--fg-muted);">Page ' + page + ' / ' + totalPages + '</span>' +
              '<button class="nz-btn nz-btn-ghost" id="nz-sp-next" ' + (page>=totalPages?'disabled':'') + '>Next →</button>' +
            '</div>'
          : '') +
      '</div>'
    );

    var searchEl = $id('nz-sp-search');
    if (searchEl) {
      searchEl.oninput = function () {
        query = searchEl.value; page = 1;
        var caret = searchEl.selectionStart;
        render();
        var ne = $id('nz-sp-search');
        if (ne) { ne.focus(); ne.setSelectionRange(caret, caret); }
      };
    }
    var prevBtn = $id('nz-sp-prev'); if (prevBtn) prevBtn.onclick = function () { page--; render(); };
    var nextBtn = $id('nz-sp-next'); if (nextBtn) nextBtn.onclick = function () { page++; render(); };

    document.querySelectorAll('[data-sp-lv]').forEach(function (btn) {
      btn.onclick = function () {
        level = btn.dataset.spLv; page = 1; query = ''; loading = true;
        render();
        setTimeout(function () { loading = false; progress = getSentenceProgress(); render(); }, 200);
      };
    });
    document.querySelectorAll('[data-sp-speak]').forEach(function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); speak(btn.dataset.spSpeak); };
    });
    document.querySelectorAll('[data-sp-bm]').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var id = btn.dataset.spBm;
        progress[id] = progress[id] || {};
        progress[id].bookmarked = !progress[id].bookmarked;
        saveSentenceProgress(progress);
        btn.textContent = progress[id].bookmarked ? '🔖' : '📑';
      };
    });
    document.querySelectorAll('[data-sp-fav]').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var id = btn.dataset.spFav;
        progress[id] = progress[id] || {};
        progress[id].favorited = !progress[id].favorited;
        saveSentenceProgress(progress);
        btn.textContent = progress[id].favorited ? '❤️' : '🤍';
      };
    });
    document.querySelectorAll('[data-sp-known]').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var id = btn.dataset.spKnown;
        progress[id] = progress[id] || {};
        var nowKnown = progress[id].reviewStatus !== 'known';
        progress[id].reviewStatus = nowKnown ? 'known' : 'learning';
        saveSentenceProgress(progress);
        if (nowKnown && window._nzAddXP) window._nzAddXP(3);
        render();
      };
    });
  }

  render();
  setTimeout(function () { loading = false; render(); }, 200);
};

/* ── Level-wise SRS ── */
window.nzKanjiLevelSRS = function(level) {
  _srsItems = getSRSItems();
  var kd = typeof kanjiData !== 'undefined' ? kanjiData : {};
  (kd[level]||[]).forEach(function(k){
    if (!_srsItems.find(function(x){return x.id==='srs-'+k.id;})) {
      _srsItems.push({ id:'srs-'+k.id, front:k.kanji, reading:k.reading,
        back:k.meaning, type:'kanji', level:level, interval:1, due:Date.now() });
    }
  });
  saveSRS(); runLevelSRS(level,'kanji');
};

window.nzVocabLevelSRS = function(level) {
  var vpw = typeof VocabPageWords !== 'undefined' ? VocabPageWords : [];
  var vList = vpw.filter(function(w){return vocabWordLevel(w)===level;});
  if (!vList.length) { nzShowToast('No vocab found for '+level); return; }
  _srsItems = getSRSItems();
  vList.slice(0,60).forEach(function(w){
    var wid='srs-v-'+(w.id||w.word||w.jp||Math.random());
    if (!_srsItems.find(function(x){return x.id===wid;})) {
      _srsItems.push({ id:wid, front:w.word||w.jp||'', reading:w.reading||'',
        back:w.meaning||w.en||'', type:'vocab', level:level, interval:1, due:Date.now() });
    }
  });
  saveSRS(); runLevelSRS(level,'vocab');
};

function runLevelSRS(level, type) {
  var items = getSRSItems().filter(function(i){return i.level===level&&i.type===type&&i.due<=Date.now();});
  if (!items.length) items = getSRSItems().filter(function(i){return i.level===level&&i.type===type;});
  if (!items.length) { nzShowToast('No '+type+' cards for '+level); return; }

  var idx2=0, revealed2=false, doneCount2=0, reverseMode=false;
  var color=jlptColor(level);
  var backRoute = type==='kanji'?'kanji':'vocab';

  function renderLevelSRS() {
    var item=items[idx2];
    if (!item||idx2>=items.length) {
      setHTML(
        '<div class="nz-page nz-fadein" style="max-width:560px;">' +
        '<button onclick="nzGo(\'' + backRoute + '\')" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;padding:0;margin-bottom:20px;" onmouseover="this.style.color=\'var(--fg)\'" onmouseout="this.style.color=\'var(--fg-muted)\'">← Back</button>' +
        '<div style="text-align:center;padding:40px;background:var(--card);border:1px solid var(--border);border-radius:16px;">' +
          '<div style="font-size:48px;margin-bottom:12px;">🎉</div>' +
          '<div style="font-size:18px;font-weight:700;color:var(--fg);margin-bottom:6px;">' + level + ' ' + type + ' review done!</div>' +
          '<div style="font-size:13px;color:var(--fg-muted);">Reviewed ' + doneCount2 + ' items.</div>' +
        '</div></div>'
      );
      return;
    }
    var faceFront = reverseMode ? item.back : item.front;
    var faceBack  = reverseMode ? item.front : item.back;
    setHTML(
      '<div class="nz-page nz-fadein" style="max-width:560px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;">' +
        '<button onclick="nzGo(\'' + backRoute + '\')" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;padding:0;" onmouseover="this.style.color=\'var(--fg)\'" onmouseout="this.style.color=\'var(--fg-muted)\'">← Back to ' + (type==='kanji'?'Kanji':'Vocab') + '</button>' +
        '<button onclick="nzLvSRSToggleReverse()" title="Study in reverse — answer shown first" ' +
          'style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;' +
          'border:1.5px solid ' + (reverseMode?'var(--primary)':'var(--border)') + ';' +
          'background:' + (reverseMode?'var(--primary)':'var(--card-elevated)') + ';' +
          'color:' + (reverseMode?'#fff':'var(--fg-muted)') + ';">🔀 Reverse Practice' + (reverseMode?' · ON':'') + '</button>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">' +
        '<span style="font-size:11px;font-weight:800;color:' + color + ';background:' + color + '18;border:1px solid ' + color + ';padding:3px 10px;border-radius:6px;font-family:var(--font-mono);">' + level + '</span>' +
        '<span style="font-size:14px;font-weight:700;color:var(--fg);">' + (type==='kanji'?'Kanji':'Vocab') + ' SRS Review</span>' +
        '<span style="font-size:12px;color:var(--fg-muted);margin-left:auto;">' + (idx2+1) + ' / ' + items.length + '</span>' +
      '</div>' +
      '<div style="background:var(--card);border:1px solid var(--border-strong);border-radius:18px;padding:32px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow);">' +
        '<div role="button" tabindex="0" aria-label="Tap to hear pronunciation" style="font-family:\'Noto Serif JP\',serif;font-size:' + (reverseMode?'26px':'64px') + ';color:' + color + ';line-height:1.3;margin-bottom:8px;cursor:pointer;" onclick="speak(\'' + H(item.front) + '\')" title="Tap to hear">' + H(faceFront) + '</div>' +
        (!reverseMode && item.reading ? '<div style="font-family:var(--font-mono);font-size:14px;color:var(--fg-muted);margin-bottom:16px;">' + H(item.reading) + '</div>' : '<div style="margin-bottom:16px;"></div>') +
        (revealed2
          ? '<div style="font-size:16px;font-weight:700;color:var(--fg);padding:14px;background:var(--card-elevated);border-radius:10px;border:1px solid var(--border);">' + H(faceBack) + (reverseMode && item.reading ? '<div style="font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);font-weight:400;margin-top:6px;">' + H(item.reading) + '</div>' : '') + '</div>'
          : '<button onclick="nzLvSRSReveal()" class="nz-btn nz-btn-pri" style="width:100%;justify-content:center;">Show Answer</button>') +
      '</div>' +
      (revealed2
        ? '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">' +
          gradeBtn('again','😰 Again','var(--primary)') +
          gradeBtn('hard','😓 Hard','var(--n3)') +
          gradeBtn('good','😊 Good','var(--n4)') +
          gradeBtn('easy','😄 Easy','var(--n5)') +
          '</div>'
        : '') +
      '</div>'
    );
    window.nzLvSRSReveal = function(){ revealed2=true; renderLevelSRS(); };
    window.nzLvSRSToggleReverse = function(){ reverseMode=!reverseMode; revealed2=false; renderLevelSRS(); };
    window.nzSRSGrade    = function(g){ srsGrade(item,g); doneCount2++; idx2++; revealed2=false; renderLevelSRS(); };
  }
  renderLevelSRS();
}

          'border-bottom:2px solid transparent;background:transparent;color:' + c + ';transition:all .15s;" ' +
          'onmouseover="this.style.background=\'' + c + '18\';this.style.borderBottomColor=\'' + c + '\'" ' +
          'onmouseout="this.style.background=\'transparent\';this.style.borderBottomColor=\'transparent\'">' +
          jlptIcon(lv) + ' ' + lv + '</button>';
      }).join('') +
    '</div>';

  /* Insert SRS row after the header block */
  var headerEl = page.querySelector('#nz-vocab-header-block');
  if (headerEl && headerEl.nextSibling) {
    page.insertBefore(srsRow, headerEl.nextSibling);
  } else {
    page.appendChild(srsRow);
  }
}

     insert it (plus Goals/SRS/Notes) directly before the real "Tools"
     heading already in the base sidebar — rendering "Tools" twice in a row.
     Goals / SRS Review / Smart Notes belong under "Community" (per the

  var goalsLink = createNavEl('goals', '🎯','My Goals', 'n1');

  if (toolsSect) {

    nav.insertBefore(srsLink,    toolsSect);

  } else {

  var sbTop=document.querySelector('.nz-sb-top');
  if (sbTop && !document.getElementById('nz-theme-toggle-desk')) {

    tbDesk.id='nz-theme-toggle-desk';
    tbDesk.type='button';
    tbDesk.textContent=(window._nzTheme === 'dark' ? '🌸' : window._nzTheme === 'light' ? '🧡' : '🌙');
    tbDesk.setAttribute('aria-label','Switch theme');
    tbDesk.title='Switch theme';
    tbDesk.style.cssText='background:none;border:none;font-size:16px;cursor:pointer;' +
      'margin-left:auto;padding:4px 6px;border-radius:6px;color:var(--fg-muted);transition:all .2s;';
    tbDesk.onclick=function(){
      window.nzToggleTheme();
    };
    sbTop.appendChild(tbDesk);
  }

  setTimeout(injectThemeAndNotifButtons, 60);
};

function createNavEl(route, icon, label, colorToken) {
  var a=document.createElement('a');
  a.href='#'+route; a.dataset.route=route; a.className='nz-navlink';
  var iconHtml = colorToken
    ? '<span class="nz-navicon nz-navicon-chip" style="background:var(--' + colorToken + '-dim);color:var(--' + colorToken + ');">' + icon + '</span>'
    : '<span class="nz-navicon">'+icon+'</span>';
  a.innerHTML = iconHtml + '<span class="nz-navlabel">'+label+'</span>';
  return a;
}

/* ════════════════════════════════════════════════════════════════
   N2 SOUMATOME PRACTICE TESTS — 7th-day weekly review quizzes
   Self-contained page (no dependency on the external VocabPage
   module): lists the 8 weekly tests, lets the user take one via
   the existing quizBlock() engine, and shows a final score on
   completion. Reads window.NZChapterData.N2 chapters flagged
   isTest === true (added by the Soumatome data update).
════════════════════════════════════════════════════════════════ */
Pages['n2-practice-tests'] = function () {
  var testChapters = ((window.NZChapterData && window.NZChapterData.N2) || [])
    .filter(function (c) { return c.isTest; })
    .sort(function (a, b) { return a.week - b.week; });

  var selected    = null;
  var quizAns     = {};
  var showResults = false;

  function bestScore(week) {
    var p = nzProgGet('n2practicetest', 'W' + week);
    return (p && typeof p.bestScore === 'number') ? p : null;
  }

  function renderList() {
    var color = jlptColor('N2');
    setHTML(
      '<div class="nz-page nz-fadein">' +
      '<div style="margin-bottom:20px;">' +
        '<h1 style="font-size:22px;font-weight:800;color:var(--fg);margin:0 0 4px;' +
          'letter-spacing:-.4px;">🈴 N2 Soumatome Practice Tests</h1>' +
        '<p style="font-size:13px;color:var(--fg-muted);margin:0;">' +
          'Day-7 review quizzes from Nihongo Sou Matome N2 — 30 questions per week</p>' +
      '</div>' +
      (testChapters.length === 0
        ? '<div class="card" style="padding:40px;text-align:center;color:var(--fg-muted);">' +
            '<p style="font-size:13px;margin:0;">No N2 practice tests available yet.</p></div>'
        : '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;">' +
            testChapters.map(function (t) {
              var b = bestScore(t.week);
              return '<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px;border-top:3px solid ' + color + ';">' +
                '<div style="display:flex;align-items:center;justify-content:space-between;">' +
                  lvBadge(color, 'N2') +
                  (b ? '<span style="font-size:11px;font-weight:700;color:' +
                      (b.bestScore === b.bestTotal ? 'var(--n5)' : 'var(--fg-muted)') + ';">' +
                      b.bestScore + '/' + b.bestTotal + ' best</span>' : '') +
                '</div>' +
                '<div>' +
                  '<p style="font-size:14px;font-weight:800;color:var(--fg);margin:0 0 2px;">' +
                    'Week ' + t.week + ' Practice Test</p>' +
                  '<p style="font-family:\'Noto Sans JP\',sans-serif;font-size:12px;' +
                    'color:var(--fg-muted);margin:0;">' + H(t.topic) + '</p>' +
                '</div>' +
                '<button onclick="window.nzN2TestOpen(' + t.week + ')" class="nz-btn nz-btn-pri" ' +
                  'style="width:100%;justify-content:center;">' +
                  (b ? 'Retake Test' : 'Start Test') + '</button>' +
              '</div>';
            }).join('') +
          '</div>') +
      '</div>'
    );

    window.nzN2TestOpen = function (week) {
      selected = testChapters.find(function (c) { return c.week === week; });
      quizAns = {}; showResults = false;
      renderQuiz();
    };
  }

  function renderQuiz() {
    var t     = selected;
    var color = jlptColor('N2');
    var score = t.quiz.filter(function (q) { return quizAns[q.id] === q.answer; }).length;

    setHTML(
      '<div class="nz-page nz-fadein">' +
      backBtn('nzN2TestBack', 'Back to practice tests') +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">' +
        lvBadge(color, 'N2') +
        '<div>' +
          '<h1 style="font-size:20px;font-weight:800;color:var(--fg);margin:0 0 2px;">' +
            'Week ' + t.week + ' Practice Test</h1>' +
          '<p style="font-family:\'Noto Sans JP\',sans-serif;font-size:12px;' +
            'color:var(--fg-muted);margin:0;">' + H(t.topic) + '</p>' +
        '</div>' +
      '</div>' +
      (showResults
        ? '<div class="card" style="padding:20px;margin-bottom:13px;text-align:center;">' +
            '<p style="font-size:12px;color:var(--fg-muted);margin:0 0 4px;">Your Score</p>' +
            '<p style="font-size:32px;font-weight:800;color:' +
              (score === t.quiz.length ? 'var(--n5)' : 'var(--primary)') + ';margin:0;">' +
              score + ' / ' + t.quiz.length + '</p>' +
            '<p style="font-size:12px;color:var(--fg-muted);margin:6px 0 0;">' +
              Math.round(score / t.quiz.length * 100) + '% correct</p>' +
          '</div>'
        : '') +
      quizBlock(t.quiz, quizAns, showResults, score,
        'nzN2TestAns', 'nzN2TestCheck', 'nzN2TestRetry') +
      '</div>'
    );

    window.nzN2TestBack  = function () { selected = null; renderList(); };
    window.nzN2TestAns   = function (qid, i) { quizAns[qid] = i; renderQuiz(); };
    window.nzN2TestCheck = function () {
      showResults = true;
      var finalScore = t.quiz.filter(function (q) { return quizAns[q.id] === q.answer; }).length;
      var prev = nzProgGet('n2practicetest', 'W' + t.week);
      var best = (prev && typeof prev.bestScore === 'number') ? Math.max(prev.bestScore, finalScore) : finalScore;
      nzProgPatch('n2practicetest', 'W' + t.week, { bestScore: best, bestTotal: t.quiz.length, lastTaken: Date.now() });
      nzMarkCompleted('n2practicetest', 'W' + t.week, 'attempt-' + Date.now());
      renderQuiz();
    };
    window.nzN2TestRetry = function () { quizAns = {}; showResults = false; renderQuiz(); };
  }

  /* If the N2 Vocabulary Week Page sent us here for a specific week's
     lesson 1.7, open that week's test directly instead of the list —
     reuses the exact same renderQuiz()/quizBlock() engine below. */
  var _pendingWeek = window.consumePendingN2Week ? window.consumePendingN2Week() : null;
  var _pendingChapter = _pendingWeek
    ? testChapters.find(function (c) { return c.week === _pendingWeek; })
    : null;
  if (_pendingChapter) {
    selected = _pendingChapter; quizAns = {}; showResults = false;
    renderQuiz();
  } else {
    renderList();
  }
};

/* ════════════════════════════════════════════════════════════════
   REGISTER ROUTES — fires on nz:userReady from auth.js
════════════════════════════════════════════════════════════════ */
/* BUG FIX: Guard flag — nz:userReady must only register routes once.
   Without this, if auth.js fires the event multiple times (retry/refresh),
   routes get re-registered and popstate listeners stack up. */
/* ════════════════════════════════════════════════════════════════
   PRESENCE (online/offline) + REALTIME NOTIFICATIONS
════════════════════════════════════════════════════════════════ */
window._nzOnlineUids = {}; // cache of uid -> {online, lastSeen}
var _nzPresenceUnsub = null, _nzNotifUnsub = null, _nzNotifFirstLoad = true;

function nzInitPresenceAndNotifs() {
  if (!window._nzDb || !window._nzUser) return;
  var me = window._nzUser.uid;
  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs) {
    if (!window._nzFS) window._nzFS = fs;

    // Mark self online, keep alive every 30s, mark offline on unload
    var pRef = fs.doc(window._nzDb, 'presence', me);
    fs.setDoc(pRef, { online: true, lastSeen: fs.serverTimestamp() }, { merge: true });
    setInterval(function() {
      fs.setDoc(pRef, { online: true, lastSeen: fs.serverTimestamp() }, { merge: true });
    }, 30000);
    window.addEventListener('beforeunload', function() {
      try { fs.setDoc(pRef, { online: false, lastSeen: fs.serverTimestamp() }, { merge: true }); } catch(e) {}
    });
    document.addEventListener('visibilitychange', function() {
      fs.setDoc(pRef, { online: document.visibilityState === 'visible', lastSeen: fs.serverTimestamp() }, { merge: true });
    });

    // Watch presence of everyone I follow (small collections stay within free tier)
    if (_nzPresenceUnsub) { try { _nzPresenceUnsub(); } catch(e){} }
    _nzPresenceUnsub = fs.onSnapshot(fs.collection(window._nzDb, 'presence'), function(snap) {
      snap.forEach(function(d) { window._nzOnlineUids[d.id] = d.data(); });
      document.dispatchEvent(new CustomEvent('nz:presenceUpdate'));
    });

    // Realtime notifications addressed to me
    if (_nzNotifUnsub) { try { _nzNotifUnsub(); } catch(e){} }
    var nq = fs.query(fs.collection(window._nzDb, 'notifications', me, 'items'),
      fs.orderBy('createdAt', 'desc'), fs.limit(20));
    _nzNotifUnsub = fs.onSnapshot(nq, function(snap) {
      if (_nzNotifFirstLoad) { _nzNotifFirstLoad = false; return; } // don't replay history as new toasts
      snap.docChanges().forEach(function(ch) {
        if (ch.type === 'added') {
          var n = ch.doc.data();
          window.nzAddNotif(n.type || 'social', n.title || 'Notification', n.body || '');
        }
      });
    });
  });
}

/* Send a notification doc to another user (follow, message, group invite, etc.) */
window.nzPushNotifTo = function(targetUid, type, title, body) {
  if (!window._nzDb || !targetUid) return;
  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs) {
    fs.addDoc(fs.collection(window._nzDb, 'notifications', targetUid, 'items'), {
      type: type, title: title, body: body, read: false, createdAt: fs.serverTimestamp()
    });
  });
};

window.nzIsOnline = function(uid) {
  var p = window._nzOnlineUids[uid];
  if (!p || !p.online) return false;
  return true;
};

document.addEventListener('nz:userReady', function() { setTimeout(nzInitPresenceAndNotifs, 300); });

var _nzRoutesRegistered = false;
document.addEventListener('nz:userReady', function() {
  if (_nzRoutesRegistered) return;
  _nzRoutesRegistered = true;
  setTimeout(function(){
    if (!window.Router) return;

    window.Router.register('dashboard', function(){ Pages.dashboard(); });
    window.Router.register('kanji',     function(){ Pages.kanji(); });
    window.Router.register('vocab',     function(){ Pages.vocab(); });
    window.Router.register('vocab-flashcards', function(){ Pages['vocab-flashcards'](); });
    window.Router.register('basic-vocab', function(){ Pages['basic-vocab'](); });
    window.Router.register('kanji-detail', function(){ Pages['kanji-detail'](); });
    window.Router.register('kanji-writing', function(){ Pages['kanji-writing'](); });
    window.Router.register('saved', function(){ Pages.saved(); });
    window.Router.register('conversation', function(){ Pages.conversation(); });
    window.Router.register('pronunciation', function(){ Pages.pronunciation(); });
    window.Router.register('grammar',   function(){ Pages.grammar(); });
    window.Router.register('listening', function(){ Pages.listening(); });
    window.Router.register('n2-practice-tests', function(){ Pages['n2-practice-tests'](); });
    window.Router.register('reading',   function(){ Pages.reading(); });
    window.Router.register('kana',      function(){ Pages.kana(); });
    window.Router.register('jlpt-n5',  function(){ Pages['jlpt-n5'](); });
    window.Router.register('jlpt-n4',  function(){ Pages['jlpt-n4'](); });
    window.Router.register('jlpt-n3',  function(){ Pages['jlpt-n3'](); });
    window.Router.register('jlpt-n2',  function(){ Pages['jlpt-n2'](); });
    window.Router.register('jlpt-n1',  function(){ Pages['jlpt-n1'](); });
    window.Router.register('timer',    function(){ Pages.timer(); });
    window.Router.register('progress', function(){ Pages.progress(); });
    window.Router.register('profile',  function(){ Pages.profile(); });
    window.Router.register('goals',    function(){ Pages.goals(); });
    window.Router.register('srs',      function(){ Pages.srs(); });
    window.Router.register('sentence-practice', function(){ Pages['sentence-practice'](); });
    window.Router.register('notes',    function(){ Pages.notes(); });
    window.Router.register('chat',     function(){ Pages.chat(); });
    window.Router.register('badges',      function(){ Pages.badges(); });
    window.Router.register('leaderboard', function(){ Pages.leaderboard(); });
    /* BUG FIX: Community and Study Groups are now tabs inside Community
       Chat rather than separate nav pages — old #social/#groups links
       still work, they just open Community Chat on that tab. */
    window.Router.register('social',   function(){ Pages.chat._initialTab='social'; Pages.chat(); });
    window.Router.register('groups',   function(){ Pages.chat._initialTab='groups'; Pages.chat(); });
    window.Router.register('settings', function(){ Pages.settings(); });

    var hash = window.location.hash.replace('#', '').trim();
    window.Router.go(hash || 'dashboard');

    /* BUG FIX: popstate listener guard — only add once */
    if (!window._nzPopstateAdded) {
      window._nzPopstateAdded = true;
      window.addEventListener('popstate', function() {
        var h = window.location.hash.replace('#', '').trim();
        if (h) window.Router.go(h);
      });
    }

  }, 150);
});

<!-- ══════════════════════════════════════════════════════════
     BOOTSTRAP — called by auth.js after user is confirmed
     auth.js calls window._nzBootstrap() once auth state is ready.
═══════════════════════════════════════════════════════════ -->
<script defer>
'use strict';

/* ── Bootstrap function called by auth.js after user confirmed ── */
/* FIX: Added _bootstrapDone guard — auth.js can call this from a
   setInterval poll. Without this guard, if the interval fires more
   than once before renderShell is available, renderShell and
   nz:userReady would execute multiple times, causing duplicate
   shell renders and double route-registration. */
var _bootstrapDone = false;
window._nzBootstrap = function() {
  if (_bootstrapDone) return; // FIX: run once only

  /* Wait for defer scripts to finish executing */
  if (typeof renderShell !== 'function') {
    setTimeout(window._nzBootstrap, 50);
    return;
  }

  _bootstrapDone = true; // FIX: lock before any async work

  /* Hide loading screen */
  var loadingEl = document.getElementById('auth-loading');
  if (loadingEl) {
    loadingEl.classList.add('fade-out');
    setTimeout(function() {
      if (loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl);
    }, 400);
  }

  /* Sync State object if it exists */
  var d = window._nzUserData || {};
  if (window.State && window.State.state) {
    window.State.state.xpToday     = d.xp                || 0;
    window.State.state.xpGoal      = d.xpGoal            || 500;
    window.State.state.streak      = d.streak            || 1;
    window.State.state.level       = d.level             || 1;
    window.State.state.totalXP     = d.xp                || 0;
    window.State.state.nextLevelXP = d.levelXPRequired   || 200;
  }

  /* Build shell with real user data */
  renderShell();

  /* Sidebar/nav labels were just (re)built — translate them now.
     NZI18N's own DOMContentLoaded listener ran before renderShell()
     replaced document.body, so without this call the freshly-built
     nav would stay in English regardless of the saved language. */
  try { window.NZI18N && NZI18N.refresh(); } catch(e) {}

  /* Check for newly-earned badges/achievements */
  try { nzSyncBadges(); } catch(e) {}

  /* Register the global nav click handler exactly once */
  if (typeof _ensureNavListener === 'function') _ensureNavListener();

  /* Register the profile dropdown's outside-click handler exactly once */
  if (typeof _ensureProfileMenuListener === 'function') _ensureProfileMenuListener();

  /* FIX: Fire nz:userReady AFTER renderShell() so the route-registration
     listener in nz-pages finds a real DOM to work with.
     auth.js previously never fired this event at all (root cause of
     routes never registering). Now auth.js calls _nzBootstrap(), and
     _nzBootstrap owns the dispatch — keeping the sequence correct:
       auth confirms user → auth.js calls _nzBootstrap()
       → renderShell() builds the DOM
       → nz:userReady fires
       → route-registration listener wires up the router
       → Router.go('dashboard') renders the first page             */
  document.dispatchEvent(new CustomEvent('nz:userReady', {
    detail: { user: window._nzUser, data: window._nzUserData }
  }));
};
</script>
