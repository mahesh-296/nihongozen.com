<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NihongoZen — Japanese Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/*============================================================
  CSS VARIABLES & RESET
============================================================*/
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0F; --bg2:#111118; --bg3:#16161E; --bg4:#1E1E2A;
  --primary:#E8446A; --primary-h:#F05578; --primary-dim:rgba(232,68,106,.12);
  --gold:#C9973A; --gold-dim:rgba(201,151,58,.12);
  --border:#252535; --border2:#1E1E2A;
  --text:#F0F0F5; --muted:#8888A0; --subtle:#444460;
  --n5:#4CAF82; --n4:#5B9BD5; --n3:#C9973A; --n2:#9B6DD5; --n1:#E8446A;
  --sidebar:250px; --topbar:60px; --radius:12px;
  --font:'Plus Jakarta Sans',sans-serif;
  --jp:'Noto Sans JP',sans-serif;
  --jp-serif:'Noto Serif JP',serif;
  --mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
input,textarea,select{font-family:inherit}

/*============================================================
  AUTH LOADING
============================================================*/
#auth-loading{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#auth-loading.out{opacity:0;pointer-events:none}
.auth-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#E8446A,#B02050);display:flex;align-items:center;justify-content:center;font-family:var(--jp-serif);font-size:26px;color:#fff;font-weight:700;animation:pulse 2s ease-in-out infinite;box-shadow:0 0 40px rgba(232,68,106,.4)}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(232,68,106,.3)}50%{box-shadow:0 0 60px rgba(232,68,106,.5)}}
.auth-text{font-size:13px;color:var(--muted)}
.auth-dots::after{content:'';animation:dots 1.5s steps(3,end) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}

/*============================================================
  LAYOUT SHELL
============================================================*/
#shell{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;height:100vh;width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sidebar-logo-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#E8446A,#B02050);display:flex;align-items:center;justify-content:center;font-family:var(--jp-serif);font-size:17px;color:#fff;font-weight:700;box-shadow:0 0 20px rgba(232,68,106,.3);flex-shrink:0}
.sidebar-logo-text{font-size:16px;font-weight:800;line-height:1.2}
.sidebar-logo-text span{color:var(--primary)}
.sidebar-logo-sub{font-size:10px;color:var(--muted)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-section{padding:6px 16px 4px;font-size:10px;font-weight:700;color:var(--subtle);letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;margin:1px 8px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;cursor:pointer;position:relative}
.nav-item:hover{background:var(--bg4);color:var(--text)}
.nav-item.active{background:var(--primary-dim);color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;background:var(--primary);border-radius:0 2px 2px 0}
.nav-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:20px;background:var(--primary-dim);color:var(--primary);font-weight:700}
.nav-jlpt-badge{font-size:9px;padding:1px 6px;border-radius:10px;margin-left:auto;font-weight:700}
.sidebar-footer{padding:16px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg4);border-radius:12px;cursor:pointer;transition:all .15s;border:1px solid var(--border)}
.user-card:hover{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.05)}
.user-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--primary),#B02050);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign-out-btn{font-size:11px;padding:4px 8px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);transition:all .15s}
.sign-out-btn:hover{border-color:var(--primary);color:var(--primary)}

/* Topbar */
.topbar{position:fixed;left:var(--sidebar);right:0;top:0;height:var(--topbar);background:rgba(10,10,15,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:90;display:flex;align-items:center;padding:0 24px;gap:16px}
.topbar-greeting{flex:1}
.topbar-greeting .time-greeting{font-size:13px;color:var(--muted);font-family:var(--jp)}
.topbar-greeting .page-title{font-size:16px;font-weight:700}
.topbar-clock{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end}
.topbar-clock .clock-time{font-size:16px;font-weight:600;color:var(--text)}
.topbar-clock .clock-date{font-size:11px}
.xp-bar-wrap{display:flex;align-items:center;gap:8px}
.xp-label{font-size:12px;font-weight:600;color:var(--gold);white-space:nowrap}
.xp-bar{width:100px;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),#E8B060);border-radius:3px;transition:width .8s ease}
.menu-toggle{display:none;background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);font-size:18px}

/* Main content */
.main{margin-left:var(--sidebar);padding-top:var(--topbar);min-height:100vh}
.page{padding:28px 24px;max-width:1100px;animation:pageIn .4s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Mobile overlay */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;backdrop-filter:blur(4px)}

/*============================================================
  COMMON COMPONENTS
============================================================*/
.page-header{margin-bottom:28px}
.page-header h1{font-size:26px;font-weight:800;margin-bottom:4px}
.page-header .sub{font-size:14px;color:var(--muted)}
.page-header .jp-title{font-family:var(--jp-serif);font-size:15px;color:var(--muted);margin-bottom:6px}

/* Cards */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius)}
.card-glass{background:rgba(22,22,30,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card-hover{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card-hover:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.4);border-color:rgba(255,255,255,.08)}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;opacity:.08;transition:opacity .3s}
.stat-card:hover::before{opacity:.15}
.stat-icon{font-size:22px;margin-bottom:10px}
.stat-value{font-size:30px;font-weight:800;line-height:1;margin-bottom:4px;font-family:var(--mono)}
.stat-label{font-size:12px;color:var(--muted);font-weight:500}
.stat-delta{font-size:11px;margin-top:6px;font-weight:600}
.delta-up{color:#4CAF82} .delta-down{color:var(--primary)}

/* Buttons */
.btn{padding:10px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(232,68,106,.3)}
.btn-primary:hover{background:var(--primary-h);box-shadow:0 6px 24px rgba(232,68,106,.4);transform:translateY(-1px)}
.btn-secondary{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,.15)}
.btn:active{transform:scale(.97)!important}

/* JLPT level badges */
.jlpt-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--mono)}
.badge-n5{background:rgba(76,175,130,.15);color:var(--n5);border:1px solid rgba(76,175,130,.25)}
.badge-n4{background:rgba(91,155,213,.15);color:var(--n4);border:1px solid rgba(91,155,213,.25)}
.badge-n3{background:rgba(201,151,58,.15);color:var(--n3);border:1px solid rgba(201,151,58,.25)}
.badge-n2{background:rgba(155,109,213,.15);color:var(--n2);border:1px solid rgba(155,109,213,.25)}
.badge-n1{background:rgba(232,68,106,.15);color:var(--n1);border:1px solid rgba(232,68,106,.25)}

/* Filter tabs */
.filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--bg4);color:var(--muted);cursor:pointer;transition:all .15s}
.filter-tab:hover{color:var(--text);border-color:rgba(255,255,255,.1)}
.filter-tab.active{background:var(--primary-dim);color:var(--primary);border-color:rgba(232,68,106,.3)}

/* Progress ring */
.progress-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.progress-ring svg{transform:rotate(-90deg)}
.ring-text{position:absolute;text-align:center}

/* Kanji card */
.kanji-card{padding:20px;cursor:pointer;transition:all .2s}
.kanji-char{font-family:var(--jp-serif);font-size:52px;font-weight:700;line-height:1;display:block;margin-bottom:8px}
.kanji-reading{font-family:var(--jp);font-size:12px;color:var(--muted);margin-bottom:4px}
.kanji-meaning{font-size:13px;font-weight:600}
.kanji-example{font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--jp)}

/* Vocab card */
.vocab-flip{perspective:800px;height:160px;cursor:pointer}
.vocab-flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.vocab-flip-inner.flipped{transform:rotateY(180deg)}
.vocab-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.vocab-back{background:var(--bg4);transform:rotateY(180deg)}
.vocab-jp{font-family:var(--jp);font-size:24px;font-weight:700;margin-bottom:6px}
.vocab-romaji{font-size:13px;color:var(--muted)}
.vocab-en{font-size:18px;font-weight:700}

/* Grammar accordion */
.grammar-item{border-radius:12px;overflow:hidden;margin-bottom:10px;border:1px solid var(--border)}
.grammar-header{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.grammar-header:hover{background:var(--bg4)}
.grammar-body{padding:0 20px 20px;border-top:1px solid var(--border);display:none}
.grammar-body.open{display:block;animation:slideDown .25s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.grammar-structure{background:var(--bg4);border:1px solid var(--border);border-radius:10px;padding:12px;margin:12px 0;font-family:var(--mono);font-size:13px}
.grammar-example{display:flex;align-items:flex-start;gap:12px;padding:10px;background:var(--bg4);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}

/* Listening */
.script-line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border2)}
.speaker-label{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--primary-dim);color:var(--primary);white-space:nowrap;align-self:flex-start;margin-top:2px;min-width:64px;text-align:center}
.speaker-label.staff{background:rgba(91,155,213,.15);color:var(--n4)}

/* Reading */
.reading-line{padding:10px 0;border-bottom:1px solid var(--border2);display:flex;align-items:flex-start;gap:12px}
.reading-jp{font-family:var(--jp);font-size:15px;line-height:1.6;flex:1}
.reading-en{font-size:12px;color:var(--muted);font-style:italic;line-height:1.5;flex:1}

/* Quiz */
.quiz-option{padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg4);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;margin-bottom:8px;display:block;width:100%;text-align:left}
.quiz-option:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.quiz-option.correct{background:rgba(76,175,130,.12);border-color:var(--n5);color:var(--n5)}
.quiz-option.wrong{background:rgba(232,68,106,.12);border-color:var(--primary);color:var(--primary)}

/* Kana chart specific */
.kana-grid{display:grid;gap:8px}
.kana-cell{background:var(--bg4);border:1px solid var(--border);border-radius:10px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .15s}
.kana-cell:hover{border-color:rgba(232,68,106,.4);transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,68,106,.1)}
.kana-cell.active{background:var(--primary-dim);border-color:var(--primary)}
.kana-char{font-family:var(--jp);font-size:22px;line-height:1}
.kana-rom{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* Progress page */
.level-card{padding:20px;margin-bottom:12px}
.level-bar-wrap{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-top:8px}
.level-bar{height:100%;border-radius:4px;transition:width 1s ease}

/* Timer (Pomodoro) */
.timer-circle{width:240px;height:240px;position:relative;margin:0 auto}
.timer-display{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-time{font-family:var(--mono);font-size:48px;font-weight:800}
.timer-label{font-size:12px;color:var(--muted);margin-top:4px}
.timer-controls{display:flex;gap:12px;justify-content:center;margin-top:24px}

/* Streak flame */
.streak-wrap{display:flex;align-items:center;gap:6px}
.flame{font-size:18px;animation:flicker 1s ease-in-out infinite alternate}
@keyframes flicker{0%{transform:scale(1) rotate(-2deg)}100%{transform:scale(1.05) rotate(2deg)}}

/* Speaker button */
.speak-btn{background:transparent;border:none;padding:4px;color:var(--primary);cursor:pointer;opacity:.7;transition:all .15s;border-radius:6px}
.speak-btn:hover{opacity:1;background:var(--primary-dim)}

/* Search */
.search-wrap{position:relative;margin-bottom:20px}
.search-wrap input{width:100%;padding:12px 16px 12px 40px;background:var(--bg4);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none;transition:all .2s}
.search-wrap input:focus{border-color:var(--primary);background:rgba(232,68,106,.06)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.search-wrap input::placeholder{color:var(--subtle)}

/* Tooltip */
.tooltip{position:relative}
.tooltip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1E1E2A;border:1px solid var(--border);color:var(--text);font-size:11px;white-space:nowrap;padding:4px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:200}
.tooltip:hover::after{opacity:1}

/* Responsive */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .topbar{left:0}
  .main{margin-left:0}
  .menu-toggle{display:flex;align-items:center;justify-content:center}
  .stats-grid{grid-template-columns:1fr 1fr}
  .page{padding:20px 16px}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
}

/* Fade in */
.fade-up{animation:pageIn .4s ease both}
.s1{animation-delay:.05s} .s2{animation-delay:.1s} .s3{animation-delay:.15s}
.s4{animation-delay:.2s} .s5{animation-delay:.25s} .s6{animation-delay:.3s}
</style>
</head>
<body>

<!-- Auth Loading Screen -->
<div id="auth-loading">
  <div class="auth-logo">禅</div>
  <p class="auth-text">Checking authentication<span class="auth-dots"></span></p>
</div>

<!-- App Shell (hidden until auth) -->
<div id="shell">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">禅</div>
      <div>
        <div class="sidebar-logo-text">Nihongo<span>Zen</span></div>
        <div class="sidebar-logo-sub">日本語学習</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <div class="nav-item active" data-route="dashboard"><span class="nav-icon">🏠</span>Dashboard</div>
      <div class="nav-item" data-route="progress"><span class="nav-icon">📊</span>Progress</div>
      <div class="nav-item" data-route="timer"><span class="nav-icon">⏱️</span>Study Timer</div>

      <div class="nav-section">Study</div>
      <div class="nav-item" data-route="kanji"><span class="nav-icon">漢</span>Kanji</div>
      <div class="nav-item" data-route="vocab"><span class="nav-icon">📚</span>Vocabulary</div>
      <div class="nav-item" data-route="grammar"><span class="nav-icon">✏️</span>Grammar</div>
      <div class="nav-item" data-route="listening"><span class="nav-icon">🎧</span>Listening</div>
      <div class="nav-item" data-route="reading"><span class="nav-icon">📖</span>Reading</div>
      <div class="nav-item" data-route="kana"><span class="nav-icon">あ</span>Kana Chart</div>

      <div class="nav-section">JLPT Levels</div>
      <div class="nav-item" data-route="jlpt-n5"><span class="nav-icon">🟢</span>N5 <span class="nav-jlpt-badge badge-n5">Beginner</span></div>
      <div class="nav-item" data-route="jlpt-n4"><span class="nav-icon">🔵</span>N4 <span class="nav-jlpt-badge badge-n4">Elementary</span></div>
      <div class="nav-item" data-route="jlpt-n3"><span class="nav-icon">🟡</span>N3 <span class="nav-jlpt-badge badge-n3">Intermediate</span></div>
      <div class="nav-item" data-route="jlpt-n2"><span class="nav-icon">🟣</span>N2 <span class="nav-jlpt-badge badge-n2">Advanced</span></div>
      <div class="nav-item" data-route="jlpt-n1"><span class="nav-icon">🔴</span>N1 <span class="nav-jlpt-badge badge-n1">Expert</span></div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card" onclick="navigate('profile')">
        <div class="user-avatar" id="sidebar-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">Loading...</div>
          <div class="user-email" id="sidebar-email">...</div>
        </div>
        <button class="sign-out-btn" onclick="event.stopPropagation();doSignOut()">Out</button>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Topbar -->
  <div class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div class="topbar-greeting">
      <div class="time-greeting" id="topbar-greeting"></div>
      <div class="page-title" id="topbar-title">Dashboard</div>
    </div>
    <div class="xp-bar-wrap" title="XP Progress">
      <span class="xp-label" id="topbar-xp">0 XP</span>
      <div class="xp-bar"><div class="xp-fill" id="topbar-xp-fill" style="width:0%"></div></div>
    </div>

<script>
'use strict';

/* ── STATE ───────────────────────────────────────────────── */
const State = {
  route: 'dashboard',
  userData: null,
  quizAnswers: {},
  kanaTab: 'hiragana',
  activeKana: null,
  vocabCategory: 'Greetings',
  vocabFlipped: null,
  grammarOpen: new Set(['g0']),
  kanjiLevel: 'N5',
  listeningId: null,
  readingId: null,
  readingShow: false,
  timerSeconds: 25*60,
  timerRunning: false,
  timerInterval: null,
  timerType: 'work',
};

/* ── ROUTER ──────────────────────────────────────────────── */
function navigate(route) {
  State.route = route;
  State.quizAnswers = {};

  // Update nav items
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === route);
  });

  // Update topbar title
  const titles = {
    dashboard:'Dashboard',kanji:'Kanji 漢字',vocab:'Vocabulary 語彙',
    grammar:'Grammar 文法',listening:'Listening 聴解',reading:'Reading 読解',
    kana:'Kana Chart かな',progress:'Progress 進捗',timer:'Study Timer',
    profile:'Profile プロフィール',
    'jlpt-n5':'JLPT N5 — Beginner','jlpt-n4':'JLPT N4 — Elementary',
    'jlpt-n3':'JLPT N3 — Intermediate','jlpt-n2':'JLPT N2 — Advanced',
    'jlpt-n1':'JLPT N1 — Expert',
  };
  document.getElementById('topbar-title').textContent = titles[route] || route;

  // Update URL hash
  window.location.hash = route;

  // Close sidebar on mobile
  closeSidebar();

  // Render page
  render();
}

/* ── RENDER ──────────────────────────────────────────────── */
function render() {
  const el = document.getElementById('page-content');
  el.className = 'page';
  const r = State.route;
  if (r === 'dashboard') el.innerHTML = renderDashboard();
  else if (r === 'kanji') el.innerHTML = renderKanji();
  else if (r === 'vocab') el.innerHTML = renderVocab();
  else if (r === 'grammar') el.innerHTML = renderGrammar();
  else if (r === 'listening') el.innerHTML = renderListening();
  else if (r === 'reading') el.innerHTML = renderReading();
  else if (r === 'kana') el.innerHTML = renderKana();
  else if (r === 'progress') el.innerHTML = renderProgress();
  else if (r === 'timer') el.innerHTML = renderTimer();
  else if (r === 'profile') el.innerHTML = renderProfile();
  else if (r.startsWith('jlpt-')) el.innerHTML = renderJLPT(r.replace('jlpt-',''));
  else el.innerHTML = `<div class="page-header"><h1>404</h1><p class="sub">Page not found</p></div>`;
  attachHandlers();
}

/* ── SPEAK ───────────────────────────────────────────────── */
function speak(text, rate=0.85) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = rate;
  window.speechSynthesis.speak(u);
}

/* ── GREETING ────────────────────────────────────────────── */
function getGreeting() {
  const h = new Date().getHours();
  const jp = h<12?'おはようございます':h<17?'こんにちは':h<21?'こんばんは':'おやすみ';
  const en = h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
  return {jp, en};
}

/* ── XP HELPERS ─────────────────────────────────────────── */
function updateXPBar() {
  const d = State.userData;
  const xp = d?.xp || 0;
  const goal = d?.xpGoal || 500;
  const pct = Math.min(100, Math.round(xp/goal*100));
  const el = document.getElementById('topbar-xp');
  const fill = document.getElementById('topbar-xp-fill');
  if (el) el.textContent = `${xp} XP`;
  if (fill) fill.style.width = pct + '%';
}

function jlptColor(lv) {
  const m = {N5:'var(--n5)',N4:'var(--n4)',N3:'var(--n3)',N2:'var(--n2)',N1:'var(--n1)'};
  return m[lv.toUpperCase()] || 'var(--primary)';
}
function jlptBadge(lv) { return `<span class="jlpt-badge badge-${lv.toLowerCase()}">${lv.toUpperCase()}</span>`; }
</script>

<script>
/* ── ATTACH HANDLERS ─────────────────────────────────────── */
function attachHandlers() {
  // Nothing dynamic needed; all onclick is inline
}

function toggleGrammar(id) {
  if (State.grammarOpen.has(id)) State.grammarOpen.delete(id);
  else State.grammarOpen.add(id);
  render();
}

function answerQuiz(type, qi, selected) {
  State.quizAnswers[qi] = selected;
  render();
  // Add XP for correct answer
  const data = type==='l' ? DIALOGUES.find(d=>d.id===State.listeningId) : PASSAGES.find(p=>p.id===State.readingId);
  if (data && selected === data.quiz[qi].ans) {
    if (window._nzAddXP) window._nzAddXP(10);
  }
}

/* ── SIDEBAR MOBILE ──────────────────────────────────────── */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('open');
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (sb) sb.classList.remove('open');
  if (ov) ov.classList.remove('open');
}

/* ── TIMER ───────────────────────────────────────────────── */
function setTimerType(type, dur) {
  if (State.timerInterval) { clearInterval(State.timerInterval); State.timerInterval=null; }
  State.timerType = type;
  State.timerSeconds = dur * 60;
  State.timerRunning = false;
  render();
}
function toggleTimer() {
  if (State.timerRunning) {
    clearInterval(State.timerInterval);
    State.timerInterval = null;
    State.timerRunning = false;
    render();
  } else {
    State.timerRunning = true;
    render();
    State.timerInterval = setInterval(() => {
      if (State.timerSeconds > 0) {
        State.timerSeconds--;
        if (State.route === 'timer') render();
      } else {
        clearInterval(State.timerInterval);
        State.timerInterval = null;
        State.timerRunning = false;
        State.timerSessions = (State.timerSessions||0) + 1;
        if (window._nzAddXP) window._nzAddXP(25);
        alert('Session complete! Great work! 🎉');
        setTimerType('short', 5);
      }
    }, 1000);
  }
}
function resetTimer() {
  if (State.timerInterval) { clearInterval(State.timerInterval); State.timerInterval=null; }
  const dur = State.timerType==='work'?25:State.timerType==='short'?5:15;
  State.timerSeconds = dur*60;
  State.timerRunning = false;
  render();
}
function skipTimer() {
  const next = State.timerType==='work'?'short':'work';
  const dur = next==='work'?25:5;
  setTimerType(next, dur);
}

/* ── SIGN OUT ────────────────────────────────────────────── */
function doSignOut() {
  if (window._nzSignOut) window._nzSignOut();
}

/* ── LIVE CLOCK ──────────────────────────────────────────── */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const tEl = document.getElementById('clock-time');
  const dEl = document.getElementById('clock-date');
  if (tEl) tEl.textContent = `${h}:${m}:${s}`;
  if (dEl) dEl.textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
setInterval(updateClock, 1000);
updateClock();

/* ── TOPBAR GREETING ─────────────────────────────────────── */
function updateTopbarGreeting() {
  const g = getGreeting();
  const el = document.getElementById('topbar-greeting');
  if (el) el.textContent = `${g.jp} · ${g.en}`;
}
updateTopbarGreeting();
setInterval(updateTopbarGreeting, 60000);
</script>

  if (!user) { window.location.replace("login.html"); return; }

  // Expose globally
  window._nzAuth = auth;
  window._nzDb = db;
  window._nzUser = user;
  window._nzSignOut = () => signOut(auth).then(() => window.location.replace("login.html"));

  // Firestore user document
  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    await setDoc(userRef, {
      uid:user.uid, displayName:user.displayName||"Learner",
      email:user.email||"", photoURL:user.photoURL||"",
      xp:0, xpGoal:500, streak:1, kanjiCount:0,
      lessonsCompleted:0, vocabMastered:0, quizAccuracy:0,
      level:1, levelXP:0, levelXPRequired:200,
      weeklyKanji:0, weeklyLessons:0, weeklyVocab:0, weeklyAccuracyDelta:0,
      lastLogin:serverTimestamp(), createdAt:serverTimestamp()
    });
  } else {
    await updateDoc(userRef, { lastLogin:serverTimestamp() });
  }

  const fresh = await getDoc(userRef);
  const userData = fresh.data();
  State.userData = userData;
  window._nzUserData = userData;

  // Update sidebar user info
  const nameEl = document.getElementById('sidebar-name');
  const emailEl = document.getElementById('sidebar-email');
  const avatarEl = document.getElementById('sidebar-avatar');
  if (nameEl) nameEl.textContent = userData.displayName || user.displayName || 'Learner';
  if (emailEl) emailEl.textContent = userData.email || user.email || '';
  if (avatarEl) {
    const photo = userData.photoURL || user.photoURL;
    if (photo) { avatarEl.innerHTML = `<img src="${photo}" alt="avatar">`; }
    else { avatarEl.textContent = (userData.displayName||user.displayName||'?')[0].toUpperCase(); }
  }

  // Hide loading, show app
  const loading = document.getElementById('auth-loading');
  const shell = document.getElementById('shell');
  if (loading) { loading.classList.add('out'); setTimeout(()=>loading.remove(),500); }
  if (shell) shell.style.display = 'block';

  updateXPBar();

  // Navigate to hash or dashboard
  const hash = window.location.hash.replace('#','') || 'dashboard';
  navigate(hash);

  window.addEventListener('popstate', () => {
    const h = window.location.hash.replace('#','') || 'dashboard';
    navigate(h);
  });

  document.dispatchEvent(new CustomEvent("nz:userReady", { detail:{user, data:userData} }));
});

// XP helper
window._nzAddXP = async (amount) => {
  const u = auth.currentUser; if (!u) return;
  const ref = doc(db,"users",u.uid);
  const snap = await getDoc(ref); if (!snap.exists()) return;
  const d = snap.data();
  const newXP = (d.xp||0)+amount, newLvlXP = (d.levelXP||0)+amount;
  const req = d.levelXPRequired||200, lvlUp = newLvlXP>=req;
  await updateDoc(ref,{
    xp:newXP, levelXP:lvlUp?newLvlXP-req:newLvlXP,
    level:lvlUp?(d.level||1)+1:(d.level||1)
  });
  const fresh = await getDoc(ref);
  State.userData = fresh.data();
  window._nzUserData = fresh.data();
  updateXPBar();
  document.dispatchEvent(new CustomEvent("nz:xpUpdated",{detail:fresh.data()}));
};
</script>

function showToast(icon, title, msg, color='var(--gold)') {
  const tc = document.getElementById('toast-container');
  if (!tc) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-icon">${icon}</div><div class="toast-body"><div class="toast-title" style="color:${color}">${title}</div><div class="toast-msg">${msg}</div></div>`;
  tc.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3000);
}

function flashAnswer(correct) {
  const el = document.createElement('div');
  el.className = 'answer-flash';
  el.textContent = correct ? '✅' : '❌';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

window.answerQuiz = function(type, qi, selected) {
  const data = type==='l'

    : PASSAGES.find(p=>p.id===State.readingId);
  const correct = data && selected === data.quiz[qi].ans;
  State.quizAnswers[qi] = selected;
  render();
  flashAnswer(correct);
  if (correct) {
    showToast('⚡','+10 XP', 'Correct answer!');
    if (window._nzAddXP) window._nzAddXP(10);
  } else {
    showToast('💡','Keep trying!', 'Review the passage and retry.', 'var(--muted)');
  }
};
