<!-- Theme pre-paint script: applies the saved theme class before first paint
     so the page never flashes the wrong theme. Calm cream/green (Light) is
     the app-wide default; Dark is the only theme with no class of its own
     (it is the :root default in css/tokens.css). This list must always be
     kept in sync with THEME_ORDER in js/theme.js — do not edit one without
     the other. -->
<script>
(function () {
  var THEME_IDS = ['light','coral-sunset','forest-dream','pastel-zen','warm-autumn','dark','ocean-dark','lavender-night'];
  try {
    var t = localStorage.getItem('nz-theme');
    if (THEME_IDS.indexOf(t) === -1) {
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      t = systemDark ? 'dark' : 'light';
    }
    if (t !== 'dark') document.documentElement.classList.add('nz-' + t);
  } catch (e) {
    document.documentElement.classList.add('nz-light');
  }
})();
</script>

/* ────────────────────────────────────────────────────────────────
   UTILITIES
──────────────────────────────────────────────────────────────── */
function H(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function jlptColor(lv) {
  return { N5: 'var(--n5)', N4: 'var(--n4)', N3: 'var(--n3)',
           N2: 'var(--n2)', N1: 'var(--n1)' }[lv] || 'var(--primary)';
}

/* Shared level icons used across Vocabulary, Grammar, Listening, Reading,
   Conversation, Pronunciation, and the JLPT Practice sidebar. */
function jlptIcon(lv) {
  return { All: '✨', N5: '🌱', N4: '🌿', N3: '🌳', N2: '🏯', N1: '🗻' }[lv] || '📘';
}
window.jlptIcon = jlptIcon;

/* New JLPT Practice difficulty labels */
function jlptLabel(lv) {
  return { N5: 'Basic', N4: 'Advanced', N3: 'Intermediate',
           N2: 'Hard/Advanced', N1: 'Expert/Advanced' }[lv] || lv;
}
window.jlptLabel = jlptLabel;

/* Shared "pending level" hand-off — used by the Dashboard Level Selector
   (and SRS Review level selector) to tell a module page which JLPT level
   to open on. Set window._nzDashLevel right before nzGo(route); the target
   page consumes it once via consumePendingLevel() and falls back to its
   normal default otherwise. No new routes/data — reuses existing pages. */
window._nzDashLevel = null;
function consumePendingLevel(fallback) {
  var lv = window._nzDashLevel;
  window._nzDashLevel = null;
  return lv || fallback;
}
window.consumePendingLevel = consumePendingLevel;

/* BUG FIX: VocabPageWords entries don't carry an explicit `level` field —
   only a `color` like 'var(--n5)'. Anything that filtered on `w.level`
   directly always got an empty list (SRS-by-level, Dashboard counts…).
   This derives the level from the existing color data instead of
   requiring new/duplicated fields. */
function vocabWordLevel(w) {
  if (!w) return null;
  if (w.level) return w.level;
  if (w.color) {
    var m = /n([1-5])/i.exec(w.color);
    if (m) return 'N' + m[1];
  }
  return null;
}
window.vocabWordLevel = vocabWordLevel;

/* ════════════════════════════════════════════════════════════════
   SAVED ITEMS — generic, cross-section save/bookmark system.
   Currently used by Kanji (Feature 6), but the storage + sidebar UI
   are section-agnostic so other pages can plug in later without any
   new architecture — just call nzToggleSaved(type, id, data).
════════════════════════════════════════════════════════════════ */
function getSavedItems() {
  try { return JSON.parse(localStorage.getItem('nz-saved-items') || '{}'); }
  catch (e) { return {}; }
}
function saveSavedItems(items) {
  try { localStorage.setItem('nz-saved-items', JSON.stringify(items)); } catch (e) {}
}
function isSaved(type, id) {
  var items = getSavedItems();
  return !!(items[type] && items[type][id]);
}
window.nzToggleSaved = function (type, id, data) {
  var items = getSavedItems();
  if (!items[type]) items[type] = {};
  if (items[type][id]) {
    delete items[type][id];
  } else {
    items[type][id] = Object.assign({ savedAt: Date.now() }, data || {});
  }
  saveSavedItems(items);
  return !!items[type][id];
};
window.getSavedItems = getSavedItems;
window.isSaved = isSaved;

/* ════════════════════════════════════════════════════════════════
   LEVEL PROGRESS TRACKING — client-side, localStorage-backed.
   Powers "Last Studied", "Completed", and "Total Time" stats on the
   Kanji / Grammar / Reading / Listening level-dashboard cards.
════════════════════════════════════════════════════════════════ */
function nzProgAll() {
  try { return JSON.parse(localStorage.getItem('nz-level-progress') || '{}'); }
  catch (e) { return {}; }
}
function nzProgSaveAll(all) {
  try { localStorage.setItem('nz-level-progress', JSON.stringify(all)); } catch (e) {}
}
function nzProgGet(section, level) {
  var all = nzProgAll();
  return (all[section] && all[section][level]) || {};
}
function nzProgPatch(section, level, patch) {
  var all = nzProgAll();
  if (!all[section]) all[section] = {};
  if (!all[section][level]) all[section][level] = {};
  Object.assign(all[section][level], patch);
  nzProgSaveAll(all);
  return all[section][level];
}
function nzMarkStudied(section, level) {
  nzProgPatch(section, level, { lastStudied: Date.now() });
}
function nzMarkCompleted(section, level, itemId) {
  var cur = nzProgGet(section, level);
  var done = cur.completed || [];
  if (done.indexOf(itemId) === -1) done.push(itemId);
  nzProgPatch(section, level, { completed: done, lastStudied: Date.now() });
}
function nzAddListenTime(level, seconds) {
  if (!seconds) return;
  var cur = nzProgGet('listening', level);
  nzProgPatch('listening', level, { totalSec: (cur.totalSec || 0) + seconds });
}
function nzRelativeTime(ts) {
  if (!ts) return '—';
  var diff = Date.now() - ts, day = 86400000;
  if (diff < day) return 'Today';
  var days = Math.floor(diff / day);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + ' Days Ago';
  var weeks = Math.floor(days / 7);
  if (weeks < 5) return weeks + (weeks === 1 ? ' Week Ago' : ' Weeks Ago');
  var months = Math.floor(days / 30);
  return months + (months === 1 ? ' Month Ago' : ' Months Ago');
}
function nzFmtClock(totalSec) {
  totalSec = totalSec || 0;
  var m = Math.floor(totalSec / 60), s = Math.floor(totalSec % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
window.nzMarkStudied   = nzMarkStudied;
window.nzMarkCompleted = nzMarkCompleted;
window.nzAddListenTime = nzAddListenTime;
window.nzRelativeTime  = nzRelativeTime;
window.nzFmtClock      = nzFmtClock;
window.nzProgGet       = nzProgGet;

/* ════════════════════════════════════════════════════════════════
   SHARED LEVEL DASHBOARD — one visual system reused by Kanji Study,
   Grammar Study, Reading, and Listening so all four match exactly:
   top 4-stat bar → optional tip banner → per-level colored cards
   (icon, JLPT badge, meta, progress bar, inner stats, action button)
   → fox tip card → daily-goal footer bar.
════════════════════════════════════════════════════════════════ */
function nzLvdbTopBar(stats, ringPct, ringColor, ringLabel) {
  function plain(s) {
    return '<div class="nz-lvdb-stat">' +
      '<div class="nz-lvdb-stat-icon" style="background:' + s.color + '18;color:' + s.color + ';">' + s.icon + '</div>' +
      '<div><div class="nz-lvdb-stat-num">' + s.value + '</div>' +
      '<div class="nz-lvdb-stat-label">' + s.label + '</div></div>' +
      '</div>';
  }
  var pct = Math.max(0, Math.min(100, ringPct || 0));
  var ring = '<div class="nz-lvdb-stat">' +
    '<div class="nz-lvdb-ring" style="background:conic-gradient(' + ringColor + ' ' + (pct * 3.6) + 'deg, var(--card-elevated) 0deg);">' +
      '<span class="nz-lvdb-ring-txt">' + pct + '%</span>' +
    '</div>' +
    '<div><div class="nz-lvdb-stat-num" style="font-size:13px;">' + ringLabel + '</div></div>' +
    '</div>';
  return '<div class="nz-lvdb-stats">' + stats.map(plain).join('') + ring + '</div>';
}
function nzLvdbTip(icon, text) {
  if (!text) return '';
  return '<div class="nz-lvdb-tip"><span style="font-size:16px;">' + icon + '</span><span>' + text + '</span></div>';
}
function nzLvdbCard(cfg) {
  var pct = Math.max(0, Math.min(100, cfg.pct || 0));
  return '<div class="nz-lvdb-card" style="border-top-color:' + cfg.color + ';">' +
    '<div class="nz-lvdb-head">' +
      '<div class="nz-lvdb-icon" style="background:' + cfg.color + '18;color:' + cfg.color + ';">' + cfg.icon + '</div>' +
      '<div style="min-width:0;flex:1;">' +
        '<div class="nz-lvdb-name" style="color:' + cfg.color + ';">' + cfg.level + '</div>' +
        (cfg.metaLines || []).map(function (m) { return '<div class="nz-lvdb-meta">' + m + '</div>'; }).join('') +
      '</div>' +
      '<span class="nz-lvdb-badge">JLPT</span>' +
    '</div>' +
    '<div class="nz-lvdb-pctrow">' +
      '<div class="nz-lvdb-track"><div class="nz-lvdb-fill" style="width:' + pct + '%;background:' + cfg.color + ';"></div></div>' +
      '<span class="nz-lvdb-pct">' + pct + '%</span>' +
    '</div>' +
    '<div class="nz-lvdb-innerstats">' +
      (cfg.innerStats || []).map(function (s) {
        return '<div class="nz-lvdb-innerstat">' +
          '<div class="nz-lvdb-innerstat-label">' + s.icon + ' ' + s.label + '</div>' +
          '<div class="nz-lvdb-innerstat-val">' + s.value + '</div>' +
          '</div>';
      }).join('') +
    '</div>' +
    (cfg.extraLine || '') +
    '<button class="nz-lvdb-btn" style="background:' + cfg.color + ';" onclick="' + cfg.onClick + '">' +
      cfg.buttonLabel + ' <span aria-hidden="true">›</span>' +
    '</button>' +
    '</div>';
}
function nzLvdbFox(message, sub, emoji, img) {
  return '<div class="nz-lvdb-fox">' +
    '<div style="padding-bottom:20px;">' +
      '<p style="font-size:14px;font-weight:700;color:var(--fg);margin:0 0 6px;line-height:1.5;">' + message + '</p>' +
      (sub ? '<p style="font-size:13px;color:var(--primary);margin:0;font-weight:600;">' + sub + '</p>' : '') +
    '</div>' +
    (img
      ? '<img class="nz-lvdb-fox-img" src="' + img + '" alt="NihongoZen fox mascot">'
      : '<div class="nz-lvdb-fox-emoji" style="padding-bottom:20px;">' + (emoji || '🦊') + '</div>') +
    '</div>';
}
function nzLvdbGoal(icon, title, text, ctaLabel, ctaColor, onClick) {
  return '<div class="nz-lvdb-goal">' +
    '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
      '<span style="font-size:18px;flex-shrink:0;">' + icon + '</span>' +
      '<div><div style="font-size:13px;font-weight:700;color:var(--fg);">' + title + '</div>' +
      '<div style="font-size:12px;color:var(--fg-muted);">' + text + '</div></div>' +
    '</div>' +
    '<button class="nz-lvdb-goal-btn" style="background:' + ctaColor + ';" onclick="' + onClick + '">' + ctaLabel + ' ›</button>' +
    '</div>';
}
/* Builds the full dashboard block (everything below the page's <h1>). */
function nzLevelDashboard(cfg) {
  return nzLvdbTopBar(cfg.topStats, cfg.ringPct, cfg.ringColor, cfg.ringLabel) +
    (cfg.tip ? nzLvdbTip(cfg.tip.icon, cfg.tip.text) : '') +
    '<div class="nz-lvdb-grid">' +
      cfg.levels.map(nzLvdbCard).join('') +
      (cfg.fox ? nzLvdbFox(cfg.fox.message, cfg.fox.sub, cfg.fox.emoji, cfg.fox.img) : '') +
    '</div>' +
    (cfg.goal ? nzLvdbGoal(cfg.goal.icon, cfg.goal.title, cfg.goal.text, cfg.goal.ctaLabel, cfg.goal.ctaColor, cfg.goal.onClick) : '');
}
window.nzLevelDashboard = nzLevelDashboard;

function speak(text, rate) {
  if (!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(String(text));
  u.lang = 'ja-JP';
  u.rate = rate || 0.85;
  window.speechSynthesis.speak(u);
}

function $id(id) { return document.getElementById(id); }

/* BUG FIX: when a page is rendering inside the Community Chat tabs
   (Chat / Community / Study Groups merged view), setHTML is redirected
   into the shared #nz-community-body container instead of #nz-content,
   so the three sub-pages can share one page shell without collisions. */
var _nzCommunityMode = false;
function setHTML(html) {
  var el = _nzCommunityMode ? $id('nz-community-body') : $id('nz-content');
  if (el) el.innerHTML = html;
}

function getUD() { return window._nzUserData || {}; }
function getU()  { return window._nzUser     || {}; }

function makeAvatar(photo, name, size, fontSize) {
  if (photo) {
    return '<img src="' + H(photo) + '" alt="' + H(name) +
      '" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;' +
      'object-fit:cover;border:2px solid var(--primary);flex-shrink:0;">';
  }
  return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;' +
    'background:linear-gradient(135deg,var(--primary),#B02050);display:flex;' +
    'align-items:center;justify-content:center;font-size:' + fontSize + 'px;' +
    'font-weight:800;color:#fff;flex-shrink:0;">' +
    H(name.charAt(0).toUpperCase()) + '</div>';
}

/* Dynamic time-of-day greeting, in Japanese — replaces the old static
   "Welcome back" heading. Recalculated every time the dashboard renders,
   so it's always correct for whenever the user opens the app. */
function nzTimeGreeting() {
  var h = new Date().getHours();
  if (h < 12) return 'おはようございます';   // Good morning
  if (h < 17) return 'こんにちは';            // Good afternoon
  return 'こんばんは';                        // Good evening
}
window.nzTimeGreeting = nzTimeGreeting;

/* Skeleton loading placeholder — used while Firestore data is being fetched,
   instead of a plain "Loading…" text label. */
function skeletonLines(n) {
  n = n || 3;
  var out = '';
  for (var i = 0; i < n; i++) {
    var w = 55 + Math.round(Math.random() * 35);
    out += '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;">' +
      '<div class="nz-skel" style="width:24px;height:24px;border-radius:50%;flex-shrink:0;"></div>' +
      '<div class="nz-skel" style="height:12px;border-radius:6px;width:' + w + '%;"></div>' +
    '</div>';
  }
  return out;
}
window.skeletonLines = skeletonLines;

/* ────────────────────────────────────────────────────────────────
   BADGES / ACHIEVEMENTS — computed client-side from user stats
──────────────────────────────────────────────────────────────── */
var NZ_BADGES = [
  { id:'first-steps',  emoji:'🌱', label:'First Steps',    desc:'Earn your first XP',            check:function(d){ return (d.xp||0) >= 10; } },
  { id:'week-warrior', emoji:'🔥', label:'Week Warrior',    desc:'7-day study streak',             check:function(d){ return (d.streak||0) >= 7; } },
  { id:'month-master', emoji:'🌋', label:'Month Master',    desc:'30-day study streak',            check:function(d){ return (d.streak||0) >= 30; } },
  { id:'century-streak',emoji:'💯',label:'Century Streak',  desc:'100-day study streak',           check:function(d){ return (d.streak||0) >= 100; } },
  { id:'rising-star',  emoji:'⭐', label:'Rising Star',     desc:'Reach 500 total XP',              check:function(d){ return (d.xp||0) >= 500; } },
  { id:'xp-champion',  emoji:'🌟', label:'XP Champion',     desc:'Reach 2,000 total XP',            check:function(d){ return (d.xp||0) >= 2000; } },
  { id:'level-5',      emoji:'🏯', label:'Dedicated Learner',desc:'Reach Level 5',                  check:function(d){ return (d.level||1) >= 5; } },
  { id:'level-10',     emoji:'🗻', label:'Zen Master',      desc:'Reach Level 10',                  check:function(d){ return (d.level||1) >= 10; } }
];
window.NZ_BADGES = NZ_BADGES;

function computeEarnedBadges(d) {
  return NZ_BADGES.filter(function(b){ try { return b.check(d); } catch(e){ return false; } }).map(function(b){ return b.id; });
}
window.computeEarnedBadges = computeEarnedBadges;

/* Re-check and persist newly-earned badges. Called after bootstrap and whenever
   xp/streak/level might have changed. Silently no-ops without a DB/user. */
function nzSyncBadges() {
  if (!window._nzDb || !window._nzUser) return;
  var d = getUD();
  var earned = computeEarnedBadges(d);
  var prev = d.badges || [];
  var isNew = earned.length !== prev.length || earned.some(function(id){ return prev.indexOf(id) === -1; });
  if (!isNew) return;
  d.badges = earned;
  window._nzUserData = d;
  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
    fs.setDoc(fs.doc(window._nzDb,'users',window._nzUser.uid), { badges: earned }, { merge: true });
  });
  earned.forEach(function(id){
    if (prev.indexOf(id) === -1) {
      var b = NZ_BADGES.find(function(x){ return x.id===id; });
      if (b && window.nzAddNotif) window.nzAddNotif('xp', b.emoji+' New Badge Earned!', b.label+' — '+b.desc);
    }

/* ────────────────────────────────────────────────────────────────
   GLOBAL JLPT LEVEL STATE
   Every section (kanji, vocab, grammar, reading, listening, kana...)
   should read window.NZ_LEVEL to decide which single level's data to
   show, instead of rendering all 5 levels at once. Sections can also
   listen for the 'nzlevelchange' event to re-render when the user
   switches level from the sidebar.
──────────────────────────────────────────────────────────────── */
/* Routes whose page content is scoped to a single JLPT level. When the
   sidebar level dropdown changes, or when the user clicks into one of
   these sections, we hand off NZ_LEVEL via the existing pendingLevel
   mechanism so the page opens directly on that level instead of a
   level-picker / all-levels view. */
var NZ_LEVEL_ROUTES = ['vocab', 'kanji', 'grammar', 'reading', 'listening', 'kana', 'srs', 'dashboard', 'jlpt-level', 'conversation'];

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-route]');
  if (!el) return;
  var route = el.dataset.route;
  if (NZ_LEVEL_ROUTES.indexOf(route) !== -1) {
    window._nzDashLevel = NZ_LEVEL;
  }
}, true);

var NZ_LEVEL = localStorage.getItem('nzLevel') || 'N5';

function nzSetLevel(level) {
  NZ_LEVEL = level;
  try { localStorage.setItem('nzLevel', level); } catch (e) {}

  var lbl = $id('nzLvlCurrentLabel');
  if (lbl) lbl.textContent = level;
  var box = $id('nzLvlBox');
  if (box) box.classList.remove('open');
  var menu = $id('nzLvlMenu');
  if (menu) {
    menu.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('nz-active', b.getAttribute('data-level') === level);
    });
  }

  /* If we're currently sitting on a level-scoped section, re-render it
     immediately with the new level instead of waiting for another click. */
  var currentRoute = (window.location.hash || '').replace('#', '');
  if (NZ_LEVEL_ROUTES.indexOf(currentRoute) !== -1) {
    window._nzDashLevel = level;
    if (window.NzRouter) window.NzRouter.go(currentRoute);
  }

  document.dispatchEvent(new CustomEvent('nzlevelchange', { detail: { level: level } }));
}

function nzToggleLevelMenu(e) {
  if (e) e.stopPropagation();
  var box = $id('nzLvlBox');
  if (box) box.classList.toggle('open');
}
document.addEventListener('click', function (e) {
  var box = $id('nzLvlBox');
  if (box && box.classList.contains('open') && !box.contains(e.target)) box.classList.remove('open');
});

/* ── Global nav-click handler — registered ONCE, outside renderShell ──
   BUG FIX: Previously this addEventListener was INSIDE renderShell(),
   so every re-render stacked a NEW click listener on document.
   Multiple listeners firing on every click caused the page to freeze.
   Now registered exactly once via _ensureNavListener(). */
var _nzNavListenerAdded = false;
function _ensureNavListener() {
  if (_nzNavListenerAdded) return;
  _nzNavListenerAdded = true;
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-route]');
    if (!el) return;
    e.preventDefault();
    var sb = $id('nz-sb');
    if (sb && sb.classList.contains('open') && sb.contains(el)) nzToggleSidebar();
    var pmenuWrap = el.closest('.nz-pmenu-wrap');
    if (pmenuWrap) pmenuWrap.classList.remove('open');
    NzRouter.go(el.dataset.route);
  });
}

function navLink(route, icon, label, colorToken) {
  var iconHtml = colorToken
    ? '<span class="nz-navicon nz-navicon-chip" style="background:var(--' + colorToken + '-dim);color:var(--' + colorToken + ');">' + icon + '</span>'
    : '<span class="nz-navicon">' + icon + '</span>';
  return '<a href="#' + route + '" data-route="' + route + '" class="nz-navlink">' +
    iconHtml +
    '<span class="nz-navlabel">' + label + '</span>' +
    '</a>';
}
function bottomNavItem(route, icon, label, colorToken) {
  var style = colorToken
    ? ' style="--bnav-c:var(--' + colorToken + '-dim);--bnav-fg:var(--' + colorToken + ');"'
    : '';
  return '<a href="#' + route + '" data-route="' + route + '" class="nz-bnav-item"' + style + '>' +
    '<span class="nz-bnav-badge">' + icon + '</span>' +
    '<span class="nz-bnav-label">' + label + '</span>' +
    '<span class="nz-bnav-dot"></span>' +
    '</a>';
}
function jlptLink(route, lv) {
  var c = jlptColor(lv);
  return '<a href="#' + route + '" data-route="' + route + '" class="nz-navlink">' +
    '<span class="nz-jbadge" style="color:' + c + ';background:' + c + '18;' +
      'border:1px solid ' + c + ';">' + jlptIcon(lv) + '</span>' +
    '<span class="nz-navlabel">' + lv + ' · ' + jlptLabel(lv) + '</span>' +
    '</a>';
}

window.nzToggleSidebar = function () {
  $id('nz-sb').classList.toggle('open');

};

      dashMod('文','Grammar',  'grammar',  selLevel, gramCount+' patterns · '+selLevel,    'var(--n3)') +

      ava +
      '<div style="flex:1;min-width:0;">' +
        '<h1 style="font-size:24px;font-weight:800;color:var(--fg);margin:0 0 5px;' +
          'letter-spacing:-.5px;">' + nzTimeGreeting() + ', ' + H(name) + ' 👋</h1>' +
        '<p style="font-size:13px;color:var(--fg-muted);margin:0;">' +
          'Level ' + level + ' · ' + xp + ' XP · ' + streak + ' day streak 🔥</p>' +
      '</div>' +
    '</div>' +
    '<div class="nz-xp-card">' +
      '<div class="nz-xp-row">' +
        '<span style="font-size:14px;font-weight:700;color:var(--fg);">Daily XP Goal</span>' +

      '<div style="margin-top:16px;">' +

      'gap:11px;margin-bottom:24px;">' +
      dashStat('🔥', 'Streak',   streak + ' days',           'var(--accent)') +

/* ── KANJI ── */
Pages.kanji = function () {
  var step      = 'grid';  // always show the grid for the sidebar's global level
  var activeTab = window.NZ_LEVEL || 'N5';
  var searchVal = '';
  var learned   = new Set();
  var HEX = { N5:'#22c55e', N4:'#06b6d4', N3:'#eab308', N2:'#a855f7', N1:'#ef4444' };

  function levelCount(lvl) {
    return (typeof kanjiData !== 'undefined' && kanjiData[lvl] ? kanjiData[lvl].length : 0);
  }

  function getFiltered() {
    var list = (typeof kanjiData !== 'undefined' ? kanjiData[activeTab] : null) || [];
    if (!searchVal) return list;
    var s = searchVal.toLowerCase();
    return list.filter(function (k) {
      return k.kanji.includes(s) ||
             k.meaning.toLowerCase().includes(s) ||
             k.reading.toLowerCase().includes(s);
    });
  }

  function renderGrid() {
    var f     = getFiltered();
    var color = jlptColor(activeTab);
    var grid  = $id('kj-grid');
    if (!grid) return;

    grid.innerHTML = f.map(function (k) {
      var isL = learned.has(k.id);
      return '<button class="kj-cell" data-id="' + k.id + '" ' +
        'style="border-color:' + (isL ? color + '55' : 'var(--border)') + ';">' +
        (isL ? '<span style="position:absolute;top:4px;right:4px;width:6px;height:6px;' +
          'border-radius:50%;background:' + color + ';"></span>' : '') +
        '<span style="font-family:\'Noto Serif JP\',serif;font-size:27px;line-height:1;' +
          'color:' + color + ';">' + H(k.kanji) + '</span>' +
        '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;' +

  /* ── STEP 1: Level Selection — shared dashboard (matches reference design) ── */
  function renderLevels() {
    var LEVELS = ['N5', 'N4', 'N3', 'N2', 'N1'];
    var saved = getSavedItems().kanji || {};
    var totalAll = 0, completedAll = 0;

    var levelCfgs = LEVELS.map(function (lvl) {
      var c = HEX[lvl], total = levelCount(lvl);
      var prog = nzProgGet('kanji', lvl);
      var completedCount = (prog.completed || []).filter(function (id) {
        var item = (typeof kanjiData !== 'undefined' && kanjiData[lvl]) ? kanjiData[lvl].find(function (k) { return k.id === id; }) : null;
        return !!item;
      }).length;
      var favCount = Object.keys(saved).filter(function (id) { return saved[id].level === lvl; }).length;
      var pct = total ? Math.round(completedCount / total * 100) : 0;
      totalAll += total; completedAll += completedCount;
      return {
        level: lvl, color: c, icon: jlptIcon(lvl),
        metaLines: [total + ' kanji'],
        pct: pct,
        innerStats: [

          { icon: '🔖', label: 'Favorites', value: favCount }
        ],
        buttonLabel: prog.lastStudied ? 'Continue Learning' : 'Start Learning',
        onClick: 'window.nzKanjiGoLevel(\'' + lvl + '\')'

    var d = getUD();

          { icon: '✅', value: completedAll, label: 'Studied', color: 'var(--success, #22c55e)' },
          { icon: '🔥', value: (d.streak || 0), label: 'Day Streak', color: 'var(--accent)' }
        ],
        ringPct: overallPct, ringColor: 'var(--primary)', ringLabel: 'Overall Progress',
        levels: levelCfgs,
        fox: { message: 'Every kanji you learn brings you closer to fluency!', sub: 'Keep going! ✨', img: 'assets/fox/fox-kanji-sign.png' },

/* ════════════════════════════════════════════════════════════════
   KANJI DETAIL PAGE + WRITING PRACTICE PAGE + SAVED (Feature 6)
════════════════════════════════════════════════════════════════ */
function relatedKanji(k, level) {
  var all = (typeof kanjiData !== 'undefined' && kanjiData[level]) ? kanjiData[level] : [];
  var myWords = (k.meaning || '').toLowerCase().split(/[\/,]/).map(function (s) { return s.trim(); }).filter(Boolean);
  var scored = all.filter(function (o) { return o.id !== k.id; }).map(function (o) {
    var oWords = (o.meaning || '').toLowerCase().split(/[\/,]/).map(function (s) { return s.trim(); }).filter(Boolean);
    var shared = myWords.filter(function (w) { return oWords.indexOf(w) !== -1; }).length;
    return { o: o, shared: shared };
  });
  scored.sort(function (a, b) { return b.shared - a.shared; });
  var withShared = scored.filter(function (s) { return s.shared > 0; });
  return (withShared.length ? withShared : scored).slice(0, 6).map(function (s) { return s.o; });
}

/* ── JLPT Words containing this kanji (scans the chapter vocab data
   across all levels for words whose surface text includes the
   current kanji character) ─────────────────────────────────────── */
function kanjiRelatedWords(kanjiChar) {
  var out = [], seen = {};
  if (typeof NZChapterData !== 'undefined') {
    var levels = ['N5', 'N4', 'N3', 'N2', 'N1'];
    levels.forEach(function (lv) {
      var chapters = NZChapterData[lv] || [];
      chapters.forEach(function (ch) {
        (ch.words || []).forEach(function (w) {
          if (!w.jp || !w.en) return;
          var m = /^([^(（]+)[\(（]([^)）]+)[\)）]/.exec(w.jp);
          var surface  = (m ? m[1] : w.jp).replace(/[。、\s]+$/g, '').trim();
          var furigana = (m ? m[2] : '').replace(/[。、\s]+$/g, '').trim();
          if (!surface || surface.indexOf(kanjiChar) === -1) return;
          var key = surface + '|' + w.en;
          if (seen[key]) return;
          seen[key] = true;
          out.push({ surface: surface, furigana: furigana, en: w.en, romaji: w.romaji || '', level: lv });
        });
      });
    });
  }
  // Second source: the general Basic Vocab word bank (VocabPageWords),
  // which isn't organized by chapter/level but still contains many real
  // words — useful extra coverage, especially for kanji that are sparse
  // in the level-based chapter data (mainly N2/N1).
  if (typeof VocabPageWords !== 'undefined' && out.length < 12) {
    VocabPageWords.forEach(function (w) {
      if (out.length >= 12 || !w.jp || !w.en) return;
      if (w.jp.indexOf(kanjiChar) === -1) return;
      var key = w.jp + '|' + w.en;
      if (seen[key]) return;
      seen[key] = true;
      out.push({ surface: w.jp, furigana: '', en: w.en, romaji: w.romaji || '', level: '' });
    });
  }
  return out.slice(0, 12);
}

/* ── Auto-generated mnemonic (templated from component labels; user can
   override with their own via the "✏️ Edit" control, saved locally) ── */
function kanjiMnemonic(k, radical) {
  if (!radical || !radical.parts.length) return null;
  var labels = radical.parts.map(function (p) { return p.l.toLowerCase(); });
  var joined = labels.length === 1 ? labels[0] :
    labels.slice(0, -1).join(', ') + ' and ' + labels[labels.length - 1];
  return 'Picture ' + joined + ' coming together to form ' + k.kanji + ' — "' + (k.meaning || '').split('/')[0].trim() + '."';
}
function getUserMnemonics() {
  try { return JSON.parse(localStorage.getItem('nz-mnemonics') || '{}'); } catch (e) { return {}; }
}
function saveUserMnemonic(kanjiId, text) {
  var all = getUserMnemonics();
  if (text) all[kanjiId] = text; else delete all[kanjiId];
  try { localStorage.setItem('nz-mnemonics', JSON.stringify(all)); } catch (e) {}
}

/* ── Confusable kanji: same stroke count + shares at least one visual
   component — a lightweight heuristic (not a curated linguistic list) for
   surfacing kanji that are easy to mix up at a glance ── */
function confusableKanji(k, radical, allList) {
  if (!radical) return [];
  var sc = kanjiStrokeCount(k.kanji);
  if (!sc) return [];
  var myComps = radical.parts.map(function (p) { return p.c; }).filter(Boolean);
  if (!myComps.length) return [];
  var seen = {}, out = [];
  allList.forEach(function (o) {
    if (o.kanji === k.kanji || seen[o.kanji]) return;
    if (kanjiStrokeCount(o.kanji) !== sc) return;
    var orad = KANJI_RADICAL_MAP[o.kanji];
    if (!orad) return;
    var oComps = orad.parts.map(function (p) { return p.c; }).filter(Boolean);
    var shared = myComps.filter(function (c) { return oComps.indexOf(c) !== -1; });
    if (shared.length >= 1) { seen[o.kanji] = true; out.push(o); }
  });
  return out.slice(0, 3);
}

/* ── Reverse lookup: other kanji that also contain a given component ── */
function kanjiWithComponent(char, excludeKanji) {
  var out = [];
  for (var k in KANJI_RADICAL_MAP) {
    if (k === excludeKanji || out.length >= 8) continue;
    var parts = KANJI_RADICAL_MAP[k].parts;
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].c === char) { out.push(k); break; }
    }
  }
  return out.slice(0, 8);
}

function initKanjiWriteCanvas(color, totalStrokes) {
  var canvas = $id('kw-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var drawing = false, strokesHistory = [], lastX = 0, lastY = 0, strokeCount = 0;

  function updateStrokeBadge() {
    var badge = $id('kw-stroke-badge');
    if (!badge) return;
    badge.textContent = '✍️ ' + strokeCount + (totalStrokes ? ' / ' + totalStrokes : '') + ' strokes';
  }

  function getPos(e) {
    var r = canvas.getBoundingClientRect(), src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
  }
  function start(e) {
    drawing = true; var p = getPos(e); lastX = p.x; lastY = p.y;
    strokesHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    strokeCount++; updateStrokeBadge();
    e.preventDefault();
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = getPos(e);
    ctx.strokeStyle = color; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  window.nzWriteUndo = function () {
    if (strokesHistory.length) {
      ctx.putImageData(strokesHistory.pop(), 0, 0);
      strokeCount = Math.max(0, strokeCount - 1); updateStrokeBadge();
    }
  };
  window.nzWriteClear = function () {
    strokesHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokeCount = 0; updateStrokeBadge();
  };
  window.nzWriteToggleTrace = function () {
    var ghost = $id('kw-ghost'), knob = $id('kw-trace-knob'), sw = $id('kw-trace-sw');
    if (!ghost) return;
    var showing = ghost.style.display !== 'none';
    ghost.style.display = showing ? 'none' : 'flex';
    if (sw) sw.style.background = showing ? 'var(--border)' : color;
    if (knob) knob.style.left = showing ? '2px' : '17px';
  };
  window.nzWritePlayGuide = function () {
    var ghost = $id('kw-ghost');
    if (!ghost) return;
    ghost.style.transition = 'none';
    ghost.style.clipPath = 'inset(0 100% 0 0)';
    ghost.style.opacity = '0.35';
    requestAnimationFrame(function () {
      ghost.style.transition = 'clip-path 1.4s ease';
      ghost.style.clipPath = 'inset(0 0 0 0)';
    });
    setTimeout(function () { ghost.style.opacity = '0.14'; }, 1500);
  };
}

};
window.nzGraphJumpToChar = function () {
  var ch = window._nzKanjiDetailChar;
  if (!ch || typeof kanjiData === 'undefined') return;
  var all = Object.values(kanjiData).flat();
  var match = all.find(function (x) { return x.kanji === ch; });
  if (!match) return;
  var m = /^k-(N[1-5])-/.exec(match.id);
  window._nzKanjiDetailId = match.id;
  window._nzKanjiDetailLevel = m ? m[1] : 'N5';
  nzGo('kanji-writing');
};

window.nzGraphStartQuiz = function (correctId, level, color) {
  var panel = $id('kw-quiz-panel');
  if (!panel || typeof kanjiData === 'undefined') return;
  var all = Object.values(kanjiData).flat();
  var correct = all.find(function (x) { return x.id === correctId; });
  var radical = correct && KANJI_RADICAL_MAP[correct.kanji];
  if (!correct || !radical) { panel.innerHTML = '<p style="font-size:12px;color:var(--fg-muted);">Quiz needs component data — not available for this kanji yet.</p>'; panel.style.display = 'block'; return; }
  var pool = all.filter(function (x) { return x.kanji !== correct.kanji && KANJI_RADICAL_MAP[x.kanji]; });
  var wrong = [];
  var poolCopy = pool.slice();
  while (wrong.length < 3 && poolCopy.length) {
    var idx = Math.floor(Math.random() * poolCopy.length);
    wrong.push(poolCopy.splice(idx, 1)[0]);
  }
  var choices = wrong.concat([correct]).sort(function () { return Math.random() - 0.5; });
  var partsLabel = radical.parts.map(function (p) { return p.l.toLowerCase(); }).join(' + ');
  panel.innerHTML =
    '<div style="padding:14px;border-radius:12px;background:var(--card-elevated);border:1px solid var(--border);text-align:center;">' +
      '<p style="font-size:12px;color:var(--fg-muted);margin:0 0 12px;">Which kanji is made of: <b style="color:var(--fg);">' + partsLabel + '</b>?</p>' +
      '<div id="kw-quiz-choices" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
        choices.map(function (c) {
          return '<button onclick="nzGraphQuizAnswer(this,\'' + c.kanji + '\',\'' + correct.kanji + '\',\'' + color + '\')" ' +
            'style="font-family:\'Noto Serif JP\',serif;font-size:26px;width:56px;height:56px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;">' + c.kanji + '</button>';
        }).join('') +
      '</div>' +
      '<div id="kw-quiz-result" style="margin-top:10px;font-size:12px;font-weight:700;min-height:16px;"></div>' +
      '<button onclick="nzGraphStartQuiz(\'' + correctId + '\',\'' + level + '\',\'' + color + '\')" class="nz-btn nz-btn-ghost" style="font-size:11px;margin-top:6px;">🔄 New Question</button>' +
    '</div>';
  panel.style.display = 'block';
};
window.nzGraphQuizAnswer = function (btn, picked, correct, color) {
  var choices = $id('kw-quiz-choices'), result = $id('kw-quiz-result');
  if (choices) {
    Array.prototype.forEach.call(choices.children, function (b) { b.disabled = true; b.style.cursor = 'default'; });
  }
  if (picked === correct) {
    btn.style.borderColor = '#22c55e'; btn.style.background = '#22c55e18';
    if (result) { result.textContent = '✓ Correct!'; result.style.color = '#22c55e'; }
  } else {
    btn.style.borderColor = '#ef4444'; btn.style.background = '#ef444418';
    if (choices) {
      Array.prototype.forEach.call(choices.children, function (b) {
        if (b.textContent === correct) { b.style.borderColor = '#22c55e'; b.style.background = '#22c55e18'; }
      });
    }
    if (result) { result.textContent = '✗ The answer was ' + correct; result.style.color = '#ef4444'; }
  }
};

      quizBlock(dlg.quiz, quizAns, showResults, score,

    window.nzLiAns    = function (qid, i) { quizAns[qid] = i; renderDetail(); };
    window.nzLiCheck  = function () { showResults = true; nzMarkCompleted('listening', dlg.level, dlg.id); renderDetail(); };
    window.nzLiRetry  = function () { quizAns = {}; showResults = false; renderDetail(); };

    var _liPlayStart = null;
    function _liFlushTime() {
      if (!_liPlayStart) return;
      nzAddListenTime(dlg.level, Math.round((Date.now() - _liPlayStart) / 1000));
      _liPlayStart = null;
    }

    window.nzLiPlay = async function () {
      if (isPlaying) {
        isPlaying = false;
        _liFlushTime();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        var btn = $id('li-play-btn');
        if (btn) { btn.textContent = '▶ Play Dialogue'; btn.style.background = 'var(--primary)'; }
        dlg.script.forEach(function (ln) {
          var el = $id('sc-' + ln.id);
          if (el) el.classList.remove('active');
        });
        return;
      }
      isPlaying = true;
      _liPlayStart = Date.now();
      var btn = $id('li-play-btn');
      if (btn) { btn.textContent = '⏹ Stop'; btn.style.background = 'var(--n3)'; }

      for (var i = 0; i < dlg.script.length; i++) {
        if (!isPlaying) break;
        var ln = dlg.script[i];
        var el = $id('sc-' + ln.id);
        if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        await speakAsync(ln.jp, 0.82, 600);
        if (el) el.classList.remove('active');
      }
      isPlaying = false;
      _liFlushTime();
      if (btn) { btn.textContent = '▶ Play Dialogue'; btn.style.background = 'var(--primary)'; }
    };
  }

  renderList();
};

/* ── JLPT LEVEL ── */
Pages.jlptLevel = function (lvl) {
  var lv    = lvl.toUpperCase();
  var color = jlptColor(lv);
  var desc  = {
    N5: jlptLabel('N5') + ' · Basic expressions and vocabulary',
    N4: jlptLabel('N4') + ' · Everyday topics and grammar',
    N3: jlptLabel('N3') + ' · Complex sentence structures',
    N2: jlptLabel('N2') + ' · Broad vocabulary range',
    N1: jlptLabel('N1') + ' · Near-native comprehension'
  }[lv] || '';

  var kList  = (typeof kanjiData !== 'undefined' ? kanjiData[lv] : null) || [];
  var gList  = typeof grammarPoints !== 'undefined' ? grammarPoints.filter(function (g) { return g.level === lv; }) : [];
  var rList  = typeof passages !== 'undefined' ? passages.filter(function (p) { return p.level === lv; }) : [];
  var liList = typeof dialogues !== 'undefined' ? dialogues.filter(function (d) { return d.level === lv; }) : [];
  var vLen   = typeof VocabPageWords !== 'undefined' ? VocabPageWords.length : 0;

  /* BUG FIX: jlptColor()/pctColor() return CSS "var(--n5)" strings, not raw
     hex. The previous code did `color + '18'` to make a translucent tint
     (e.g. for a raw hex "#22c55e" that gives a valid 8-digit hex color),
     but for a CSS variable that produces the literal string "var(--n5)18"
     — not a valid CSS color value — so every one of those `background:`
     declarations was silently dropped by the browser, leaving icons and
     pills with no color tint at all. That's why this page looked flat
     compared to Vocabulary/Grammar/Reading/Listening.
     Fix: use the matching pre-built "*-dim" token for tinted backgrounds
     instead of trying to concatenate alpha onto a var() reference — these
     are already tuned per theme (light/dark/etc.), so colors stay correct
     and legible automatically when the theme changes.
     Also: every row used the SAME single level color for every section,
     which read as monochrome. Each section now gets its own color, using
     the same Kanji/Vocab/Grammar/Reading/Listening palette already used
     on the Dashboard's Study Modules, so the whole app stays consistent. */
  var SECTION = {
    kanji:     { c: 'var(--n4)',     dim: 'var(--n4-dim)' },
    vocab:     { c: 'var(--n5)',     dim: 'var(--n5-dim)' },
    grammar:   { c: 'var(--n3)',     dim: 'var(--n3-dim)' },
    reading:   { c: 'var(--n1)',     dim: 'var(--n1-dim)' },
    listening: { c: 'var(--n2)',     dim: 'var(--n2-dim)' }
  };

  /* Per-section completion % — reads whatever real progress data already
     exists in localStorage for this level; falls back to 0 (untracked)
     rather than fabricating a number. */
  function sectionPct(key) {
    try {
      var raw = localStorage.getItem('nz_jlpt_progress_' + lv.toLowerCase());
      var obj = raw ? JSON.parse(raw) : {};
      return Math.max(0, Math.min(100, obj[key] || 0));
    } catch (e) { return 0; }
  }
  var kanjiPct = sectionPct('kanji'), vocabPct = sectionPct('vocab'),
      grammarPct = sectionPct('grammar'), readingPct = sectionPct('reading'),
      listeningPct = sectionPct('listening');
  var overallPct = Math.round((kanjiPct + vocabPct + grammarPct + readingPct + listeningPct) / 5);
  var lastStudied = (function(){
    try { return localStorage.getItem('nz_jlpt_last_' + lv.toLowerCase()) || 'Not studied yet'; }
    catch (e) { return 'Not studied yet'; }
  })();

  function pctInfo(p) {
    if (p >= 50) return { c: 'var(--n5)', dim: 'var(--n5-dim)' };
    if (p > 0)   return { c: 'var(--accent)', dim: 'var(--accent-dim)' };
    return { c: 'var(--fg-subtle)', dim: 'var(--card-elevated)' };
  }

  function row(sectionKey, icon, title, countLabel, desc, pct, route) {
    var s = SECTION[sectionKey];
    var p = pctInfo(pct);
    var statusLabel = pct > 0 ? (pct + '% complete') : 'not started';
    return '<div class="nz-sectionrow" onclick="nzGo(\'' + route + '\')" ' +
      'role="button" tabindex="0" ' +
      'aria-label="' + H(title + ', ' + countLabel + ', ' + statusLabel) + '" ' +

/* ── FOCUS TIMER ── */
Pages.timer = function () {
  var mode     = 'focus';
  var MODES    = { focus: 1500, short: 300, long: 900, custom: 600 };
  var duration = 1500;
  var remaining = 1500;
  var running  = false;
  var interval = null;
  var editingCustom = false;

  function fmt(s) {
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' +
           String(s % 60).padStart(2, '0');
  }

  function focusAlarms() {
    // Goal alarms synced into Focus Time (see Pages.goals)
    try { return JSON.parse(localStorage.getItem('nz-focus-alarms') || '[]'); }
    catch (e) { return []; }
  }

  function renderTimer() {
    var circ = 283;
    var pct  = 1 - (remaining / duration);
    var off  = circ * (1 - pct);
    var alarms = focusAlarms();

    setHTML(
      '<div class="nz-page nz-fadein" style="max-width:480px;">' +
      '<div style="margin-bottom:20px;">' +
        '<h1 style="font-size:22px;font-weight:800;color:var(--fg);margin:0 0 4px;' +
          'letter-spacing:-.4px;">⏱ Focus Timer</h1>' +
        '<p style="font-size:13px;color:var(--fg-muted);margin:0;">' +
          'Pomodoro-style study sessions</p>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">' +
        Object.keys(MODES).map(function (m) {
          var act = m === mode;
          var label = m === 'focus' ? '🎯 Focus 25m' : m === 'short' ? '☕ Short 5m' :
                      m === 'long' ? '🌿 Long 15m' : '⚙️ Custom';
          return '<button onclick="nzTimerMode(\'' + m + '\')" ' +
            'style="padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;' +
            'font-family:inherit;cursor:pointer;transition:all .15s;' +
            'background:' + (act ? 'var(--primary)' : 'var(--card-elevated)') + ';' +
            'color:' + (act ? '#fff' : 'var(--fg-muted)') + ';' +
            'border:1px solid ' + (act ? 'var(--primary)' : 'var(--border)') + ';">' +
            label + '</button>';
        }).join('') +
      '</div>' +
      (mode === 'custom' ? '<div style="text-align:center;font-size:12px;color:var(--fg-muted);margin-bottom:10px;">Tap the time below to set your own duration</div>' : '<div style="margin-bottom:30px;"></div>') +
      '<div style="display:flex;justify-content:center;margin-bottom:30px;">' +
        '<div style="position:relative;width:180px;height:180px;">' +
          '<svg width="180" height="180" viewBox="0 0 100 100" ' +
            'style="transform:rotate(-90deg);">' +
            '<circle cx="50" cy="50" r="45" fill="none" stroke="var(--card-elevated)" ' +
              'stroke-width="6"/>' +
            '<circle cx="50" cy="50" r="45" fill="none" stroke="var(--primary)" ' +
              'stroke-width="6" stroke-linecap="round" ' +
              'stroke-dasharray="' + circ + '" stroke-dashoffset="' + off + '" ' +
              'class="timer-ring"/>' +
          '</svg>' +
          '<div style="position:absolute;inset:0;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;">' +
            (mode === 'custom' && editingCustom ?
              '<input id="nz-timer-custom-input" type="number" min="1" max="180" ' +
                'value="' + Math.round(duration / 60) + '" ' +
                'style="width:70px;font-size:30px;font-weight:800;text-align:center;' +
                'color:var(--fg);background:var(--card);border:1px solid var(--primary);' +
                'border-radius:8px;font-family:\'JetBrains Mono\',monospace;" />' +
              '<button onclick="nzTimerCustomSave()" class="nz-btn nz-btn-pri" ' +
                'style="margin-top:8px;padding:4px 12px;font-size:11px;">Set</button>'
            :
              '<span id="nz-timer-disp" ' +
                (mode === 'custom' ? 'onclick="nzTimerEditCustom()" style="cursor:pointer;font-size:38px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;font-family:\'JetBrains Mono\',monospace;" title="Tap to set custom time"' :
                'style="font-size:38px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;font-family:\'JetBrains Mono\',monospace;"') +
                '>' + fmt(remaining) + '</span>' +
              '<span style="font-size:12px;color:var(--fg-muted);margin-top:4px;">' +
                (mode === 'focus' ? 'Focus Time' :
                 mode === 'short' ? 'Short Break' :
                 mode === 'long'  ? 'Long Break'  : 'Custom (tap to edit)') + '</span>'
            ) +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:10px;justify-content:center;margin-bottom:26px;">' +
        '<button id="nz-timer-start" onclick="nzTimerToggle()" class="nz-btn nz-btn-pri" ' +
          'style="min-width:110px;justify-content:center;">' +
          (running ? '⏸ Pause' : '▶ Start') + '</button>' +
        '<button onclick="nzTimerReset()" class="nz-btn nz-btn-ghost">↺ Reset</button>' +
      '</div>' +
      (alarms.length ? (
        '<div class="card" style="padding:16px;">' +
          '<div style="font-size:13px;font-weight:700;color:var(--fg);margin-bottom:10px;">🔔 Scheduled from your Goals</div>' +
          alarms.map(function (a) {
            var t = new Date(a.time);
            var hh = String(t.getHours()).padStart(2,'0'), mm = String(t.getMinutes()).padStart(2,'0');
            return '<div style="display:flex;justify-content:space-between;align-items:center;' +
              'padding:8px 0;border-top:1px solid var(--border);font-size:12px;">' +
              '<span style="color:var(--fg);">🎯 ' + H(a.goalTitle) + '</span>' +
              '<span style="color:var(--fg-muted);font-family:\'JetBrains Mono\',monospace;">' + hh + ':' + mm + ' daily</span>' +
            '</div>';
          }).join('') +
        '</div>'
      ) : '') +
      '</div>'
    );

    window.nzTimerMode = function (m) {
      mode = m; duration = MODES[m]; remaining = duration;
      running = false; editingCustom = false; clearInterval(interval); renderTimer();
    };
    window.nzTimerEditCustom = function () {
      editingCustom = true; renderTimer();
      var inp = $id('nz-timer-custom-input');
      if (inp) { inp.focus(); inp.select(); }
    };
    window.nzTimerCustomSave = function () {
      var inp = $id('nz-timer-custom-input');
      var mins = Math.min(180, Math.max(1, parseInt(inp && inp.value) || 10));
      MODES.custom = mins * 60;
      duration = MODES.custom; remaining = duration;
      editingCustom = false; running = false; clearInterval(interval);
      renderTimer();
    };
    window.nzTimerToggle = function () {
      running = !running;
      var btn = $id('nz-timer-start');
      if (btn) btn.textContent = running ? '⏸ Pause' : '▶ Start';
      if (running) {
        interval = setInterval(function () {
          remaining--;
          var disp = $id('nz-timer-disp');
          if (disp) disp.textContent = fmt(remaining);
          if (remaining <= 0) {
            clearInterval(interval); running = false;
            if (window.Audio && Audio.chime) Audio.chime();
            if (window.nzAddNotif) window.nzAddNotif('reminder', '⏱ Focus Time Ended', 'Your ' + (mode === 'custom' ? Math.round(MODES.custom/60) + ' min' : mode) + ' session is complete!');
            renderTimer();
          }
        }, 1000);
      } else {
        clearInterval(interval);
      }
    };
    window.nzTimerReset = function () {
      clearInterval(interval); running = false; remaining = duration; renderTimer();
    };
  }

  renderTimer();
};

function quizBlock(quiz, answers, showResults, score, ansFn, checkFn, retryFn) {
  var allAnswered = Object.keys(answers).length >= quiz.length;
  return '<div class="card" style="padding:20px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;' +
      'margin-bottom:15px;">' +
      '<h3 style="font-size:13px;font-weight:700;color:var(--fg);' +
        'margin:0;">Comprehension Quiz</h3>' +
      (showResults
        ? '<span style="font-size:13px;font-weight:700;color:' +
          (score === quiz.length ? 'var(--n5)' : 'var(--primary)') + ';">' +
          score + '/' + quiz.length + ' correct</span>'
        : '') +
    '</div>' +
    quiz.map(function (q) {
      return '<div style="margin-bottom:15px;">' +
        '<p style="font-size:13px;font-weight:700;color:var(--fg);' +
          'margin:0 0 9px;">' + H(q.question) + '</p>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
          q.options.map(function (opt, i) {
            var chosen  = answers[q.id] === i;
            var correct = i === q.answer;
            var bg = 'var(--card-elevated)', bc = 'var(--border)', cl = 'var(--fg)';
            if (showResults && correct)            { bg = 'var(--n5-dim)'; bc = 'var(--n5)'; cl = 'var(--n5)'; }
            if (showResults && chosen && !correct) { bg = 'var(--primary-dim)'; bc = 'var(--primary)'; cl = 'var(--primary)'; }
            else if (!showResults && chosen)       { bg = 'var(--primary-dim)'; bc = 'var(--primary)'; cl = 'var(--primary)'; }
            var icon = '';
            if (showResults && chosen && correct)  icon = '✅ ';
            else if (showResults && chosen)        icon = '❌ ';
            else if (showResults && correct)       icon = '✅ ';
            return '<button class="q-opt" ' +
              (showResults ? 'disabled ' : 'onclick="' + ansFn + '(\'' + q.id + '\',' + i + ')" ') +
              'style="background:' + bg + ';border-color:' + bc + ';color:' + cl + ';' +
              'cursor:' + (showResults ? 'default' : 'pointer') + ';">' +
              icon + H(opt) + '</button>';
          }).join('') +
        '</div></div>';
    }).join('') +
    (!showResults
      ? '<button onclick="' + checkFn + '()" class="nz-btn nz-btn-pri" ' +
        'style="width:100%;justify-content:center;margin-top:4px;" ' +
        (allAnswered ? '' : 'disabled') + '>' +
        'Check Answers</button>'
      : '<button onclick="' + retryFn + '()" class="nz-btn nz-btn-ghost" ' +
        'style="width:100%;justify-content:center;margin-top:4px;">Try Again</button>') +
    '</div>';
}

/* ────────────────────────────────────────────────────────────────
   ASYNC SPEECH HELPER
──────────────────────────────────────────────────────────────── */
function speakAsync(text, rate, pauseAfter) {
  return new Promise(function (resolve) {
    if (!window.speechSynthesis || !text) { setTimeout(resolve, pauseAfter || 500); return; }
    window.speechSynthesis.cancel();
    var u  = new SpeechSynthesisUtterance(String(text));
    u.lang = 'ja-JP';
    u.rate = rate || 0.82;
    u.onend  = function () { setTimeout(resolve, pauseAfter || 600); };
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

  var changed = false;
  notes.forEach(function(note) {
    if (note.alarmTime && !note.alarmFired && now >= note.alarmTime) {
      note.alarmFired = true; changed = true;
      window.nzAddNotif('reminder', '⏰ Note Reminder', note.title || 'Study reminder');
    }
  });
  if (changed) localStorage.setItem('nz-notes', JSON.stringify(notes));

/* ── Goal alarms (synced with Focus Time) — daily recurring ── */
setInterval(function() {
  var list = [];
  try { list = JSON.parse(localStorage.getItem('nz-focus-alarms') || '[]'); } catch(e) {}
  if (!list.length) return;
  var now = Date.now();
  var changed = false;
  list.forEach(function(a) {
    if (a.time && now >= a.time) {
      changed = true;
      if (window.Audio && Audio.chime) Audio.chime();
      if (window.nzAddNotif) window.nzAddNotif('goal', '🎯 Goal Reminder', (a.goalTitle || 'Study goal') + ' — time to focus!');
      // reschedule for the same time tomorrow
      var parts = (a.hm || '00:00').split(':');
      var next = new Date();
      next.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
      next.setDate(next.getDate() + 1);
      a.time = next.getTime();
    }
  });
  if (changed) localStorage.setItem('nz-focus-alarms', JSON.stringify(list));
}, 60000);

                'background:' + (dk===todayKey?'var(--primary)':'var(--n5)') + ';' +
                'opacity:' + (pct2?'1':'0.2') + ';height:' + Math.max(4,pct2*0.46) + 'px;transition:height .4s;"></div>' +
              '<span style="font-size:9px;color:var(--fg-subtle);">' + day + '</span></div>';
          }
          return bars;
        })() +
      '</div>' +
    '</div>' +
    '</div>'
  );
}

window.nzPlannerQuickAdd = function(label, xp) {
  var tasks = JSON.parse(localStorage.getItem('nz-planner-tasks') || '[]');
  tasks.push({ label: label, xp: xp, done: false });
  localStorage.setItem('nz-planner-tasks', JSON.stringify(tasks));
  Pages.progress();
};

window.nzPlannerAdd = function() {
  var inp = document.getElementById('nz-plan-inp');
  var xpSel = document.getElementById('nz-plan-xp');
  if (!inp || !inp.value.trim()) return;
  var tasks = JSON.parse(localStorage.getItem('nz-planner-tasks') || '[]');
  tasks.push({ label: inp.value.trim(), xp: parseInt(xpSel ? xpSel.value : 10), done: false });
  localStorage.setItem('nz-planner-tasks', JSON.stringify(tasks));
  Pages.progress();
};

window.nzPlannerToggle = function(i) {
  var tasks = JSON.parse(localStorage.getItem('nz-planner-tasks') || '[]');
  if (!tasks[i]) return;
  tasks[i].done = !tasks[i].done;
  if (tasks[i].done && window._nzAddXP) {
    window._nzAddXP(tasks[i].xp);
    window.nzAddNotif('task', '✅ Task Complete', 'You earned +' + tasks[i].xp + ' XP!');
    var history = JSON.parse(localStorage.getItem('nz-planner-history') || '{}');
    var todayKey = new Date().toISOString().slice(0, 10);
    var done2 = tasks.filter(function(t){ return t.done; }).length;
    history[todayKey] = Math.round(done2 / tasks.length * 100);
    localStorage.setItem('nz-planner-history', JSON.stringify(history));
  }
  localStorage.setItem('nz-planner-tasks', JSON.stringify(tasks));
  Pages.progress();
};

window.nzPlannerDelete = function(i) {
  var tasks = JSON.parse(localStorage.getItem('nz-planner-tasks') || '[]');
  tasks.splice(i, 1);
  localStorage.setItem('nz-planner-tasks', JSON.stringify(tasks));
  Pages.progress();
};

/* ════════════════════════════════════════════════════════════════
   FEATURE 10 — Weekly Progress Report
════════════════════════════════════════════════════════════════ */
function renderWeeklyReport() {
  var d = getUD();
  var xpHistory = JSON.parse(localStorage.getItem('nz-xp-history') || '{}');
  var vals = Object.values(xpHistory).concat([100]);
  var maxXP = Math.max.apply(null, vals);

  var days = [];
  for (var i = 6; i >= 0; i--) {
    var dt = new Date(); dt.setDate(dt.getDate() - i);
    var dk = dt.toISOString().slice(0, 10);
    days.push({ key: dk, day: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()], xp: xpHistory[dk] || 0 });
  }
  var weekXP = days.reduce(function(s, d2){ return s + d2.xp; }, 0);
  var tKanji = typeof kanjiData !== 'undefined' ? Object.values(kanjiData).reduce(function(s, a){ return s + a.length; }, 0) : 0;

  return (
    '<div class="card" style="padding:20px;margin-bottom:14px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
      '<h3 style="font-size:14px;font-weight:700;color:var(--fg);margin:0;">📊 Weekly Progress Report</h3>' +
      '<button onclick="nzShareReport()" class="nz-btn nz-btn-ghost" style="font-size:12px;padding:6px 12px;">↑ Share</button>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;">' +
      wkStat('⭐','XP This Week', weekXP) +
      wkStat('漢','Kanji', d.weeklyKanji || 0) +
      wkStat('語','Vocab', d.weeklyVocab || 0) +
      wkStat('📚','Lessons', d.weeklyLessons || 0) +
    '</div>' +
    '<div style="margin-bottom:16px;">' +
      '<div style="font-size:11px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;">Daily XP</div>' +
      '<div style="display:flex;align-items:flex-end;gap:5px;height:70px;">' +
        days.map(function(dy) {
          var h = Math.max(4, Math.round((dy.xp / maxXP) * 62));
          var isToday = dy.key === new Date().toISOString().slice(0,10);
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">' +
            '<span style="font-size:9px;color:var(--fg-subtle);">' + (dy.xp > 0 ? dy.xp : '') + '</span>' +
            '<div style="width:100%;border-radius:4px 4px 0 0;' +
              'background:' + (isToday ? 'var(--primary)' : 'var(--accent)') + ';' +
              'opacity:' + (dy.xp ? '0.9' : '0.15') + ';height:' + h + 'px;transition:height .4s;"></div>' +
            '<span style="font-size:9px;color:var(--fg-subtle);">' + dy.day + '</span></div>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div style="font-size:11px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;">Study Breakdown</div>' +
    progressRow('Kanji',    d.kanjiCount       || 0, tKanji,                                       'var(--n4)') +
    progressRow('Vocab',    d.vocabMastered    || 0, typeof VocabPageWords!=='undefined'?VocabPageWords.length:0,'var(--n5)') +
    progressRow('Grammar',  d.lessonsCompleted || 0, typeof grammarPoints!=='undefined'?grammarPoints.length:0, 'var(--n3)') +
    progressRow('Accuracy', d.quizAccuracy     || 0, 100,                                          'var(--n2)') +
    '<div style="margin-top:14px;">' +
      '<div style="font-size:11px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Achievements</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:7px;">' +
        ((d.streak||0) >= 7  ? achBadge('🔥','7-Day Streak') : '') +
        ((d.streak||0) >= 30 ? achBadge('🏆','30-Day Streak') : '') +
        ((d.xp||0) >= 1000   ? achBadge('⭐','1000 XP Club') : '') +
        ((d.kanjiCount||0) >= 50 ? achBadge('漢','Kanji Learner') : '') +
        achBadge('🌱','Started Learning') +
      '</div>' +
    '</div>' +
    '</div>'
  );
}

Pages.goals = function() {
  var goals = JSON.parse(localStorage.getItem('nz-goals') || 'null');
  if (!goals) {
    goals = [
      { id:'g1', title:'Pass JLPT N5', desc:'Achieve N5 certification', emoji:'🎌', target:100, unit:'%', progress:0 },
      { id:'g2', title:'500 Vocabulary Words', desc:'Master 500 essential words', emoji:'語', target:500, unit:'words', progress:0 },
      { id:'g3', title:'30-Day Streak', desc:'Study every day for 30 days', emoji:'🔥', target:30, unit:'days', progress:getUD().streak||1 },
      { id:'g4', title:'200 Kanji', desc:'Learn 200 kanji characters', emoji:'漢', target:200, unit:'kanji', progress:getUD().kanjiCount||0 }
    ];
    localStorage.setItem('nz-goals', JSON.stringify(goals));
  }

  function renderGoals() {
    setHTML(
      '<div class="nz-page nz-fadein">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">' +
        '<div>' +
          '<h1 style="font-size:22px;font-weight:800;color:var(--fg);margin:0 0 4px;letter-spacing:-.4px;">🎯 My Goals</h1>' +
          '<p style="font-size:13px;color:var(--fg-muted);margin:0;">Set targets and track your learning milestones</p>' +
        '</div>' +
        '<button onclick="nzGoalNew()" class="nz-btn nz-btn-pri">+ New Goal</button>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;">' +
        goals.map(function(g) {
          var pct = Math.min(100, Math.round(g.progress / Math.max(g.target,1) * 100));
          var done = pct >= 100;
          return '<div class="card" style="padding:20px;border-top:3px solid ' + (done?'var(--n5)':'var(--primary)') + ';">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">' +
              '<span style="font-size:26px;">' + H(g.emoji) + '</span>' +
              '<div style="display:flex;gap:6px;">' +
                (done ? '<span style="font-size:11px;font-weight:700;color:var(--n5);background:rgba(34,197,94,.15);border:1px solid var(--n5);padding:2px 8px;border-radius:6px;">✅ Complete</span>' : '') +
                '<button onclick="nzGoalUpdate(\'' + H(g.id) + '\')" style="background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:14px;" title="Update progress">✏️</button>' +
                '<button onclick="nzGoalDelete(\'' + H(g.id) + '\')" style="background:none;border:none;cursor:pointer;color:var(--fg-subtle);font-size:14px;" title="Delete">🗑️</button>' +
              '</div>' +
            '</div>' +
            '<div style="font-size:15px;font-weight:700;color:var(--fg);margin-bottom:3px;">' + H(g.title) + '</div>' +
            '<div style="font-size:12px;color:var(--fg-muted);margin-bottom:12px;">' + H(g.desc) + '</div>' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
              '<span style="font-size:12px;color:var(--fg-muted);">' + g.progress + ' / ' + g.target + ' ' + H(g.unit) + '</span>' +
              '<span style="font-size:12px;font-weight:700;color:' + (done?'var(--n5)':'var(--primary)') + ';">' + pct + '%</span>' +
            '</div>' +
            '<div style="background:var(--card-elevated);border-radius:99px;overflow:hidden;height:6px;">' +
              '<div style="width:' + pct + '%;height:6px;border-radius:99px;background:' + (done?'var(--n5)':'linear-gradient(90deg,var(--primary),var(--accent))') + ';transition:width .5s;"></div>' +
            '</div></div>';
        }).join('') +
      '</div></div>'
    );
  }

  window.nzGoalNew = function() {
    var ov = document.createElement('div'); ov.className = 'nz-overlay-bg';
    ov.innerHTML = '<div class="nz-modal-box">' +
      '<button onclick="this.closest(\'.nz-overlay-bg\').remove()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:22px;line-height:1;">×</button>' +
      '<h3 style="font-size:16px;font-weight:700;color:var(--fg);margin:0 0 16px;">🎯 New Goal</h3>' +
      goalField('Title','nz-gnew-title','text','e.g. Pass JLPT N4') +
      goalField('Description','nz-gnew-desc','text','Brief description') +
      goalField('Target Number','nz-gnew-target','number','100') +
      goalField('Unit','nz-gnew-unit','text','e.g. %, words, kanji') +
      goalField('Emoji','nz-gnew-emoji','text','🎌') +
      '<label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:5px;">⏰ Alarm / Reminder (optional)</label>' +
      '<input id="nz-gnew-alarm" type="time" ' +
        'style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);' +
        'background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;' +
        'box-sizing:border-box;margin-bottom:4px;">' +
      '<div style="font-size:11px;color:var(--fg-subtle);margin-bottom:12px;">Reminds you daily at this time, and syncs to Focus Time</div>' +
      '<button onclick="nzGoalSaveNew()" class="nz-btn nz-btn-pri" style="width:100%;justify-content:center;margin-top:2px;">Create Goal</button></div>';
    document.body.appendChild(ov);
  };

  window.nzGoalSaveNew = function() {
    var f = function(id){ return document.getElementById(id); };
    if (!f('nz-gnew-title') || !f('nz-gnew-title').value.trim()) return;
    var alarmVal = (f('nz-gnew-alarm') && f('nz-gnew-alarm').value) || '';
    var goal = { id:'g'+Date.now(), title:f('nz-gnew-title').value.trim(),
      desc:(f('nz-gnew-desc')&&f('nz-gnew-desc').value.trim())||'',
      target:parseInt((f('nz-gnew-target')&&f('nz-gnew-target').value)||100)||100,
      unit:(f('nz-gnew-unit')&&f('nz-gnew-unit').value.trim())||'%',
      emoji:(f('nz-gnew-emoji')&&f('nz-gnew-emoji').value.trim())||'🎯', progress:0,
      alarmHM: alarmVal || null, alarmFiredKey: null };
    goals.push(goal);
    localStorage.setItem('nz-goals', JSON.stringify(goals));
    if (alarmVal) nzSyncGoalAlarmToFocus(goal);
    var ov = document.querySelector('.nz-overlay-bg'); if (ov) ov.remove();
    renderGoals();
  };

  /* Sync a goal's alarm time into the Focus Time page's scheduled list */
  window.nzSyncGoalAlarmToFocus = function(goal) {
    if (!goal.alarmHM) return;
    var parts = goal.alarmHM.split(':');
    var next = new Date();
    next.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
    if (next.getTime() <= Date.now()) next.setDate(next.getDate() + 1);
    var list = [];
    try { list = JSON.parse(localStorage.getItem('nz-focus-alarms') || '[]'); } catch(e) {}
    list = list.filter(function(a){ return a.goalId !== goal.id; });
    list.push({ goalId: goal.id, goalTitle: goal.title, hm: goal.alarmHM, time: next.getTime() });
    localStorage.setItem('nz-focus-alarms', JSON.stringify(list));
  };

  window.nzGoalUpdate = function(id) {
    var g = goals.find(function(x){return x.id===id;}); if (!g) return;
    var ov = document.createElement('div'); ov.className = 'nz-overlay-bg';
    ov.innerHTML = '<div class="nz-modal-box">' +
      '<button onclick="this.closest(\'.nz-overlay-bg\').remove()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:22px;line-height:1;">×</button>' +
      '<h3 style="font-size:16px;font-weight:700;color:var(--fg);margin:0 0 16px;">Update: ' + H(g.title) + '</h3>' +
      '<label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:5px;">Current Progress (' + H(g.unit) + ')</label>' +
      '<input id="nz-gupd-val" type="number" value="' + g.progress + '" min="0" max="' + g.target + '" ' +
        'style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:14px;font-family:inherit;box-sizing:border-box;">' +
      '<button onclick="nzGoalSaveUpdate(\'' + H(id) + '\')" class="nz-btn nz-btn-pri" style="width:100%;justify-content:center;margin-top:14px;">Save Progress</button></div>';
    document.body.appendChild(ov);
  };

  window.nzGoalSaveUpdate = function(id) {
    var inp = document.getElementById('nz-gupd-val'); if (!inp) return;
    var g = goals.find(function(x){return x.id===id;}); if (!g) return;
    var prev = g.progress;
    g.progress = Math.min(g.target, parseInt(inp.value) || 0);
    localStorage.setItem('nz-goals', JSON.stringify(goals));
    var ov = document.querySelector('.nz-overlay-bg'); if (ov) ov.remove();
    if (g.progress >= g.target && prev < g.target) {
      if (window._nzAddXP) window._nzAddXP(100);
      window.nzAddNotif('goal','🎯 Goal Complete!', g.title + ' — +100 XP!');
    }
    renderGoals();
  };

  window.nzGoalDelete = function(id) {
    goals = goals.filter(function(g){return g.id!==id;});
    localStorage.setItem('nz-goals', JSON.stringify(goals));
    try {
      var list = JSON.parse(localStorage.getItem('nz-focus-alarms') || '[]');
      list = list.filter(function(a){ return a.goalId !== id; });
      localStorage.setItem('nz-focus-alarms', JSON.stringify(list));
    } catch(e) {}
    renderGoals();
  };

  renderGoals();
};

Pages.notes = function() {
  var notes = JSON.parse(localStorage.getItem('nz-notes') || '[]');

  function saveAndRender() {
    localStorage.setItem('nz-notes', JSON.stringify(notes));
    renderNotes();
  }

  function renderNotes() {
    var pinned   = notes.filter(function(n){return n.pinned;});
    var unpinned = notes.filter(function(n){return !n.pinned;});
    var sorted   = pinned.concat(unpinned);

    setHTML(
      '<div class="nz-page nz-fadein">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">' +
