<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NihongoZen</title>

  <style>
    /* ── CSS Variables / Design Tokens ── */
    :root {
      /* Sidebar */
      --sidebar-width:   240px;
      --topbar-height:   52px;

      /* Dark theme (default) */
      --bg:              #0d0d0f;
      --bg-secondary:    #111114;
      --card:            #1a1a1e;
      --card-elevated:   #1f1f24;
      --border:          #2a2a30;
      --fg:              #f0f0f2;
      --fg-muted:        #8a8a9a;
      --fg-subtle:       #5a5a6a;

      /* Brand */
      --primary:         #e8446a;
      --primary-hover:   #c73358;
      --primary-dim:     rgba(232,68,106,.12);
      --accent:          #f59e0b;
      --success:         #10b981;

      /* JLPT colours */
      --n5: #22c55e; --n4: #3b82f6;
      --n3: #f59e0b; --n2: #ef4444; --n1: #8b5cf6;

      /* Misc */
      --radius:    8px;
      --radius-lg: 14px;
      --shadow:    0 8px 32px rgba(0,0,0,.45);
      --duration:  .25s;
      --duration-fast: .15s;
      --ease:      cubic-bezier(.4,0,.2,1);
      --font-jp:   'Noto Serif JP', serif;
      --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
    }

    /* Light mode */
    body.nz-light {
      --bg:           #f5f5f7;
      --bg-secondary: #ffffff;
      --card:         #ffffff;
      --card-elevated:#f0f0f4;
      --border:       #e0e0e8;
      --fg:           #1a1a2e;
      --fg-muted:     #6a6a8a;
      --fg-subtle:    #9a9ab0;
      --primary-dim:  rgba(232,68,106,.08);
      --shadow:       0 4px 20px rgba(0,0,0,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Loading screen ── */
    #nz-loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center;
      justify-content: center; z-index: 9999;
      flex-direction: column; gap: 16px;
    }
    #nz-loading.hidden { display: none; }
    .nz-load-logo {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e8446a, #b02050);
      display: flex; align-items: center;
      justify-content: center;
      font-family: 'Noto Serif JP', serif;
      font-size: 22px; color: #fff;
      box-shadow: 0 0 30px rgba(232,68,106,.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 20px rgba(232,68,106,.3); }
      50%      { box-shadow: 0 0 40px rgba(232,68,106,.6); }
    }
    .nz-load-text {
      font-size: 13px; color: var(--fg-muted);
      font-family: var(--font-mono);
    }

    /* progress track */
    .progress-track {
      width: 100%; background: var(--card-elevated);
      border-radius: 99px; overflow: hidden;
    }
    .progress-fill { border-radius: 99px; transition: width .5s var(--ease); }
  </style>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Loading screen shown until Firebase auth check + data load -->
  <div id="nz-loading">
    <div class="nz-load-logo">禅</div>
    <div class="nz-load-text">Loading NihongoZen…</div>
  </div>

  <!--
    ══════════════════════════════════════════════════════
    FILE LOAD ORDER  (place JS files in your project root
    or adjust paths accordingly)
    ══════════════════════════════════════════════════════
    1. nz-data.js          — kanjiData, grammarPoints, etc.
    2. nz-kana.js          — kana chart helpers
    3. nz-vocab-module.js  — VocabPage IIFE
    4. nz-pages.js         — renderShell, Router, Pages
    5. auth-guard.js       — Firebase auth + user doc
    6. This inline bootstrap script (last)
  -->

  <script src="nz-data.js"></script>
  <script src="nz-kana.js"></script>
  <script src="nz-vocab-module.js"></script>
  <script src="nz-pages.js"></script>

  <!-- Auth guard as module — handles redirect to login.html if not signed in -->
  <script type="module" src="auth-guard.js"></script>

  <script>
    /* ══════════════════════════════════════════════════════════
       _nzBootstrap  — called once auth-guard fires nz:userReady
       ══════════════════════════════════════════════════════════ */
    window._nzBootstrap = function () {
      // Hide loading screen
      var loading = document.getElementById('nz-loading');
      if (loading) loading.classList.add('hidden');

      // Build shell (sidebar + main area)
      if (typeof renderShell === 'function') {
        renderShell();
      }

      // Register all routes
      var R = window.Router;
      var P = window.Pages;
      if (!R || !P) return;

      R.register('dashboard',  function(){ P.dashboard();          });
      R.register('kanji',      function(){ P.kanji();              });
      R.register('vocab',      function(){ P.vocab();              });
      R.register('grammar',    function(){ P.grammar();            });
      R.register('listening',  function(){ P.listening();          });
      R.register('reading',    function(){ P.reading();            });
      R.register('kana',       function(){ P.kana();               });
      R.register('timer',      function(){ P.timer();              });
      R.register('progress',   function(){ P.progress();           });
      R.register('profile',    function(){ P.profile();            });
      R.register('jlpt-n5',   function(){ P.jlptLevel('N5');      });
      R.register('jlpt-n4',   function(){ P.jlptLevel('N4');      });
      R.register('jlpt-n3',   function(){ P.jlptLevel('N3');      });
      R.register('jlpt-n2',   function(){ P.jlptLevel('N2');      });
      R.register('jlpt-n1',   function(){ P.jlptLevel('N1');      });

      // Navigate to hash or default to dashboard
      var hash = window.location.hash.replace('#', '');
      R.go(hash || 'dashboard');

      // Back/forward browser navigation
      window.addEventListener('popstate', function () {
        var h = window.location.hash.replace('#', '');
        if (h) R.go(h);
      });
    };

    /* ── Listen for auth-guard "user ready" event ── */
    document.addEventListener('nz:userReady', function (e) {
      // Small delay so auth-guard can finish any DOM setup
      setTimeout(window._nzBootstrap, 50);
    });

    /* ── Theme toggle helper (callable from pages) ── */
    window._nzLightMode = false;
    window.nzToggleTheme = function () {
      window._nzLightMode = !window._nzLightMode;
      document.body.classList.toggle('nz-light', window._nzLightMode);
      try { localStorage.setItem('nz-theme', window._nzLightMode ? 'light' : 'dark'); }
      catch(e){}
    };
    // Restore saved theme
    try {
      if (localStorage.getItem('nz-theme') === 'light') {
        window._nzLightMode = true;
        document.body.classList.add('nz-light');
      }
    } catch(e){}
  </script>

</body>
</html>
