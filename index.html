<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="NihongoZen — Japanese Language Learning Platform"/>
<meta name="theme-color" content="#0F0F14"/>
<title>NihongoZen — Japanese Learning</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<!-- Stylesheets -->
<link rel="stylesheet" href="css/tokens.css"/>
<link rel="stylesheet" href="css/layout.css"/>
<link rel="stylesheet" href="css/components.css"/>

<style>
  /* Auth loading screen — shown until Firebase confirms user */
  #auth-loading {
    position: fixed; inset: 0; z-index: 9999;
    background: #0F0F14;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    transition: opacity 0.4s ease;
  }
  #auth-loading.fade-out { opacity: 0; pointer-events: none; }
  .auth-logo-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, #E8446A, #B02050);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif JP', serif;
    font-size: 24px; color: #fff; font-weight: 700;
    box-shadow: 0 0 32px rgba(232,68,106,0.4);
    animation: authPulse 1.8s ease-in-out infinite;
  }
  .auth-loading-text {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px; color: #8888A0;
  }
  .auth-loading-dots::after {
    content: ''; animation: dots 1.5s steps(3,end) infinite;
  }
  @keyframes authPulse {
    0%,100% { box-shadow: 0 0 20px rgba(232,68,106,0.3); }
    50%      { box-shadow: 0 0 40px rgba(232,68,106,0.6); }
  }
  @keyframes dots {
    0%   { content: '.'; }
    33%  { content: '..'; }
    66%  { content: '...'; }
  }
</style>
</head>
<body>

<!-- Auth Loading Screen -->
<div id="auth-loading">
  <div class="auth-logo-mark">禅</div>
  <p class="auth-loading-text">Checking authentication<span class="auth-loading-dots"></span></p>
</div>

<!-- ══════════════════════════════════════════════════════════
     FIREBASE AUTH GUARD — external file
     Checks auth → redirects if not logged in → fires _nzBootstrap
     which dispatches nz:userReady so nz-pages.js can register routes.
═══════════════════════════════════════════════════════════ -->
<script type="module" src="auth-guard.js"></script>

<!-- ══════════════════════════════════════════════════════════
     APP JS — loaded after auth guard sets up globals
═══════════════════════════════════════════════════════════ -->
<script src="js/core.js" defer></script>
<script src="js/nz-data.js" defer></script>
<script src="js/nz-kana.js" defer></script>
<script src="js/nz-vocab-module.js" defer></script>
<script src="js/pomodoro.js" defer></script>
<script src="js/nz-pages.js" defer></script>

<script defer>
'use strict';

/* Mark that all defer scripts have finished executing */
window._nzReady = true;

/* ── Bootstrap function called by auth guard after user confirmed ── */
window._nzBootstrap = function() {
  /* Safety: if defer scripts haven't finished yet, wait for them */
  if (!window._nzReady || typeof renderShell !== 'function') {
    setTimeout(window._nzBootstrap, 50);
    return;
  }
  // Build shell with real user data
  renderShell();

  // Fire nz:userReady AFTER shell is in DOM — nz-pages.js registers all
  // routes, handles initial navigation and popstate from here.
  document.dispatchEvent(new CustomEvent('nz:userReady', {
    detail: { user: window._nzUser, data: window._nzUserData }
  }));
};
</script>

</body>
</html>
