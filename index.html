        '<p style="font-size:13px;color:var(--fg-muted);margin:0;">Study notes with reminder alarms</p></div>' +
        '<button onclick="nzNoteNew()" class="nz-btn nz-btn-pri">+ New Note</button>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;">' +
        (sorted.length === 0
          ? '<div style="padding:40px;text-align:center;color:var(--fg-muted);font-size:13px;grid-column:1/-1;">No notes yet — create your first one!</div>'
          : sorted.map(function(note) {
              var realIdx = notes.indexOf(note);
              var hasAlarm = note.alarmTime && !note.alarmFired;
              var alarmStr = hasAlarm ? new Date(note.alarmTime).toLocaleString() : '';
              return '<div class="card" style="padding:18px;border:' + (note.pinned?'1px solid var(--accent)':'1px solid var(--border)') + ';">' +
                '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">' +
                  '<span style="font-size:15px;font-weight:700;color:var(--fg);flex:1;margin-right:8px;">' + H(note.title||'Untitled') + '</span>' +
                  '<div style="display:flex;gap:4px;flex-shrink:0;">' +
                    '<button onclick="nzNotePin(' + realIdx + ')" style="background:none;border:none;cursor:pointer;font-size:14px;color:' + (note.pinned?'var(--accent)':'var(--fg-muted)') + ';">📌</button>' +
                    '<button onclick="nzNoteEdit(' + realIdx + ')" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--fg-muted);">✏️</button>' +
                    '<button onclick="nzNoteDelete(' + realIdx + ')" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--fg-subtle);">🗑️</button>' +
                  '</div></div>' +
                '<p style="font-size:13px;color:var(--fg-muted);margin:0 0 10px;line-height:1.5;white-space:pre-wrap;">' + H(note.body||'') + '</p>' +
                (hasAlarm ? '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);font-weight:600;">⏰ ' + alarmStr + '</div>' : '') +
                (note.alarmFired ? '<div style="font-size:11px;color:var(--fg-subtle);">✅ Alarm fired</div>' : '') +
              '</div>';
            }).join('')) +
      '</div></div>'
    );
  }

  function showNoteModal(note, idx) {
    var isEdit = idx !== undefined;
    var ov = document.createElement('div'); ov.className = 'nz-overlay-bg';
    ov.innerHTML =
      '<div class="nz-modal-box" style="max-width:480px;">' +
      '<button onclick="this.closest(\'.nz-overlay-bg\').remove()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:22px;line-height:1;">×</button>' +
      '<h3 style="font-size:16px;font-weight:700;color:var(--fg);margin:0 0 16px;">' + (isEdit?'✏️ Edit Note':'📝 New Note') + '</h3>' +
      goalField('Title','nz-note-title','text','Note title…') +
      '<label style="font-size:12px;color:var(--fg-muted);display:block;margin-bottom:5px;">Content</label>' +
      '<textarea id="nz-note-body" placeholder="Write your notes…" rows="4" ' +
        'style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;box-sizing:border-box;resize:vertical;margin-bottom:12px;outline:none;" ' +
        'onfocus="this.style.borderColor=\'var(--primary)\'" onblur="this.style.borderColor=\'var(--border)\'"></textarea>' +
      '<div style="font-size:12px;font-weight:700;color:var(--fg-muted);margin-bottom:8px;">⏰ Set Reminder</div>' +
      '<input id="nz-note-alarm" type="datetime-local" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;font-family:inherit;box-sizing:border-box;margin-bottom:8px;">' +
      '<div style="font-size:12px;color:var(--fg-muted);margin-bottom:6px;">Or set from now:</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">' +
        ['30m','1h','3h','6h','1d'].map(function(d2){
          return '<button onclick="nzNoteSetDuration(\'' + d2 + '\')" style="padding:5px 11px;border-radius:8px;font-size:11px;font-weight:700;background:var(--card-elevated);border:1px solid var(--border);color:var(--fg-muted);cursor:pointer;font-family:inherit;">+' + d2 + '</button>';
        }).join('') +
      '</div>' +
      '<button onclick="nzNoteSave(' + (isEdit?idx:-1) + ')" class="nz-btn nz-btn-pri" style="width:100%;justify-content:center;">' + (isEdit?'Save Changes':'Create Note') + '</button>' +
      '</div>';
    document.body.appendChild(ov);
    if (isEdit) {
      var ti = document.getElementById('nz-note-title'); if (ti) ti.value = note.title||'';
      var bi = document.getElementById('nz-note-body');  if (bi) bi.value = note.body||'';
    }
  }

  window.nzNoteSetDuration = function(dur) {
    var ms = {'30m':30,'1h':60,'3h':180,'6h':360,'1d':1440}[dur]*60000;
    var dt = new Date(Date.now()+ms);
    var iso = new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);
    var inp = document.getElementById('nz-note-alarm'); if (inp) inp.value = iso;
  };

  window.nzNoteSave = function(idx) {
    var ti = document.getElementById('nz-note-title');
    var bi = document.getElementById('nz-note-body');
    var ai = document.getElementById('nz-note-alarm');
    var noteObj = {
      title: (ti&&ti.value.trim())||'Untitled',
      body:  bi?bi.value:'',
      alarmTime: (ai&&ai.value)?new Date(ai.value).getTime():null,
      alarmFired:false, pinned:false
    };
    if (idx>=0) { noteObj.pinned=notes[idx].pinned||false; notes[idx]=noteObj; }
    else notes.push(noteObj);
    var ov=document.querySelector('.nz-overlay-bg'); if(ov)ov.remove();
    saveAndRender();
  };

  window.nzNoteNew    = function() { showNoteModal({},undefined); };
  window.nzNoteEdit   = function(i) { showNoteModal(notes[i],i); };
  window.nzNoteDelete = function(i) { notes.splice(i,1); saveAndRender(); };
  window.nzNotePin    = function(i) { notes[i].pinned=!notes[i].pinned; saveAndRender(); };

  renderNotes();
};

/* ════════════════════════════════════════════════════════════════
   FEATURE 5 — Community Chat (Firebase Firestore, enhanced)
   Emoji · Voice notes · Image/File share · Reactions · Edit/Delete ·
   Pinned messages · Search · Typing indicator · Online status · Read receipts
════════════════════════════════════════════════════════════════ */
var NZ_EMOJI = ['😀','😂','🥰','😎','🤔','😮','😢','😡','👍','👎','❤️','🔥','🎉','🙏','👏','💪','🌸','🎌','📚','✅'];
var NZ_REACTS = ['👍','❤️','😂','🎉','😮','🙏'];

/* ════════════════════════════════════════════════════════════════
   Community Chat — unified page: merges the old separate "Community"
   (social/follow) and "Study Groups" pages in as tabs alongside Chat,
   so everything lives under one Community Chat section in the nav.
════════════════════════════════════════════════════════════════ */
Pages.chat = function() {
  var mainTab = Pages.chat._initialTab || 'chat';
  Pages.chat._initialTab = null;

  function renderCommunityShell() {
    _nzCommunityMode = false;
    setHTML(
      '<div class="nz-page nz-fadein" style="max-width:900px;">' +
      '<div style="margin-bottom:16px;">' +
        '<h1 style="font-size:22px;font-weight:800;color:var(--fg);margin:0 0 4px;letter-spacing:-.4px;">💬 Community Chat</h1>' +
        '<p style="font-size:13px;color:var(--fg-muted);margin:0;">Chat, connect, and study together with fellow Japanese learners</p>' +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">' +
        [['chat','💬 Chat'],['social','👥 Community'],['groups','🎯 Study Groups'],['dm','✉️ Messages']].map(function(t){
          var act = t[0]===mainTab;
          return '<button onclick="nzCommunityTab(\''+t[0]+'\')" style="padding:8px 16px;border-radius:9px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;' +
            'background:'+(act?'var(--primary)':'var(--card-elevated)')+';color:'+(act?'#fff':'var(--fg-muted)')+';border:1px solid '+(act?'var(--primary)':'var(--border)')+';">'+t[1]+'</button>';
        }).join('') +
      '</div>' +
      '<div id="nz-community-body" class="nz-tabswitch"></div>' +
      '</div>'
    );
  }

  window.nzCommunityTab = function(t) {
    mainTab = t;
    renderCommunityShell();
    activateTab();
  };

  function activateTab() {
    _nzCommunityMode = true;
    if (mainTab === 'social') { Pages.social(); return; }
    if (mainTab === 'groups') { Pages.groups(); return; }
    if (mainTab === 'dm')     { Pages.dm();     return; }
    renderChatTab();
  }

  renderCommunityShell();
  activateTab();
  return;

  /* ── Chat tab (kept as a nested function; only reachable through activateTab) ── */
  function renderChatTab() {
  var ROOMS = [
    {id:'general',label:'General 🌸'},{id:'jlpt',label:'JLPT Prep 📚'},
    {id:'kanji',label:'Kanji Help 漢'},{id:'vocab',label:'Vocab Share 語'},
    {id:'groups',label:'Study Groups 👥'},{id:'offtopic',label:'Off-Topic 💬'}
  ];
  var activeRoom = 'general';
  var _unsub = null, _typingUnsub = null;
  var _lastMsgs = [];
  var _recording = false, _mediaRecorder = null, _audioChunks = [];
  var _typingTimeout = null;

  function fmtTime(m) {
    return m.timestamp && m.timestamp.toDate ? m.timestamp.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : 'now';
  }

  function msgBubble(id, m, own) {
    var ava2 = m.photoURL
      ? '<img src="'+H(m.photoURL)+'" style="width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="">'
      : '<div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#B02050);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;">' + H((m.displayName||'?').charAt(0).toUpperCase()) + '</div>';
    var onlineDot = window.nzIsOnline && window.nzIsOnline(m.uid)
      ? '<span style="width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;margin-left:3px;"></span>' : '';

    var body;
    if (m.deleted) {
      body = '<em style="color:var(--fg-subtle);">message deleted</em>';
    } else if (m.type === 'image') {
      body = '<img src="'+H(m.fileData)+'" style="max-width:220px;border-radius:10px;display:block;" alt="shared image">';
    } else if (m.type === 'file') {
      body = '<a href="'+H(m.fileData)+'" download="'+H(m.fileName||'file')+'" style="color:inherit;text-decoration:underline;font-size:12px;">📎 ' + H(m.fileName||'file') + '</a>';
    } else if (m.type === 'voice') {
      body = '<audio controls style="max-width:200px;height:34px;"><source src="'+H(m.voiceData)+'" type="'+H(m.mime||'audio/webm')+'"></audio>';
    } else {
      body = H(m.text || '') + (m.edited ? ' <span style="font-size:10px;color:var(--fg-subtle);">(edited)</span>' : '');
    }

    var reactions = m.reactions || {};
    var counts = {};
    Object.keys(reactions).forEach(function(uid){ var e = reactions[uid]; counts[e] = (counts[e]||0)+1; });
    var reactRow = Object.keys(counts).length ? (
      '<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;">' +
        Object.keys(counts).map(function(e){
          return '<span style="background:var(--card-elevated);border:1px solid var(--border);border-radius:10px;padding:1px 7px;font-size:11px;">' + e + ' ' + counts[e] + '</span>';
        }).join('') +
      '</div>'
    ) : '';

    var seen = own && m.readBy && m.readBy.length > 1 ? '<span style="font-size:10px;color:var(--primary);">✓✓ seen</span>' : (own ? '<span style="font-size:10px;color:var(--fg-subtle);">✓ sent</span>' : '');

    var actions =
      '<div class="nz-msg-actions" style="display:flex;gap:6px;margin-top:3px;">' +
        '<button onclick="nzChatReact(\''+id+'\')" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--fg-subtle);">😊</button>' +
        '<button onclick="nzChatPin(\''+id+'\','+ (m.pinned?'false':'true') +')" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--fg-subtle);">' + (m.pinned?'📌 unpin':'📌') + '</button>' +
        (own && !m.deleted && m.type !== 'voice' && m.type !== 'image' && m.type !== 'file' ? '<button onclick="nzChatEdit(\''+id+'\')" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--fg-subtle);">✏️</button>' : '') +
        (own && !m.deleted ? '<button onclick="nzChatDelete(\''+id+'\')" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--fg-subtle);">🗑️</button>' : '') +
      '</div>';

    return '<div style="display:flex;align-items:flex-end;gap:7px;flex-direction:' + (own?'row-reverse':'row') + ';" data-msg-id="'+id+'">' +
      ava2 +
      '<div style="max-width:70%;">' +
        '<div style="font-size:10px;color:var(--fg-subtle);margin-bottom:3px;text-align:' + (own?'right':'left') + ';display:flex;align-items:center;' + (own?'justify-content:flex-end;':'') + '">' + H(m.displayName||'Learner') + onlineDot + ' · ' + fmtTime(m) + '</div>' +
        '<div style="padding:9px 13px;border-radius:12px;font-size:13px;' +
          'background:' + (own?'var(--primary)':'var(--card-elevated)') + ';' +
          'color:' + (own?'#fff':'var(--fg)') + ';border:1px solid ' + (own?'transparent':'var(--border)') + ';' +
          'border-bottom-' + (own?'right':'left') + '-radius:3px;line-height:1.45;">' + body + '</div>' +
        reactRow +
        '<div style="display:flex;justify-content:'+(own?'flex-end':'flex-start')+';align-items:center;gap:8px;margin-top:2px;">' + seen + '</div>' +
        actions +
      '</div></div>';
  }

  function renderChat() {
    var u = getU(), d = getUD();
    setHTML(
      '<div class="nz-fadein">' +
      '<div style="margin-bottom:12px;display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;">' +
        '<input id="nz-chat-search" type="text" placeholder="🔍 Search messages…" ' +
          'oninput="nzChatFilter(this.value)" ' +
          'style="padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;font-family:inherit;outline:none;width:180px;">' +
      '</div>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;">' +
        '<div style="width:180px;flex-shrink:0;">' +
          '<div style="font-size:10px;font-weight:700;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-family:var(--font-mono);">Channels</div>' +
          ROOMS.map(function(r){
            var act = r.id===activeRoom;
            return '<button onclick="nzChatRoom(\'' + r.id + '\')" ' +
              'style="width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border:none;margin-bottom:3px;' +
              'background:' + (act?'var(--primary-dim)':'transparent') + ';' +
              'color:' + (act?'var(--primary)':'var(--fg-muted)') + ';' +
              'border-left:2px solid ' + (act?'var(--primary)':'transparent') + ';">' + H(r.label) + '</button>';
          }).join('') +
        '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div id="nz-chat-pinned"></div>' +
          '<div id="nz-chat-msgs" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:6px;">' +
            skeletonLines(5) +
          '</div>' +
          '<div id="nz-chat-typing" style="font-size:11px;color:var(--fg-subtle);min-height:16px;margin-bottom:4px;"></div>' +
          '<div id="nz-emoji-panel" style="display:none;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:6px;">' +
            NZ_EMOJI.map(function(e){ return '<button onclick="nzChatInsertEmoji(\''+e+'\')" style="background:none;border:none;font-size:18px;cursor:pointer;padding:3px;">'+e+'</button>'; }).join('') +
          '</div>' +
          '<div style="display:flex;gap:6px;align-items:center;">' +
            '<button onclick="nzChatToggleEmoji()" title="Emoji" style="background:var(--card-elevated);border:1px solid var(--border);border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:16px;flex-shrink:0;">😊</button>' +
            '<button onclick="nzChatPickFile()" title="Share file/image" style="background:var(--card-elevated);border:1px solid var(--border);border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:16px;flex-shrink:0;">📎</button>' +
            '<button id="nz-chat-mic" onclick="nzChatToggleVoice()" title="Voice message" style="background:var(--card-elevated);border:1px solid var(--border);border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:16px;flex-shrink:0;">🎤</button>' +
            '<input id="nz-chat-file" type="file" accept="image/*,.pdf,.doc,.docx,.txt" style="display:none;" onchange="nzChatFileChosen(this)">' +
            '<input id="nz-chat-inp" type="text" placeholder="Message #' + activeRoom + '…" ' +
              'style="flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;outline:none;" ' +
              'onfocus="this.style.borderColor=\'var(--primary)\'" onblur="this.style.borderColor=\'var(--border)\'" ' +
              'oninput="nzChatTyping()" ' +
              'onkeydown="if(event.key===\'Enter\')nzChatSend()">' +
            '<button onclick="nzChatSend()" class="nz-btn nz-btn-pri">Send ↑</button>' +
          '</div>' +
        '</div>' +
      '</div></div>'
    );
    subscribeRoom(activeRoom);
    subscribeTyping(activeRoom);
  }

  function renderPinnedBanner() {
    var box = $id('nz-chat-pinned'); if (!box) return;
    var pinned = _lastMsgs.filter(function(x){ return x.data.pinned; });
    if (!pinned.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div style="background:var(--primary-dim);border:1px solid var(--primary);border-radius:9px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--fg);">' +
      '📌 <b>Pinned:</b> ' + pinned.slice(0,3).map(function(p){ return H((p.data.text||(p.data.type==='image'?'📷 image':p.data.type==='voice'?'🎤 voice note':p.data.type==='file'?'📎 file':'')||'').slice(0,60)); }).join(' &nbsp;|&nbsp; ') +
    '</div>';
  }

  function subscribeRoom(roomId) {
    if (_unsub) { try{_unsub();}catch(e){} _unsub=null; }
    if (!window._nzDb) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      if (!window._nzFS) window._nzFS = fs;
      var q = fs.query(
        fs.collection(window._nzDb,'chat_rooms',roomId,'messages'),
        fs.orderBy('timestamp','asc'), fs.limit(80)
      );
      _unsub = fs.onSnapshot(q, function(snap){
        var box = $id('nz-chat-msgs'); if(!box) return;
        var me = (window._nzUser&&window._nzUser.uid)||'';
        _lastMsgs = snap.docs.map(function(doc){ return {id:doc.id, data:doc.data()}; });
        renderPinnedBanner();
        if (!_lastMsgs.length) {
          box.innerHTML='<div style="text-align:center;color:var(--fg-muted);font-size:12px;padding:40px;">No messages yet — be the first! 🌸</div>';
          return;
        }
        box.innerHTML = _lastMsgs.map(function(x){ return msgBubble(x.id, x.data, x.data.uid===me); }).join('');
        box.scrollTop=box.scrollHeight;

        // read receipts: mark unread messages (not mine) as read by me
        _lastMsgs.forEach(function(x){
          if (x.data.uid!==me && (!x.data.readBy || x.data.readBy.indexOf(me)===-1)) {
            var ref = fs.doc(window._nzDb,'chat_rooms',roomId,'messages',x.id);
            fs.updateDoc(ref, { readBy: fs.arrayUnion(me) }).catch(function(){});
          }
        });
      });
    });
  }

  function subscribeTyping(roomId) {
    if (_typingUnsub) { try{_typingUnsub();}catch(e){} _typingUnsub=null; }
    if (!window._nzDb) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var me = (window._nzUser&&window._nzUser.uid)||'';
      _typingUnsub = fs.onSnapshot(fs.collection(window._nzDb,'chat_rooms',roomId,'typing'), function(snap){
        var names = [];
        var now = Date.now();
        snap.forEach(function(d){
          var v = d.data();
          if (d.id!==me && v.typing && v.ts && (now - v.ts) < 6000) names.push(v.name||'Someone');
        });
        var el = $id('nz-chat-typing');
        if (el) el.textContent = names.length ? (names.join(', ') + (names.length>1?' are':' is') + ' typing…') : '';
      });
    });
  }

  window.nzChatFilter = function(term) {
    var box = $id('nz-chat-msgs'); if (!box) return;
    var t = term.trim().toLowerCase();
    var me = (window._nzUser&&window._nzUser.uid)||'';
    var filtered = !t ? _lastMsgs : _lastMsgs.filter(function(x){ return (x.data.text||'').toLowerCase().indexOf(t) !== -1; });
    box.innerHTML = filtered.length
      ? filtered.map(function(x){ return msgBubble(x.id, x.data, x.data.uid===me); }).join('')
      : '<div style="text-align:center;color:var(--fg-muted);font-size:12px;padding:30px;">No messages match “' + H(term) + '”</div>';
  };

  window.nzChatRoom = function(id){ activeRoom=id; renderChat(); };

  window.nzChatToggleEmoji = function() {
    var p = $id('nz-emoji-panel'); if (!p) return;
    p.style.display = (p.style.display === 'none' || !p.style.display) ? 'flex' : 'none';
  };
  window.nzChatInsertEmoji = function(e) {
    var inp = $id('nz-chat-inp'); if (!inp) return;
    inp.value += e; inp.focus();
  };

  window.nzChatTyping = function() {
    if (!window._nzDb || !window._nzUser) return;
    var d = getUD(), u = getU();
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var ref = fs.doc(window._nzDb,'chat_rooms',activeRoom,'typing',u.uid);
      fs.setDoc(ref, { typing:true, ts:Date.now(), name:d.displayName||u.displayName||'Learner' });
      clearTimeout(_typingTimeout);
      _typingTimeout = setTimeout(function(){ fs.setDoc(ref, {typing:false, ts:Date.now()}); }, 3000);
    });
  };

  window.nzChatPickFile = function() { var f = $id('nz-chat-file'); if (f) f.click(); };
  window.nzChatFileChosen = function(input) {
    var file = input.files && input.files[0]; if (!file) return;
    if (file.size > 700*1024) { nzShowToast('File too large — please keep under 700KB'); input.value=''; return; }
    var reader = new FileReader();
    reader.onload = function() {
      var isImg = file.type.indexOf('image/') === 0;
      sendMsg({ type: isImg?'image':'file', fileData: reader.result, fileName: file.name });
      input.value = '';
    };
    reader.readAsDataURL(file);
  };

  window.nzChatToggleVoice = function() {
    var btn = $id('nz-chat-mic');
    if (!_recording) {
      if (!navigator.mediaDevices || !window.MediaRecorder) { nzShowToast('Voice messages not supported on this device'); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        _audioChunks = [];
        _mediaRecorder = new MediaRecorder(stream);
        _mediaRecorder.ondataavailable = function(e) { if (e.data.size>0) _audioChunks.push(e.data); };
        _mediaRecorder.onstop = function() {
          stream.getTracks().forEach(function(t){ t.stop(); });
          var blob = new Blob(_audioChunks, { type: 'audio/webm' });
          if (blob.size > 700*1024) { nzShowToast('Voice note too long — keep it under ~30s'); return; }
          var reader = new FileReader();
          reader.onload = function() { sendMsg({ type:'voice', voiceData: reader.result, mime:'audio/webm' }); };
          reader.readAsDataURL(blob);
        };
        _mediaRecorder.start();
        _recording = true;
        if (btn) { btn.textContent = '⏹️'; btn.style.background = 'var(--primary)'; btn.style.color = '#fff'; }
        setTimeout(function(){ if (_recording) window.nzChatToggleVoice(); }, 30000); // auto-stop at 30s
      }).catch(function(){ nzShowToast('Microphone permission denied'); });
    } else {
      _recording = false;
      if (_mediaRecorder && _mediaRecorder.state !== 'inactive') _mediaRecorder.stop();
      if (btn) { btn.textContent = '🎤'; btn.style.background = 'var(--card-elevated)'; btn.style.color = ''; }
    }
  };

  function sendMsg(extra) {
    if (!window._nzDb || !window._nzUser) return;
    var u2=window._nzUser, d2=getUD();
    var base = { uid:u2.uid, displayName:d2.displayName||u2.displayName||'Learner',
      photoURL:d2.photoURL||u2.photoURL||'', readBy:[u2.uid], reactions:{}, pinned:false, edited:false, deleted:false };
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.addDoc(fs.collection(window._nzDb,'chat_rooms',activeRoom,'messages'), Object.assign(base, extra, { timestamp: fs.serverTimestamp() }));
    });
  }

  window.nzChatSend = function(){
    var inp=$id('nz-chat-inp'); if(!inp||!inp.value.trim()) return;
    var text=inp.value.trim(); inp.value='';
    sendMsg({ type:'text', text: text });
  };

  window.nzChatReact = function(msgId) {
    var existing = document.getElementById('nz-react-pop-'+msgId);
    if (existing) { existing.remove(); return; }
    document.querySelectorAll('.nz-react-pop').forEach(function(x){x.remove();});
    var el = document.querySelector('[data-msg-id="'+msgId+'"]'); if (!el) return;
    var pop = document.createElement('div');
    pop.className = 'nz-react-pop'; pop.id = 'nz-react-pop-'+msgId;
    pop.style.cssText = 'display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 8px;margin-top:4px;box-shadow:var(--shadow-md);width:fit-content;';
    pop.innerHTML = NZ_REACTS.map(function(e){ return '<button onclick="nzChatDoReact(\''+msgId+'\',\''+e+'\')" style="background:none;border:none;font-size:16px;cursor:pointer;">'+e+'</button>'; }).join('');
    el.appendChild(pop);
  };
  window.nzChatDoReact = function(msgId, emoji) {
    if (!window._nzDb || !window._nzUser) return;
    var uid = window._nzUser.uid;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var ref = fs.doc(window._nzDb,'chat_rooms',activeRoom,'messages',msgId);
      var field = {}; field['reactions.'+uid] = emoji;
      fs.updateDoc(ref, field);
    });
    var pop = document.getElementById('nz-react-pop-'+msgId); if (pop) pop.remove();
  };

  window.nzChatPin = function(msgId, val) {
    if (!window._nzDb) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'chat_rooms',activeRoom,'messages',msgId), { pinned: (val==='true'||val===true) });
    });
  };

  window.nzChatEdit = function(msgId) {
    var msg = _lastMsgs.find(function(x){ return x.id===msgId; }); if (!msg) return;
    var nv = prompt('Edit message:', msg.data.text || '');
    if (nv === null) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'chat_rooms',activeRoom,'messages',msgId), { text: nv.trim(), edited:true });
    });
  };

  window.nzChatDelete = function(msgId) {
    if (!confirm('Delete this message?')) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'chat_rooms',activeRoom,'messages',msgId), { deleted:true, text:'', fileData:'', voiceData:'' });
    });
  };

  renderChat();
  } /* end renderChatTab */
}; /* end Pages.chat */

window.nzLogActivity = function(text, emoji) {

    });

Pages.social = function() {
  var tab = 'discover';
  var searchResults = [], myFollowing = [], incomingRequests = [], activity = [];

  function loadAll(cb) {
    if (!window._nzDb || !window._nzUser) { cb(); return; }
    var me = window._nzUser.uid;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      if (!window._nzFS) window._nzFS = fs;
      Promise.all([
        fs.getDocs(fs.query(fs.collection(window._nzDb,'follows'), fs.where('followerUid','==',me))),
        fs.getDocs(fs.query(fs.collection(window._nzDb,'friend_requests'), fs.where('toUid','==',me), fs.where('status','==','pending'))),
        fs.getDocs(fs.query(fs.collection(window._nzDb,'activity'), fs.orderBy('createdAt','desc'), fs.limit(25)))
      ]).then(function(res){
        myFollowing = res[0].docs.map(function(d){ return d.data().followingUid; });
        incomingRequests = res[1].docs.map(function(d){ return {id:d.id, data:d.data()}; });
        activity = res[2].docs.map(function(d){ return d.data(); });
        cb();
      }).catch(function(){ cb(); });
    });
  }

  function renderSocial() {
    setHTML(
      '<div class="nz-fadein">' +
      '<p style="font-size:13px;color:var(--fg-muted);margin:0 0 14px;">Find friends, follow their progress, and stay in the loop</p>' +
      '<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">' +
        ['discover','requests','activity'].map(function(t){
          var act = t===tab;
          var label = t==='discover'?'🔍 Discover':t==='requests'?'📥 Requests'+(incomingRequests.length?(' ('+incomingRequests.length+')'):''):'📰 Activity';
          return '<button onclick="nzSocialTab(\''+t+'\')" style="padding:8px 16px;border-radius:9px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;' +
            'background:'+(act?'var(--primary)':'var(--card-elevated)')+';color:'+(act?'#fff':'var(--fg-muted)')+';border:1px solid '+(act?'var(--primary)':'var(--border)')+';">'+label+'</button>';
        }).join('') +
      '</div>' +
      '<div id="nz-social-body"></div>' +
      '</div>'
    );
    renderTab();
  }

  function userRow(uDoc) {
    var u = uDoc.data, uid = uDoc.id, me = (window._nzUser&&window._nzUser.uid)||'';
    if (uid === me) return '';
    var isFollowing = myFollowing.indexOf(uid) !== -1;
    var online = window.nzIsOnline && window.nzIsOnline(uid);
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);">' +
      (u.photoURL ? '<img src="'+H(u.photoURL)+'" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">' :
        '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#B02050);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">'+H((u.displayName||'?').charAt(0).toUpperCase())+'</div>') +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-size:13px;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:5px;">'+H(u.displayName||'Learner')+(online?'<span style="width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;"></span>':'')+'</div>' +
        '<div style="font-size:11px;color:var(--fg-muted);">'+(u.streak?('🔥 '+u.streak+' day streak'):'')+(u.badges&&u.badges.length?('  🏅 '+u.badges.length+' badges'):'')+'</div>' +
      '</div>' +
      '<button onclick="nzOpenDM(\''+uid+'\',\''+H(u.displayName||'Learner').replace(/'/g,"&#39;")+'\',\''+H(u.photoURL||'')+'\')" class="nz-btn nz-btn-ghost" style="font-size:11px;padding:6px 10px;" title="Message">✉️</button>' +
      (isFollowing ?
        '<button onclick="nzUnfollow(\''+uid+'\')" class="nz-btn nz-btn-ghost" style="font-size:11px;padding:6px 12px;">Following ✓</button>' :
        '<button onclick="nzSendFriendRequest(\''+uid+'\',\''+H(u.displayName||'Learner').replace(/'/g,"&#39;")+'\',\''+H(u.photoURL||'')+'\')" class="nz-btn nz-btn-pri" style="font-size:11px;padding:6px 12px;">+ Follow</button>') +
    '</div>';
  }

  function renderTab() {
    var box = $id('nz-social-body'); if (!box) return;
    if (tab === 'discover') {
      box.innerHTML =
        '<input id="nz-social-search" type="text" placeholder="Search learners by name…" ' +
          'oninput="nzSocialSearch(this.value)" ' +
          'style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:12px;">' +
        '<div id="nz-social-results" class="card" style="padding:0;overflow:hidden;">' +
          '<div style="padding:16px;text-align:center;color:var(--fg-muted);font-size:12px;">Type a name to search for other learners</div>' +
        '</div>';
    } else if (tab === 'requests') {
      box.innerHTML = '<div class="card" style="padding:0;overflow:hidden;">' +
        (incomingRequests.length ? incomingRequests.map(function(r){
          return '<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);">' +
            (r.data.fromPhoto ? '<img src="'+H(r.data.fromPhoto)+'" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">' : '<div style="width:36px;height:36px;border-radius:50%;background:var(--primary-dim);display:flex;align-items:center;justify-content:center;">👤</div>') +
            '<div style="flex:1;font-size:13px;color:var(--fg);font-weight:600;">'+H(r.data.fromName||'Someone')+' wants to follow you</div>' +
            '<button onclick="nzRespondRequest(\''+r.id+'\',true,\''+r.data.fromUid+'\')" class="nz-btn nz-btn-pri" style="font-size:11px;padding:6px 10px;">Accept</button>' +
            '<button onclick="nzRespondRequest(\''+r.id+'\',false,\''+r.data.fromUid+'\')" class="nz-btn nz-btn-ghost" style="font-size:11px;padding:6px 10px;">Decline</button>' +
          '</div>';
        }).join('') : '<div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:12px;">No pending requests</div>') +
      '</div>';
    } else if (tab === 'activity') {
      box.innerHTML = '<div class="card" style="padding:0;overflow:hidden;">' +
        (activity.length ? activity.map(function(a){
          var ts = a.createdAt&&a.createdAt.toDate ? a.createdAt.toDate().toLocaleDateString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
          return '<div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);">' +
            (a.photoURL ? '<img src="'+H(a.photoURL)+'" alt="" style="width:30px;height:30px;border-radius:50%;object-fit:cover;">' : '<div style="width:30px;height:30px;border-radius:50%;background:var(--primary-dim);"></div>') +
            '<div style="flex:1;font-size:12px;color:var(--fg);"><b>'+H(a.displayName||'Someone')+'</b> '+H(a.text||'')+'</div>' +
            '<div style="font-size:10px;color:var(--fg-subtle);">'+ts+'</div>' +
          '</div>';
        }).join('') : '<div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:12px;">No recent activity yet</div>') +
      '</div>';
    }
  }

  window.nzSocialTab = function(t) { tab = t; renderTab(); };

  window.nzSocialSearch = function(term) {
    var box = $id('nz-social-results'); if (!box) return;
    var t = term.trim();
    if (!t) { box.innerHTML = '<div style="padding:16px;text-align:center;color:var(--fg-muted);font-size:12px;">Type a name to search for other learners</div>'; return; }
    if (!window._nzDb) return;
    box.innerHTML = '<div style="padding:16px;text-align:center;color:var(--fg-muted);font-size:12px;">Searching…</div>';
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var q = fs.query(fs.collection(window._nzDb,'users'),
        fs.orderBy('displayName'), fs.startAt(t), fs.endAt(t+'\uf8ff'), fs.limit(20));
      fs.getDocs(q).then(function(snap){
        if (snap.empty) { box.innerHTML = '<div style="padding:16px;text-align:center;color:var(--fg-muted);font-size:12px;">No learners found</div>'; return; }
        box.innerHTML = snap.docs.map(function(d){ return userRow({id:d.id, data:d.data()}); }).join('');
      }).catch(function(){ box.innerHTML = '<div style="padding:16px;text-align:center;color:var(--fg-muted);font-size:12px;">Search unavailable right now</div>'; });
    });
  };

  window.nzSendFriendRequest = function(toUid, toName, toPhoto) {
    if (!window._nzDb || !window._nzUser) return;
    var u = getU(), d = getUD();
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.addDoc(fs.collection(window._nzDb,'friend_requests'), {
        fromUid:u.uid, fromName:d.displayName||u.displayName||'Learner', fromPhoto:d.photoURL||u.photoURL||'',
        toUid:toUid, status:'pending', createdAt: fs.serverTimestamp()
      });
      window.nzPushNotifTo(toUid, 'social', '👋 New Follow Request', (d.displayName||u.displayName||'Someone')+' wants to follow you');
      nzShowToast('Follow request sent to '+toName);
    });
  };

  window.nzRespondRequest = function(reqId, accept, fromUid) {
    if (!window._nzDb || !window._nzUser) return;
    var me = window._nzUser.uid, d = getUD(), u = getU();
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'friend_requests',reqId), { status: accept?'accepted':'declined' });
      if (accept) {
        fs.setDoc(fs.doc(window._nzDb,'follows', fromUid+'_'+me), { followerUid:fromUid, followingUid:me, createdAt: fs.serverTimestamp() });
        fs.setDoc(fs.doc(window._nzDb,'follows', me+'_'+fromUid), { followerUid:me, followingUid:fromUid, createdAt: fs.serverTimestamp() });
        window.nzPushNotifTo(fromUid, 'social', '🎉 Request Accepted', (d.displayName||u.displayName||'Someone')+' accepted your follow request');
      }
      incomingRequests = incomingRequests.filter(function(r){ return r.id!==reqId; });
      renderTab();
    });
  };

  window.nzUnfollow = function(uid) {
    if (!window._nzDb || !window._nzUser) return;
    var me = window._nzUser.uid;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.deleteDoc(fs.doc(window._nzDb,'follows', me+'_'+uid));
      myFollowing = myFollowing.filter(function(x){ return x!==uid; });
      renderTab();
    });
  };

  loadAll(renderSocial);
};

            '</div>' +
          '</div>' +
          '<div class="card" style="padding:14px;">' +
            '<div style="font-size:11px;color:var(--fg-muted);font-weight:700;margin-bottom:8px;">📊 Quick Poll</div>' +
            '<button onclick="nzGroupPollModal()" class="nz-btn nz-btn-ghost" style="width:100%;justify-content:center;font-size:11px;">+ Create Poll</button>' +
            '<div id="nz-group-polls" style="margin-top:8px;"></div>' +
          '</div>' +
        '</div>' +
      '</div></div>'
    );
    subscribeGroupMsgs();
    subscribeGroupDoc();
    loadPolls();
  }

  /* ── Member list + admin controls (owner can remove members, everyone can invite/leave) ── */
  window.nzGroupToggleMembers = function() {
    var panel = $id('nz-group-members-panel'); if (!panel) return;
    if (panel.style.display === 'none') { panel.style.display='block'; renderMembersPanel(); }
    else { panel.style.display = 'none'; }
  };

  function renderMembersPanel() {
    var panel = $id('nz-group-members-panel'); if (!panel) return;
    var g = myGroups.find(function(x){ return x.id===activeGroup; }); if (!g) return;
    var me = (window._nzUser&&window._nzUser.uid)||'';
    var isOwner = g.data.ownerUid === me;
    var members = g.data.members || [], names = g.data.memberNames || [];
    panel.innerHTML = '<div class="card" style="padding:0;overflow:hidden;">' +
      '<div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">' +
        '<span style="font-size:11px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em;">Members ('+members.length+')</span>' +
        '<button onclick="nzGroupInviteModal()" class="nz-btn nz-btn-pri" style="font-size:11px;padding:5px 10px;">+ Invite</button>' +
      '</div>' +
      members.map(function(uid, i){
        var isOwnerRow = uid === g.data.ownerUid;
        var online = window.nzIsOnline && window.nzIsOnline(uid);
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);">' +
          '<div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#B02050);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0;">'+H((names[i]||'?').charAt(0).toUpperCase())+'</div>' +
          '<div style="flex:1;min-width:0;font-size:12px;color:var(--fg);display:flex;align-items:center;gap:5px;">'+H(names[i]||'Learner')+
            (online?'<span style="width:6px;height:6px;border-radius:50%;background:#22c55e;"></span>':'')+
            (isOwnerRow?' <span style="font-size:9px;color:var(--primary);font-weight:800;">★ ADMIN</span>':'')+
          '</div>' +
          (isOwner && !isOwnerRow ? '<button onclick="nzGroupRemoveMember(\''+uid+'\')" class="nz-btn nz-btn-ghost" style="font-size:10px;padding:4px 8px;">Remove</button>' : '') +
        '</div>';
      }).join('') +
      (isOwner ? '<div style="padding:10px 14px;"><button onclick="nzGroupDelete()" class="nz-btn nz-btn-ghost" style="width:100%;justify-content:center;font-size:11px;color:var(--danger,#e5484d);">🗑 Delete Group</button></div>'
               : '<div style="padding:10px 14px;"><button onclick="nzGroupLeave()" class="nz-btn nz-btn-ghost" style="width:100%;justify-content:center;font-size:11px;">🚪 Leave Group</button></div>') +
    '</div>';
  }

  window.nzGroupInviteModal = function() {
    var ov = document.createElement('div'); ov.className = 'nz-overlay-bg';
    ov.innerHTML = '<div class="nz-modal-box">' +
      '<button onclick="this.closest(\'.nz-overlay-bg\').remove()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:22px;line-height:1;">×</button>' +
      '<h3 style="font-size:16px;font-weight:700;color:var(--fg);margin:0 0 14px;">+ Invite to Group</h3>' +
      '<input id="nz-ginvite-search" type="text" placeholder="Search learners by name…" oninput="nzGroupInviteSearch(this.value)" ' +
        'style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:10px;">' +
      '<div id="nz-ginvite-results" style="max-height:260px;overflow-y:auto;"></div></div>';
    document.body.appendChild(ov);
  };

  window.nzGroupInviteSearch = function(term) {
    var box = $id('nz-ginvite-results'); if (!box) return;
    var t = term.trim();
    var g = myGroups.find(function(x){ return x.id===activeGroup; });
    if (!t) { box.innerHTML = ''; return; }
    box.innerHTML = '<div style="padding:10px;text-align:center;color:var(--fg-muted);font-size:12px;">Searching…</div>';
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var q = fs.query(fs.collection(window._nzDb,'users'), fs.orderBy('displayName'), fs.startAt(t), fs.endAt(t+'\uf8ff'), fs.limit(15));
      fs.getDocs(q).then(function(snap){
        var rows = snap.docs.filter(function(d){ return g && g.data.members.indexOf(d.id) === -1; });
        if (!rows.length) { box.innerHTML = '<div style="padding:10px;text-align:center;color:var(--fg-muted);font-size:12px;">No matching learners</div>'; return; }
        box.innerHTML = rows.map(function(d){
          var u = d.data();
          return '<div style="display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--border);">' +
            '<div style="flex:1;font-size:12px;color:var(--fg);">'+H(u.displayName||'Learner')+'</div>' +
            '<button onclick="nzGroupAddMember(\''+d.id+'\',\''+H(u.displayName||'Learner').replace(/'/g,"&#39;")+'\')" class="nz-btn nz-btn-pri" style="font-size:10px;padding:4px 10px;">Add</button>' +
          '</div>';
        }).join('');
      }).catch(function(){ box.innerHTML = '<div style="padding:10px;text-align:center;color:var(--fg-muted);font-size:12px;">Search unavailable</div>'; });
    });
  };

  window.nzGroupAddMember = function(uid, name) {
    var g = myGroups.find(function(x){ return x.id===activeGroup; }); if (!g) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'groups',activeGroup), {
        members: fs.arrayUnion(uid), memberNames: fs.arrayUnion(name)
      }).then(function(){
        window.nzPushNotifTo(uid, 'social', '👥 Added to a Study Group', 'You were added to "'+g.data.name+'"');
        nzShowToast('Added '+name+' to the group');
        var ov = document.querySelector('.nz-overlay-bg'); if (ov) ov.remove();
        loadGroups(function(){ renderGroupDetail(); document.getElementById('nz-group-members-panel').style.display='block'; renderMembersPanel(); });
      });
    });
  };

  window.nzGroupRemoveMember = function(uid) {
    if (!confirm('Remove this member from the group?')) return;
    var g = myGroups.find(function(x){ return x.id===activeGroup; }); if (!g) return;
    var idx = g.data.members.indexOf(uid);
    var name = idx !== -1 ? (g.data.memberNames||[])[idx] : null;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'groups',activeGroup), {
        members: fs.arrayRemove(uid), memberNames: name ? fs.arrayRemove(name) : fs.arrayRemove()
      }).then(function(){ loadGroups(function(){ renderGroupDetail(); document.getElementById('nz-group-members-panel').style.display='block'; renderMembersPanel(); }); });
    });
  };

  window.nzGroupLeave = function() {
    if (!confirm('Leave this group?')) return;
    var me = (window._nzUser&&window._nzUser.uid)||'';
    var g = myGroups.find(function(x){ return x.id===activeGroup; }); if (!g) return;
    var idx = g.data.members.indexOf(me);
    var name = idx !== -1 ? (g.data.memberNames||[])[idx] : null;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'groups',activeGroup), {
        members: fs.arrayRemove(me), memberNames: name ? fs.arrayRemove(name) : fs.arrayRemove()
      }).then(function(){ nzGroupBack(); });
    });
  };

  window.nzGroupDelete = function() {
    if (!confirm('Delete this group permanently? This cannot be undone.')) return;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.deleteDoc(fs.doc(window._nzDb,'groups',activeGroup)).then(function(){ nzGroupBack(); });
    });
  };

  function subscribeGroupMsgs() {
    if (_msgUnsub) { try{_msgUnsub();}catch(e){} }
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var q = fs.query(fs.collection(window._nzDb,'groups',activeGroup,'messages'), fs.orderBy('timestamp','asc'), fs.limit(60));
      _msgUnsub = fs.onSnapshot(q, function(snap){
        var box = $id('nz-group-msgs'); if (!box) return;
        var me = (window._nzUser&&window._nzUser.uid)||'';
        if (snap.empty) { box.innerHTML = '<div style="text-align:center;color:var(--fg-muted);font-size:12px;padding:30px;">Say hi to your group! 👋</div>'; return; }
        box.innerHTML = snap.docs.map(function(doc){
          var m = doc.data(), own = m.uid===me;
          return '<div style="display:flex;flex-direction:'+(own?'row-reverse':'row')+';gap:6px;">' +
            '<div style="max-width:75%;">' +
              '<div style="font-size:10px;color:var(--fg-subtle);text-align:'+(own?'right':'left')+';">'+H(m.displayName||'Learner')+'</div>' +
              '<div style="padding:8px 12px;border-radius:11px;font-size:13px;background:'+(own?'var(--primary)':'var(--card-elevated)')+';color:'+(own?'#fff':'var(--fg)')+';">'+H(m.text||'')+'</div>' +
            '</div></div>';
        }).join('');
        box.scrollTop = box.scrollHeight;
      });
    });
  }

  window.nzGroupSend = function() {
    var inp = $id('nz-group-inp'); if (!inp || !inp.value.trim()) return;
    var text = inp.value.trim(); inp.value='';
    var u = getU(), d = getUD();
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.addDoc(fs.collection(window._nzDb,'groups',activeGroup,'messages'), {
        text:text, uid:u.uid, displayName:d.displayName||u.displayName||'Learner', timestamp: fs.serverTimestamp()
      });
    });
  };

  function subscribeGroupDoc() {
    if (_groupUnsub) { try{_groupUnsub();}catch(e){} }
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      _groupUnsub = fs.onSnapshot(fs.doc(window._nzDb,'groups',activeGroup), function(doc){
        var data = doc.data(); if (!data) return;
        if (_tickInterval) clearInterval(_tickInterval);
        var disp = $id('nz-group-timer-disp');
        function tick() {
          if (!data.timerEnd) { if (disp) disp.textContent = '--:--'; return; }
          var remain = Math.max(0, Math.round((data.timerEnd - Date.now())/1000));
          if (disp) disp.textContent = String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0');
          if (remain<=0 && disp) disp.textContent = 'Done! ✅';
        }
        tick();
        _tickInterval = setInterval(tick, 1000);
      });
    });
  }

  window.nzGroupStartTimer = function(mins) {
    var end = Date.now() + mins*60000;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.updateDoc(fs.doc(window._nzDb,'groups',activeGroup), { timerEnd: end });
      nzShowToast('Group timer started — '+mins+' min for everyone!');
    });
  };

  function loadPolls() {
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.onSnapshot(fs.query(fs.collection(window._nzDb,'groups',activeGroup,'polls'), fs.orderBy('createdAt','desc'), fs.limit(5)), function(snap){
        var box = $id('nz-group-polls'); if (!box) return;
        var me = (window._nzUser&&window._nzUser.uid)||'';
        box.innerHTML = snap.docs.map(function(doc){
          var p = doc.data(), votes = p.votes||{};
          var total = Object.keys(votes).length || 1;
          var counts = (p.options||[]).map(function(_,i){ return Object.values(votes).filter(function(v){return v===i;}).length; });
          return '<div style="background:var(--card-elevated);border-radius:8px;padding:8px;margin-bottom:6px;">' +
            '<div style="font-size:11px;font-weight:700;color:var(--fg);margin-bottom:5px;">'+H(p.question)+'</div>' +
            (p.options||[]).map(function(opt,i){
              var pct = Math.round((counts[i]/total)*100);
              return '<div role="button" tabindex="0" onclick="nzGroupVote(\''+doc.id+'\','+i+')" style="cursor:pointer;font-size:10px;color:var(--fg-muted);margin-bottom:3px;position:relative;">' +
                '<div style="background:var(--primary-dim);width:'+pct+'%;height:16px;border-radius:4px;position:absolute;left:0;top:0;"></div>' +
                '<span style="position:relative;padding-left:4px;">'+H(opt)+' — '+pct+'%'+(votes[me]===i?' ✓':'')+'</span>' +
              '</div>';
            }).join('') +
          '</div>';
        }).join('') || '<div style="font-size:11px;color:var(--fg-subtle);">No polls yet</div>';
      });
    });
  }

  window.nzGroupPollModal = function() {
    var ov = document.createElement('div'); ov.className = 'nz-overlay-bg';
    ov.innerHTML = '<div class="nz-modal-box">' +
      '<button onclick="this.closest(\'.nz-overlay-bg\').remove()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:22px;">×</button>' +
      '<h3 style="font-size:15px;font-weight:700;color:var(--fg);margin:0 0 14px;">📊 New Poll</h3>' +
      '<input id="nz-poll-q" type="text" placeholder="Question" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;box-sizing:border-box;margin-bottom:8px;">' +
      '<input id="nz-poll-o1" type="text" placeholder="Option 1" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;box-sizing:border-box;margin-bottom:8px;">' +
      '<input id="nz-poll-o2" type="text" placeholder="Option 2" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;box-sizing:border-box;margin-bottom:12px;">' +
      '<button onclick="nzGroupPollCreate()" class="nz-btn nz-btn-pri" style="width:100%;justify-content:center;">Create Poll</button></div>';
    document.body.appendChild(ov);
  };

  window.nzGroupPollCreate = function() {
    var q = $id('nz-poll-q'), o1 = $id('nz-poll-o1'), o2 = $id('nz-poll-o2');
    if (!q || !q.value.trim() || !o1.value.trim() || !o2.value.trim()) return;
    var u = getU();
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.addDoc(fs.collection(window._nzDb,'groups',activeGroup,'polls'), {
        question:q.value.trim(), options:[o1.value.trim(), o2.value.trim()], votes:{}, createdBy:u.uid, createdAt: fs.serverTimestamp()
      });
      var ov = document.querySelector('.nz-overlay-bg'); if (ov) ov.remove();
    });
  };

  window.nzGroupVote = function(pollId, optIdx) {
    var u = getU();
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var field = {}; field['votes.'+u.uid] = optIdx;
      fs.updateDoc(fs.doc(window._nzDb,'groups',activeGroup,'polls',pollId), field);
    });
  };

  loadGroups(renderList);
};

/* ════════════════════════════════════════════════════════════════
   Direct Messages — 1:1 private chat between two users
   (rendered as the "Messages" tab inside Pages.chat)
════════════════════════════════════════════════════════════════ */
window.nzDmConvId = function(uidA, uidB) { return [uidA, uidB].sort().join('_'); };

/* Called from anywhere (e.g. Community user row) to jump straight into a DM. */
window.nzOpenDM = function(uid, name, photo) {
  Pages.chat._initialTab = 'dm';
  Pages.chat();
  setTimeout(function(){ if (window._nzDmOpenThread) window._nzDmOpenThread(uid, name, photo); }, 60);
};

Pages.dm = function() {
  var convos = [], activeConvo = null, activeName = '', activePhoto = '';
  var _dmMsgUnsub = null, _dmListUnsub = null;

  function loadConvos(cb) {
    if (!window._nzDb || !window._nzUser) { cb(); return; }
    var me = window._nzUser.uid;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      if (!window._nzFS) window._nzFS = fs;
      if (_dmListUnsub) { try{_dmListUnsub();}catch(e){} }
      var q = fs.query(fs.collection(window._nzDb,'dms'), fs.where('participants','array-contains',me));
      _dmListUnsub = fs.onSnapshot(q, function(snap){
        convos = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; })
          .sort(function(a,b){
            var ta = a.data.lastTimestamp && a.data.lastTimestamp.toMillis ? a.data.lastTimestamp.toMillis() : 0;
            var tb = b.data.lastTimestamp && b.data.lastTimestamp.toMillis ? b.data.lastTimestamp.toMillis() : 0;
            return tb - ta;
          });
        if (!activeConvo) renderList(); else renderConvoListSidebar();
      });
      cb();
    });
  }

  function otherParty(c) {
    var me = window._nzUser.uid;
    var uid = (c.data.participants||[]).filter(function(x){return x!==me;})[0] || '';
    var names = c.data.participantNames || {};
    var photos = c.data.participantPhotos || {};
    return { uid: uid, name: names[uid] || 'Learner', photo: photos[uid] || '' };
  }

  function renderList() {
    setHTML(
      '<div class="nz-fadein">' +
      '<p style="font-size:13px;color:var(--fg-muted);margin:0 0 14px;">Private conversations with fellow learners</p>' +
      '<div id="nz-dm-list" class="card" style="padding:0;overflow:hidden;">' +
        (convos.length ? '' : '<div style="padding:30px;text-align:center;color:var(--fg-muted);font-size:12px;">No messages yet — follow someone in Community and say hi 👋</div>') +
      '</div></div>'
    );
    renderConvoListSidebar();
  }

  function renderConvoListSidebar() {
    var box = $id('nz-dm-list'); if (!box || !convos.length) return;
    box.innerHTML = convos.map(function(c){
      var op = otherParty(c);
      var online = window.nzIsOnline && window.nzIsOnline(op.uid);
      var unread = c.data.lastSenderUid && c.data.lastSenderUid !== window._nzUser.uid && c.data.lastReadBy && c.data.lastReadBy.indexOf(window._nzUser.uid) === -1;
      return '<div role="button" tabindex="0" onclick="nzDmOpenFromList(\''+op.uid+'\',\''+H(op.name).replace(/'/g,"&#39;")+'\',\''+H(op.photo)+'\')" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;">' +
        (op.photo ? '<img src="'+H(op.photo)+'" alt="" style="width:38px;height:38px;border-radius:50%;object-fit:cover;">' :
          '<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#B02050);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">'+H(op.name.charAt(0).toUpperCase())+'</div>') +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:13px;font-weight:700;color:var(--fg);display:flex;align-items:center;gap:5px;">'+H(op.name)+(online?'<span style="width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;"></span>':'')+'</div>' +
          '<div style="font-size:11px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+H(c.data.lastMessage||'Say hi 👋')+'</div>' +
        '</div>' +
        (unread ? '<span style="width:9px;height:9px;border-radius:50%;background:var(--primary);flex-shrink:0;"></span>' : '') +
      '</div>';
    }).join('');
  }

  window.nzDmOpenFromList = function(uid, name, photo) { openThread(uid, name, photo); };
  window._nzDmOpenThread = function(uid, name, photo) { openThread(uid, name, photo); };

  function openThread(uid, name, photo) {
    var me = window._nzUser.uid;
    activeConvo = window.nzDmConvId(me, uid); activeName = name; activePhoto = photo;
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var d = getUD(), u = getU();
      var upd = { participants: [me, uid] };
      upd['participantNames.'+me] = d.displayName || u.displayName || 'Learner';
      upd['participantNames.'+uid] = name;
      upd['participantPhotos.'+me] = d.photoURL || u.photoURL || '';
      upd['participantPhotos.'+uid] = photo || '';
      fs.setDoc(fs.doc(window._nzDb,'dms',activeConvo), upd, { merge: true });
    });
    renderThread();
  }

  function renderThread() {
    setHTML(
      '<div class="nz-fadein">' +
      '<button onclick="nzDmBack()" style="background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:12px;margin-bottom:10px;">← All Messages</button>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">' +
        (activePhoto ? '<img src="'+H(activePhoto)+'" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">' :
          '<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#B02050);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">'+H(activeName.charAt(0).toUpperCase())+'</div>') +
        '<div style="font-size:15px;font-weight:700;color:var(--fg);">'+H(activeName)+'</div>' +
      '</div>' +
      '<div id="nz-dm-msgs" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;">' +
        skeletonLines(5) +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<input id="nz-dm-inp" type="text" placeholder="Message '+H(activeName)+'…" ' +
          'style="flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;outline:none;" ' +
          'onkeydown="if(event.key===\'Enter\')nzDmSend()">' +
        '<button onclick="nzDmSend()" class="nz-btn nz-btn-pri">Send ↑</button>' +
      '</div></div>'
    );
    subscribeThread();
  }

  function subscribeThread() {
    if (_dmMsgUnsub) { try{_dmMsgUnsub();}catch(e){} }
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      var me = window._nzUser.uid;
      var q = fs.query(fs.collection(window._nzDb,'dms',activeConvo,'messages'), fs.orderBy('timestamp','asc'), fs.limit(100));
      _dmMsgUnsub = fs.onSnapshot(q, function(snap){
        var box = $id('nz-dm-msgs'); if (!box) return;
        if (snap.empty) { box.innerHTML = '<div style="text-align:center;color:var(--fg-muted);font-size:12px;padding:30px;">Say hi to '+H(activeName)+'! 👋</div>'; return; }
        box.innerHTML = snap.docs.map(function(doc){
          var m = doc.data(), own = m.uid === me;
          return '<div style="display:flex;flex-direction:'+(own?'row-reverse':'row')+';gap:6px;">' +
            '<div style="max-width:75%;">' +
              '<div style="padding:8px 12px;border-radius:11px;font-size:13px;background:'+(own?'var(--primary)':'var(--card-elevated)')+';color:'+(own?'#fff':'var(--fg)')+';">'+H(m.text||'')+'</div>' +
            '</div></div>';
        }).join('');
        box.scrollTop = box.scrollHeight;
      });
      fs.updateDoc(fs.doc(window._nzDb,'dms',activeConvo), { lastReadBy: fs.arrayUnion(me) }).catch(function(){});
    });
  }

  window.nzDmSend = function() {
    var inp = $id('nz-dm-inp'); if (!inp || !inp.value.trim() || !activeConvo) return;
    var text = inp.value.trim(); inp.value = '';
    var u = getU(), d = getUD(), me = u.uid;
    var targetUid = (activeConvo.split('_')).filter(function(x){return x!==me;})[0];
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function(fs){
      fs.addDoc(fs.collection(window._nzDb,'dms',activeConvo,'messages'), {
        text: text, uid: me, displayName: d.displayName||u.displayName||'Learner', timestamp: fs.serverTimestamp()
      });
      fs.setDoc(fs.doc(window._nzDb,'dms',activeConvo), {
        lastMessage: text, lastSenderUid: me, lastTimestamp: fs.serverTimestamp(), lastReadBy: [me]
      }, { merge: true });
      if (targetUid) window.nzPushNotifTo(targetUid, 'chat', '✉️ New message', (d.displayName||u.displayName||'Someone')+': '+text.slice(0,60));
    });
  };

  window.nzDmBack = function() {
    if (_dmMsgUnsub) { try{_dmMsgUnsub();}catch(e){} }
    activeConvo = null; renderList();
  };

  loadConvos(function(){});
};

function loadLeaderboard(field) {

  if (b2) b2.className = 'nz-btn ' + (field==='streak' ? 'nz-btn-pri' : 'nz-btn-ghost');
  if (!window._nzDb) { box.innerHTML = '<div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:12px;">Leaderboard unavailable right now</div>'; return; }

    var q = fs.query(fs.collection(window._nzDb,'users'), fs.orderBy(field,'desc'), fs.limit(50));

      box.innerHTML = snap.docs.map(function(doc, i){
        var u = doc.data(), isMe = doc.id === me;
        return '<div style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);' + (isMe?'background:var(--primary-dim);':'') + '">' +
          '<div style="width:26px;text-align:center;font-size:14px;font-weight:800;color:var(--fg-muted);">'+(medals[i]||('#'+(i+1)))+'</div>' +
          (u.photoURL ? '<img src="'+H(u.photoURL)+'" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">' :
            '<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#B02050);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;">'+H((u.displayName||'?').charAt(0).toUpperCase())+'</div>') +
          '<div style="flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--fg);">'+H(u.displayName||'Learner')+(isMe?' <span style="font-size:10px;color:var(--primary);">(you)</span>':'')+'</div>' +
          '<div style="font-size:13px;font-weight:800;color:var(--primary);">'+(field==='xp' ? ((u.xp||0)+' XP') : ('🔥 '+(u.streak||0)))+'</div>' +
        '</div>';
      }).join('');
    }).catch(function(){ box.innerHTML = '<div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:12px;">Leaderboard unavailable right now</div>'; });
  });
}
