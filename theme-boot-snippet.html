<!-- PASTE THIS in <head>, BEFORE any <link rel="stylesheet">, on every page.
     Pink Cherry Blossom is the app-wide default theme; Dark, Sky Blue, Ocean,
     Emerald, Purple and Sunset are explicit opt-outs saved to localStorage.
     First-ever visit (no saved choice) respects the OS dark-mode preference
     instead of forcing Sakura. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('nz-theme');
    var CLASS_MAP = { 'light':'nz-light','light-blue':'nz-light-blue','ocean':'nz-ocean','emerald':'nz-emerald','purple':'nz-purple','sunset':'nz-sunset' };
    var cls;
    if (t && CLASS_MAP.hasOwnProperty(t)) cls = CLASS_MAP[t];
    else if (t === 'dark') cls = '';
    else { var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; cls = sysDark ? '' : 'nz-light'; }
    if (cls) document.documentElement.classList.add(cls);
  } catch (e) {}
})();
</script>

<!-- Then, AFTER css/tokens.css is linked, add this near the end of <head> or before </body>: -->
<script src="js/theme.js"></script>
